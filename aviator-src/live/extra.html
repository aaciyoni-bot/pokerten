<div id="loginModal">
  <div id="loginCard" dir="rtl">
    <h2>ברוכים הבאים למועדון</h2>
    <div class="note">AVIATORIZIS · משחק באסימונים בלבד — ללא כסף אמיתי.<br>סיבוב אחד משותף לכל השחקנים, בזמן אמת.</div>
    <input class="lgField" id="nickInput" type="text" maxlength="24" placeholder="הכינוי שלך במועדון" autocomplete="nickname">
    <button class="lgBtn" id="guestBtn">כניסה למשחק ✈</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="chatModal">
  <div id="chatCard" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="chatHeading" aria-describedby="chatSubtitle">
    <div id="chatHead"><div><h2 id="chatHeading">צ׳אט המועדון</h2><p id="chatSubtitle">שיחה עם הטייסים בחדר</p></div><button id="chatClose" aria-label="סגירת הצ׳אט">✕</button></div>
    <div id="chatList" role="log" aria-label="הודעות בחדר" aria-live="off" tabindex="0"></div>
    <form id="chatForm">
      <input id="chatInput" maxlength="140" placeholder="כתוב הודעה…" aria-label="הודעה לצ׳אט" aria-describedby="chatStatus chatCount" autocomplete="off" dir="auto">
      <button id="chatSend" type="submit">שלח</button>
    </form>
    <div id="chatFooter"><p id="chatStatus" role="status" aria-live="polite">עד 140 תווים להודעה</p><span id="chatCount">0/140</span></div>
  </div>
</div>

<div id="adminModal">
  <div id="adminCard" dir="rtl">
    <h2>פיקוח מנהל <button id="adminClose">✕</button></h2>
    <div class="admSec">שחקנים ויתרות</div>
    <div id="admPlayers" style="display:grid;gap:6px"></div>
    <div class="admSec">סיבובים אחרונים</div>
    <div id="admRounds" style="display:grid;gap:2px"></div>
  </div>
</div>
