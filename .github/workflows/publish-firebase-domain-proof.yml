name: Publish Firebase domain verification file

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-firebase-domain-proof.yml'
      - '.well-known/acme-challenge/nSaR864OAimEMUatksL9Sl6L01iM8I3XqJGYcYkE-fVXf5LwfhcTiCmfPA0xrOut'

concurrency:
  group: public-site-deployment
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the live Pages deployment matches the source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq '.[].id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
            case "$state" in
              failure|error|inactive) continue ;;
              success) test "$id" = 7984845098 && exit 0; exit 1 ;;
              *) exit 1 ;;
            esac
          done
          exit 1
      - name: Reuse the published site including its original Android package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45068478792
          artifact-ids: 14771599461
          merge-multiple: true
          path: ${{ runner.temp }}/previous-site
      - name: Append only the Firebase proof and verify its archived bytes
        env:
          PROOF: '.well-known/acme-challenge/nSaR864OAimEMUatksL9Sl6L01iM8I3XqJGYcYkE-fVXf5LwfhcTiCmfPA0xrOut'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/previous-site/artifact.tar"
          test -s "$archive"
          tar -tf "$archive" > "$RUNNER_TEMP/old-entries"
          if grep -Fqx "./$PROOF" "$RUNNER_TEMP/old-entries"; then exit 1; fi
          stage="$RUNNER_TEMP/staged-site"
          mkdir "$stage"
          tar -xf "$archive" -C "$stage"
          install -D -m 0644 "$PROOF" "$stage/$PROOF"
          # Use the original site layout, including real entries for both new directories.
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C "$stage" .
          tar -xOf "$RUNNER_TEMP/artifact.tar" "./$PROOF" | cmp - "$PROOF"
          python - "$archive" "$RUNNER_TEMP/artifact.tar" "$PROOF" <<'PY'
          import hashlib, pathlib, sys, tarfile
          def files(path):
              with tarfile.open(path) as bundle:
                  return {m.name: hashlib.file_digest(bundle.extractfile(m), 'sha256').digest()
                          for m in bundle if m.isfile()}
          before, after = map(files, sys.argv[1:3])
          proof = pathlib.Path(sys.argv[3])
          assert after.pop('./' + str(proof)) == hashlib.sha256(proof.read_bytes()).digest()
          assert after == before, 'A previously published file changed'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
