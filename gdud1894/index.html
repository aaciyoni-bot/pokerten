<title>גדוד 1894 — מערכת מאוחדת</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="מערכת גדודית מאוחדת — דוח 1, ניהול רכב וירוק בעיניים">
<meta name="theme-color" content="#155e3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#eef2ef; --panel:#fff; --panel2:#f5f8f5; --ink:#14231b; --ink2:#5c6f63; --mut:#8a9a8f;
  --line:#e0e7e1; --brand:#1f7a4d; --brand-d:#155e3a; --brand-l:#e7f4ec; --glow:#34c47d;
  --ok:#1f9d57; --okbg:#e6f6ec; --warn:#c67e12; --warnbg:#fdf3e0; --bad:#d63b3b; --badbg:#fdeaea;
  --info:#2563c4; --infobg:#e8f0fd;
  --r:18px; --sh:0 10px 30px -14px rgba(20,50,35,.35); --sh2:0 3px 10px -4px rgba(20,50,35,.2);
  color-scheme:light;
}
*{box-sizing:border-box} html,body{margin:0}
body{direction:rtl;font-family:"Rubik",system-ui,Arial,sans-serif;background:
  radial-gradient(1100px 480px at 90% -8%,rgba(31,122,77,.10),transparent 60%),var(--bg);
  color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:78px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--brand-d),var(--brand));color:#fff;box-shadow:0 6px 22px -12px rgba(0,0,0,.5)}
.head{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
.logo{width:44px;height:44px;border-radius:13px;background:#ffffff18;border:1px solid #ffffff33;display:grid;place-items:center;font-size:22px;flex:none;font-weight:900}
.head h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.head .sub{font-size:11.5px;color:#d7e9de;margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head>div{min-width:0}
.head .role{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.rolechip{background:#ffffff1c;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
#syncDot{font-size:11px;font-weight:700;color:#f2d9a6}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 14px}
.kpi{background:linear-gradient(180deg,#fff,var(--panel2));border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.kpi .n{font-size:26px;font-weight:900;line-height:1}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:3px;font-weight:600}
.kpi.acc{background:linear-gradient(180deg,var(--brand-l),#fff)}
.kpi.good .n{color:var(--ok)} .kpi.warnk .n{color:var(--warn)} .kpi.alert .n{color:var(--bad)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;transition:.14s}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 14px -8px var(--brand)}

.section-h{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px;gap:8px}
.section-h h2{font-size:16px;font-weight:800;position:relative;padding-inline-start:13px}
.section-h h2::before{content:"";position:absolute;inset-inline-start:0;top:.16em;bottom:.16em;width:4px;border-radius:3px;background:linear-gradient(180deg,var(--glow),var(--brand))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh2);margin-bottom:12px;position:relative;overflow:hidden}

/* hub module tiles */
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
.tile{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh2);text-align:right;width:100%;transition:transform .12s,box-shadow .2s;color:var(--ink)}
.tile:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.tile:active{transform:scale(.99)}
.tile .ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none;color:#fff}
.tile.d1 .ic{background:linear-gradient(140deg,#1f6fb2,#2fb0e0)}
.tile.veh .ic{background:linear-gradient(140deg,var(--brand-d),var(--glow))}
.tile.green .ic{background:linear-gradient(140deg,#166534,#4ade80)}
.tile .tt{flex:1;min-width:0}
.tile .tt b{font-size:16.5px;font-weight:800;display:block}
.tile .tt small{color:var(--ink2);font-size:12.5px;font-weight:500}
.tile .go{color:var(--mut);font-size:20px;font-weight:800}
.tile .ext{font-size:10.5px;font-weight:800;background:var(--panel2);color:var(--ink2);border-radius:7px;padding:3px 8px}

/* gauge */
.gauge .gtop{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px}
.gauge .gtop b{font-size:32px;font-weight:900;line-height:.85}
.gauge .gbar{height:15px;background:#e6ebe6;border-radius:8px;overflow:hidden;margin:9px 0 6px;box-shadow:inset 0 1px 3px rgba(20,50,35,.12)}
.gauge .gfill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge .gsub{font-size:12px;color:var(--ink2);font-weight:600}

/* status summary strip */
.stwrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.stpill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:800;border:1px solid transparent}
.stpill b{font-variant-numeric:tabular-nums}

/* soldier rows */
.grp-h{font-size:12.5px;font-weight:800;color:var(--ink2);margin:14px 2px 7px;display:flex;gap:7px;align-items:center}
.srow{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--sh2);margin-bottom:8px;transition:.12s}
.srow:active{transform:scale(.995)}
.srow .snm{flex:1;min-width:0}
.srow .snm b{font-size:14.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .snm small{color:var(--mut);font-size:11.5px}
.stchip{border:0;border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}

/* status picker */
.stopts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stopt{border:1px solid var(--line);border-radius:13px;padding:13px 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:9px;background:#fff;text-align:right}
.stopt .e{font-size:20px}
.stopt[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l) inset}

/* roster manage */
.mrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow .mck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:900;color:#fff;font-size:15px}
.mrow.on .mck{background:var(--brand);border-color:var(--brand)}
.mrow .mnm{flex:1;min-width:0} .mrow .mnm b{font-size:14px;font-weight:700} .mrow .mnm small{display:block;color:var(--mut);font-size:11.5px}

.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 44px 13px 14px;font-size:16px;background:#fff;box-shadow:var(--sh2)}
.search .ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:14px;color:var(--mut);font-size:17px}

.bottom{position:fixed;bottom:0;inset-inline:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.3)}
.bottom button{border:0;background:none;padding:9px 4px 6px;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s}
.bottom button .bi{font-size:20px;line-height:1;transition:transform .16s}
.bottom button.active{color:var(--brand)} .bottom button.active .bi{transform:translateY(-2px) scale(1.08)}

.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(900px 500px at 50% -10%,rgba(31,122,77,.18),transparent 60%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:28px 24px;box-shadow:0 30px 70px -30px rgba(20,50,35,.5);text-align:center}
.login .biglogo{width:84px;height:84px;border-radius:24px;background:linear-gradient(140deg,var(--brand-d),var(--glow));display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 16px 34px -12px var(--brand);color:#fff;font-size:34px;font-weight:900}
.login h2{font-size:22px;font-weight:900}.login .p{color:var(--ink2);font-size:13px;margin:4px 0 18px}
.login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;text-align:center;margin-bottom:10px}
.login input:focus{outline:none;border-color:var(--brand)}
.login .go{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand-d));box-shadow:0 12px 26px -12px var(--brand)}
.login .err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}

.modal{display:none;position:fixed;inset:0;background:#0007;z-index:9999;align-items:flex-end}
.modal.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px)}}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:14px}
.field{margin:11px 0}.field label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.srowbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:var(--panel2);color:var(--ink2)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--mut);font-weight:600}
.act-btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;font-size:13px;background:var(--brand-l);color:var(--brand-d);display:inline-flex;gap:7px;align-items:center;box-shadow:var(--sh2)}
.act-btn.wa{background:#e7f6ec;color:#128c4a}
.mod-acts{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 14px}.mod-acts .act-btn{flex:1;justify-content:center;min-width:130px}

/* planning / assignments */
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);margin-bottom:12px;overflow:hidden}
.mcard.gap{border-color:#f3c7c7}
.mcard .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;background:var(--panel2)}
.mcard .mh b{font-size:15px;font-weight:800} .mcard .mh .mcount{font-size:11.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.mcard.gap .mh .mcount{color:var(--bad)}
.reqs{display:flex;flex-wrap:wrap;gap:6px;padding:11px 15px 4px}
.req{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;font-size:11.5px;font-weight:800;border:1px solid}
.req.ok{background:var(--okbg);color:var(--ok);border-color:#bfe6cd}
.req.miss{background:var(--badbg);color:var(--bad);border-color:#f3c7c7}
.assigned{padding:8px 12px 10px;display:grid;gap:7px}
.arow{display:flex;align-items:center;gap:9px;background:var(--panel2);border-radius:11px;padding:9px 11px}
.arow .an{flex:1;min-width:0} .arow .an b{font-size:13.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .aq{font-size:11px;color:var(--ink2)}
.arow .rm{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;color:var(--bad);font-weight:800;flex:none}
.addbtn{margin:0 12px 12px;border:1px dashed var(--line);background:#fff;border-radius:11px;padding:10px;font-weight:800;color:var(--brand-d);width:calc(100% - 24px)}
.pickrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pickrow:last-child{border-bottom:0} .pickrow .pn2{flex:1;min-width:0}
.pickrow .pn2 b{font-size:14px} .pickrow .pn2 small{display:block;color:var(--mut);font-size:11px}

@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)} .stopts{grid-template-columns:1fr}}
@media(max-width:480px){
  body{font-size:14px;padding-bottom:74px} .wrap{padding:12px 11px}
  .head{gap:8px;padding:10px 11px} .head h1{font-size:16px}
  .kpi .n{font-size:22px}
  .sheet{padding:16px} .login-card{padding:24px 18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

}

function doLogin(){
  const pn=($('#lgPn').value||'').replace(/\D/g,''), pin=($('#lgPin').value||'').replace(/\D/g,'');
  if(pn==='1894'||pn==='0000'){ start('officer','קצין הגדוד',null); return; }
  const d=ROSTER.find(x=>x.pn===pn);
  if(!d){ $('#lgErr').textContent='מספר אישי לא נמצא'; return; }
  if(pin!==d.pin){ $('#lgErr').textContent='קוד שגוי (4 ספרות אחרונות)'; return; }
  let role='viewer',sc=null;
  if(d.role==='קצין רכב') role='officer';
  else if(['א','ג','ד'].includes(d.company)){ role='commander'; sc={'א':'A','ג':'C','ד':'D'}[d.company]; }
  else role='viewer';
  start(role,d.name,sc);
}
function start(role,name,scope){ sess={role,name,scope}; $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  applyRole(); go('home'); if(name) setTimeout(()=>toast('👋 ברוך הבא, '+firstName(name)),350); }
function applyRole(){ $('#roleChip').textContent=ROLE_CHIP[sess.role]+(sess.scope?' · '+FRBY[sess.scope].name:'');

function canEdit(){ return sess.role==='officer'||sess.role==='sergeant'||sess.role==='commander'; }

/* ===== scope helpers ===== */
function scopedRoster(){ let l=ROSTER.filter(d=>d.pn);
  if(sess.role==='commander'){ const c=CO_LETTER[sess.scope]; l=l.filter(d=>d.company===c); } return l; }
// mobilized soldiers in scope (only those the officer added to the מצבה)
function activeRoster(){ const set=new Set(S.active); return scopedRoster().filter(d=>set.has(d.pn)); }
function statusOf(pn){ return (S.reports[d1date]||{})[pn]||'לא דווח'; }

/* ===== HOME / hub ===== */
function renderHome(){
  const act=activeRoster(); const present=act.filter(d=>statusOf(d.pn)==='נוכח').length;
  const pct=act.length?Math.round(present/act.length*100):0;
  const col=pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)';
  let h=`<div class="section-h"><h2>תמונת מצב — ${esc(sess.scope?FRBY[sess.scope].name:'הגדוד')}</h2></div>`;
  h+=`<div class="card gauge"><div class="gtop"><span>🟢 נוכחות דוח 1 · ${fmtHe(d1date)}</span><b style="color:${col}" class="tnum">${pct}%</b></div>
    <div class="gbar"><div class="gfill" style="width:${pct}%;background:${col}"></div></div>
    <div class="gsub">${present} נוכחים מתוך ${act.length} מגויסים${act.length?'':' · טרם הוגדרה מצבה'}</div></div>`;
  h+=`<div class="section-h"><h2>מודולים</h2></div><div class="tiles">
    <button class="tile d1" onclick="go('doh1')"><div class="ic">📋</div><div class="tt"><b>דוח 1 — נוכחות</b><small>מצבה יומית · דיווח וייצוא</small></div><span class="go">›</span></button>

    <button class="tile green" onclick="go('green')"><div class="ic">🟢</div><div class="tt"><b>ירוק בעיניים</b><small>ספירת תחמושת וצל״מ</small></div><span class="ext">מודול</span></button>

}

  if(!commander && d1co!=='all') list=act.filter(d=>(d.company||'—')===d1co);

  // counts
  const cnt={}; D1ST.forEach(s=>cnt[s.v]=0); list.forEach(d=>cnt[statusOf(d.pn)]++);
  const present=cnt['נוכח']||0; const reported=list.length-(cnt['לא דווח']||0);
  const pct=list.length?Math.round(present/list.length*100):0;
  const col=pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)';

  let h=`<div class="section-h"><h2>📋 דוח 1 — נוכחות</h2>
    ${canEdit()?`<button class="chip" onclick="manageRoster()">⚙️ מצבה</button>`:''}</div>`;
  h+=`<div class="field" style="margin:0 0 12px"><input type="date" value="${d1date}" onchange="d1date=this.value;watchDate();render()"></div>`;

  if(!act.length){
    h+=`<div class="empty">אין חיילים במצבה עדיין.<br>${canEdit()?'לחצו על ⚙️ מצבה כדי להוסיף את המגויסים בפועל.':'טרם הוגדרה מצבה על ידי הקצין.'}</div>`;
    if(canEdit()) h+=`<div class="mod-acts" style="margin-top:12px"><button class="act-btn" onclick="manageRoster()">⚙️ הגדרת מצבה (מגויסים)</button></div>`;
    $('#screen').innerHTML=h; return;
  }

  h+=`<div class="card gauge"><div class="gtop"><span>נוכחות</span><b style="color:${col}" class="tnum">${pct}%</b></div>
    <div class="gbar"><div class="gfill" style="width:${pct}%;background:${col}"></div></div>
    <div class="gsub">${present} נוכחים · ${reported}/${list.length} דווחו</div>
    <div class="stwrap">${D1ST.filter(s=>cnt[s.v]).map(s=>`<span class="stpill" style="background:${s.bg};color:${s.c}">${s.e} ${esc(s.v)} <b>${cnt[s.v]}</b></span>`).join('')}</div></div>`;

  h+=`<div class="mod-acts"><button class="act-btn wa" onclick="exportReport()">📤 ייצוא דוח 1</button>
    ${canEdit()?`<button class="act-btn" onclick="markAllPresent()">✅ סמן הכל נוכח</button>`:''}</div>`;

  if(!commander){ h+=`<div class="chips">${chip('all','כל המסגרות',d1co==='all',"d1co='all';render()")}
    ${cos.map(c=>chip(c,'פלוגה '+c,d1co===c,`d1co='${esc(c)}';render()`)).join('')}</div>`; }

  // group by dept within scope
  const byDept={}; list.forEach(d=>{const k=(d.company?('פלוגה '+d.company):'')+(d.dept?(' · '+d.dept):''); (byDept[k]=byDept[k]||[]).push(d);});
  Object.keys(byDept).sort().forEach(k=>{
    h+=`<div class="grp-h">${esc(k||'כללי')} <span style="color:var(--mut)">(${byDept[k].length})</span></div>`;
    byDept[k].forEach(d=>{ const st=STBY[statusOf(d.pn)]||STBY['לא דווח'];
      h+=`<div class="srow"><div class="snm"><b>${esc(d.name)}</b><small>${esc(d.role||'—')}${piiOk()?' · מ״א '+esc(d.pn):''}</small></div>
        <button class="stchip" style="background:${st.bg};color:${st.c}" onclick="pickStatus('${esc(d.pn)}')">${st.e} ${esc(st.v)}</button></div>`; });
  });
  $('#screen').innerHTML=h;
}

function chip(id,label,on,fn){ return `<button class="chip" aria-pressed="${on}" onclick="${fn}">${esc(label)}</button>`; }

function toggleActive(pn){ const i=S.active.indexOf(pn); if(i<0)S.active.push(pn); else S.active.splice(i,1); save(); renderManage(mgSearch); }
function bulkActive(){ const dg=mgSearch.replace(/\D/g,''); const base=scopedRoster();
  const list=base.filter(d=> !mgSearch || (d.name||'').includes(mgSearch) || (dg&&d.pn.includes(dg)) );
  const set=new Set(S.active); list.forEach(d=>set.add(d.pn)); S.active=[...set]; save(); renderManage(mgSearch); }

function exportReport(){
  const commander=sess.role==='commander'; let list=activeRoster();
  if(!commander && d1co!=='all') list=list.filter(d=>(d.company||'—')===d1co);
  const scopeName = commander?FRBY[sess.scope].name:(d1co==='all'?'הגדוד':'פלוגה '+d1co);
  const cnt={}; D1ST.forEach(s=>cnt[s.v]=0); list.forEach(d=>cnt[statusOf(d.pn)]++);
  const present=cnt['נוכח']||0;
  const L=['📋 דוח 1 — '+scopeName, '📅 '+fmtHe(d1date),
    `נוכחים: ${present}/${list.length} (${list.length?Math.round(present/list.length*100):0}%)`,''];
  D1ST.forEach(s=>{ if(s.v==='לא דווח'||!cnt[s.v])return; const names=list.filter(d=>statusOf(d.pn)===s.v).map(d=>d.name);
    L.push(`${s.e} ${s.v} (${cnt[s.v]}): ${names.join(', ')}`); });
  const nr=list.filter(d=>statusOf(d.pn)==='לא דווח');
  if(nr.length) L.push('', `⚪ טרם דווחו (${nr.length}): ${nr.map(d=>d.name).join(', ')}`);
  window.open('https://wa.me/?text='+encodeURIComponent(L.join('\n')),'_blank');
}

/* ===== PLAN — manpower planning by missions & qualifications ===== */
const QUALS=[
 {id:'mk',name:'מ״כ',e:'🎖️'},{id:'mag',name:'מא״ג',e:'🔫'},{id:'negev',name:'נגב',e:'🪖'},
 {id:'matol',name:'מטול',e:'💥'},{id:'medic',name:'חובש',e:'⛑️'},{id:'sharp',name:'קלע',e:'🎯'},
 {id:'driver',name:'נהג',e:'🚗'},{id:'radio',name:'קשר',e:'📡'},
];
const QBY={}; QUALS.forEach(q=>QBY[q.id]=q);
function defaultReq(slot){ const s=slot||'';
  if(s.indexOf('סיור')>=0) return {req:[['mk',1],['mag',1],['driver',1],['medic',1]],size:5};
  if(s.indexOf('חפ')>=0)   return {req:[['driver',1],['radio',1]],size:4};
  if(s.indexOf('כ')>=0&&s.indexOf('כ')!==s.lastIndexOf('כ')) return {req:[['mk',1],['mag',1]],size:6}; // כ״כ
  if(s.indexOf('כוננות')>=0) return {req:[['mk',1],['mag',1]],size:6};
  return {req:[],size:4};
}
function missionsFor(fid){ if(S.missions[fid]) return S.missions[fid];
  const fr=FRBY[fid]; const arr=((fr&&fr.slots)||[]).map((slot,i)=>{ const d=defaultReq(slot);
    return {id:'m'+i,name:slot,req:d.req.map(a=>({q:a[0],n:a[1]})),size:d.size}; });
  S.missions[fid]=arr; return arr; }
function qualsOf(pn){ return new Set(S.quals[pn]||[]); }
function fwCompanyLetter(fid){ return CO_LETTER[fid]||null; }
function fwSoldiers(fid){ const c=fwCompanyLetter(fid); return c?ROSTER.filter(d=>d.pn&&d.company===c):[]; }
function isAvailable(pn){ return statusOf(pn)==='נוכח'; }
function planCell(fid,mid){ return (((S.plan[d1date]||{})[fid]||{})[mid])||[]; }
function assignedInFw(fid){ const p=(S.plan[d1date]||{})[fid]||{}; const s=new Set(); Object.values(p).forEach(a=>a.forEach(pn=>s.add(pn))); return s; }
function setPlan(fid,mid,arr){ S.plan[d1date]=S.plan[d1date]||{}; S.plan[d1date][fid]=S.plan[d1date][fid]||{}; S.plan[d1date][fid][mid]=arr; save(); }

let planFw=null;
function renderPlan(){
  const commander=sess.role==='commander';
  const fids = commander ? [sess.scope] : Object.keys(CO_LETTER);
  if(!planFw||fids.indexOf(planFw)<0) planFw=fids[0];
  const fid=planFw, fr=FRBY[fid];
  const soldiers=fwSoldiers(fid), avail=soldiers.filter(d=>isAvailable(d.pn));
  const missions=missionsFor(fid), assigned=assignedInFw(fid);

  let h=`<div class="section-h"><h2>🧩 שיבוץ ואיוש — ${esc(fr.name)}</h2>
    ${canEdit()?`<button class="chip" onclick="editMissions('${fid}')">⚙️ משימות</button>`:''}</div>`;
  h+=`<div class="field" style="margin:0 0 10px"><input type="date" value="${d1date}" onchange="d1date=this.value;watchDate();render()"></div>`;
  if(!commander) h+=`<div class="chips">${fids.map(f=>chip(f,FRBY[f].name,f===fid,`planFw='${f}';render()`)).join('')}</div>`;

  h+=`<div class="card" style="padding:13px 15px"><div style="display:flex;justify-content:space-between;font-weight:800"><span>זמינים היום (נוכחים)</span><b class="tnum">${avail.length}/${soldiers.length}</b></div>
    <div style="font-size:12px;color:var(--ink2);margin-top:3px">${avail.length?('משובצים: '+assigned.size+' · פנויים: '+avail.filter(d=>!assigned.has(d.pn)).length):'אין נוכחים — מלאו דוח 1 כדי לזהות זמינות'}</div>
    ${canEdit()?`<div class="mod-acts" style="margin:12px 0 0"><button class="act-btn" onclick="autoAssign('${fid}')">⚡ שיבוץ אוטומטי</button><button class="act-btn wa" onclick="exportPlan('${fid}')">📤 ייצוא</button><button class="act-btn" style="background:var(--panel2);color:var(--ink2)" onclick="clearPlan('${fid}')">🧹 נקה</button></div>
      <button class="chip" style="margin-top:9px" onclick="manageQuals('${fid}')">🏅 כשירויות חיילים</button>`:''}</div>`;

  missions.forEach(m=>{ const list=planCell(fid,m.id);
    const reqHtml=m.req.map(r=>{ const have=list.filter(pn=>qualsOf(pn).has(r.q)).length, ok=have>=r.n;
      return `<span class="req ${ok?'ok':'miss'}">${QBY[r.q]?QBY[r.q].e:''} ${esc(QBY[r.q]?QBY[r.q].name:r.q)} ${have}/${r.n}</span>`; }).join('');
    const gap=m.req.some(r=>list.filter(pn=>qualsOf(pn).has(r.q)).length<r.n)||list.length<m.size;
    h+=`<div class="mcard ${gap?'gap':''}"><div class="mh"><b>${esc(m.name)}</b><span class="mcount">${list.length}/${m.size}${gap?' · ⚠ פער':' · ✓ מלא'}</span></div>
      ${reqHtml?`<div class="reqs">${reqHtml}</div>`:''}
      <div class="assigned">${list.map(pn=>{const d=ROSTER.find(x=>x.pn===pn)||{};const qs=[...qualsOf(pn)];
        return `<div class="arow"><div class="an"><b>${esc(d.name||pn)}</b><span class="aq">${qs.length?qs.map(q=>QBY[q]?QBY[q].e+QBY[q].name:q).join(' · '):'ללא כשירות רשומה'}</span></div>
        ${canEdit()?`<button class="rm" onclick="unassign('${fid}','${m.id}','${pn}')">✕</button>`:''}</div>`;}).join('')||'<div style="color:var(--mut);font-size:12.5px;padding:2px">— טרם שובצו —</div>'}</div>
      ${canEdit()?`<button class="addbtn" onclick="pickAssign('${fid}','${m.id}')">➕ הוסף חייל זמין</button>`:''}</div>`;
  });
  $('#screen').innerHTML=h;
}
function unassign(fid,mid,pn){ if(!canEdit())return; setPlan(fid,mid,planCell(fid,mid).filter(x=>x!==pn)); render(); }
function assign(fid,mid,pn){ if(!canEdit())return; const cur=planCell(fid,mid); if(cur.indexOf(pn)<0) setPlan(fid,mid,cur.concat(pn)); }
function clearPlan(fid){ if(!canEdit())return; if(!confirm('לנקות את כל השיבוץ למסגרת זו בתאריך זה?'))return; if(S.plan[d1date])delete S.plan[d1date][fid]; save(); toast('נוקה'); render(); }
function autoAssign(fid){ if(!canEdit())return;
  const missions=missionsFor(fid); const used=assignedInFw(fid);
  let pool=fwSoldiers(fid).filter(d=>isAvailable(d.pn)&&!used.has(d.pn)).map(d=>d.pn);
  if(!pool.length){ toast('אין נוכחים פנויים לשיבוץ'); return; }
  missions.forEach(m=>{ let list=planCell(fid,m.id).slice();
    m.req.forEach(r=>{ let have=list.filter(pn=>qualsOf(pn).has(r.q)).length;
      while(have<r.n){ const idx=pool.findIndex(pn=>qualsOf(pn).has(r.q)); if(idx<0)break; list.push(pool.splice(idx,1)[0]); have++; } });
    while(list.length<m.size&&pool.length) list.push(pool.shift());
    setPlan(fid,m.id,list);
  });
  toast('⚡ שובץ אוטומטית'); render();
}
let pickSearch='';
function pickAssign(fid,mid){ if(!canEdit())return; renderPick(fid,mid,''); $('#modal').classList.add('show'); }
function renderPick(fid,mid,q){ pickSearch=q; const assigned=assignedInFw(fid);
  const m=missionsFor(fid).find(x=>x.id===mid), list=planCell(fid,mid);
  const missing=new Set(m.req.filter(r=>list.filter(pn=>qualsOf(pn).has(r.q)).length<r.n).map(r=>r.q));
  let sold=fwSoldiers(fid).filter(d=>isAvailable(d.pn)&&!assigned.has(d.pn));
  const dg=q.replace(/\D/g,''); if(q) sold=sold.filter(d=>(d.name||'').indexOf(q)>=0||(dg&&d.pn.indexOf(dg)>=0));
  sold.sort((a,b)=>([...qualsOf(a.pn)].some(x=>missing.has(x))?0:1)-([...qualsOf(b.pn)].some(x=>missing.has(x))?0:1));
  $('#sheet').innerHTML=`<h3>שיבוץ ל${esc(m.name)}</h3>
    ${missing.size?`<div style="font-size:12.5px;color:var(--bad);font-weight:700;margin-bottom:8px">חסר: ${[...missing].map(x=>QBY[x].name).join(', ')} — מסומן ⭐</div>`:''}
    <div class="search"><span class="ic">🔍</span><input value="${esc(q)}" placeholder="חיפוש זמין" oninput="renderPick('${fid}','${mid}',this.value)"></div>
    <div style="max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:14px">${sold.slice(0,150).map(d=>{const qs=[...qualsOf(d.pn)],hot=qs.some(x=>missing.has(x));
      return `<div class="pickrow" onclick="assign('${fid}','${mid}','${d.pn}');closeSheet();render()"><div class="pn2"><b>${esc(d.name)}${hot?' ⭐':''}</b><small>${esc(d.role||'')} ${qs.map(x=>QBY[x]?QBY[x].e:'').join('')}</small></div></div>`;}).join('')||'<div style="padding:16px;text-align:center;color:var(--mut)">אין חיילים זמינים פנויים</div>'}</div>
    <div class="srowbtns"><span></span><button class="btn ghost" onclick="closeSheet()">סגירה</button></div>`;
}
let qSearch='';
function manageQuals(fid){ if(!canEdit())return; renderQuals(fid,''); $('#modal').classList.add('show'); }
function renderQuals(fid,q){ qSearch=q; let sold=fwSoldiers(fid); const dg=q.replace(/\D/g,'');
  if(q) sold=sold.filter(d=>(d.name||'').indexOf(q)>=0||(dg&&d.pn.indexOf(dg)>=0));
  $('#sheet').innerHTML=`<h3>כשירויות — ${esc(FRBY[fid].name)}</h3>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:8px">סמנו לכל חייל את הכשירויות (מא״ג, חובש, נהג...). ישמשו לשיבוץ ולזיהוי פערים.</div>
    <div style="max-height:60vh;overflow:auto">${sold.slice(0,120).map(d=>{const set=qualsOf(d.pn);
      return `<div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px"><b style="font-size:14px">${esc(d.name)}</b>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">${QUALS.map(qd=>`<button onclick="toggleQual('${fid}','${d.pn}','${qd.id}')" style="border:1px solid ${set.has(qd.id)?'var(--brand)':'var(--line)'};background:${set.has(qd.id)?'var(--brand-l)':'#fff'};color:${set.has(qd.id)?'var(--brand-d)':'var(--ink2)'};border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800">${qd.e} ${esc(qd.name)}</button>`).join('')}</div></div>`;}).join('')||'<div style="padding:16px;text-align:center;color:var(--mut)">אין חיילים</div>'}</div>
    <div class="srowbtns"><span></span><button class="btn primary" onclick="closeSheet();render()">סיום</button></div>`;
}
function toggleQual(fid,pn,qid){ S.quals[pn]=S.quals[pn]||[]; const i=S.quals[pn].indexOf(qid);
  if(i<0)S.quals[pn].push(qid); else S.quals[pn].splice(i,1); if(!S.quals[pn].length)delete S.quals[pn]; save(); renderQuals(fid,qSearch); }
function editMissions(fid){ if(!canEdit())return; const ms=missionsFor(fid);
  $('#sheet').innerHTML=`<h3>הגדרת משימות — ${esc(FRBY[fid].name)}</h3>

    <div style="max-height:62vh;overflow:auto">${ms.map((m,mi)=>`<div style="border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:14.5px">${esc(m.name)}</b>
        <label style="font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center">גודל צוות<input type="number" min="0" max="20" value="${m.size}" style="width:64px;padding:8px" onchange="setMissionSize('${fid}',${mi},this.value)"></label></div>
      <div style="display:grid;gap:7px;margin-top:9px">${QUALS.map(q=>{const r=m.req.find(x=>x.q===q.id),n=r?r.n:0;
        return `<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;font-size:13px;font-weight:700">${q.e} ${esc(q.name)}</span>
          <button class="rm" style="width:32px;height:32px" onclick="setReq('${fid}',${mi},'${q.id}',${n-1})">−</button>
          <b style="min-width:22px;text-align:center" class="tnum">${n}</b>
          <button class="rm" style="width:32px;height:32px;color:var(--brand-d);border-color:var(--brand-l)" onclick="setReq('${fid}',${mi},'${q.id}',${n+1})">+</button></div>`;}).join('')}</div></div>`).join('')}</div>
    <div class="srowbtns"><span></span><button class="btn primary" onclick="closeSheet();render()">שמור וסיום</button></div>`;
  $('#modal').classList.add('show');
}
function setMissionSize(fid,mi,v){ const ms=missionsFor(fid); ms[mi].size=Math.max(0,parseInt(v,10)||0); S.missions[fid]=ms; save(); }
function setReq(fid,mi,qid,n){ n=Math.max(0,n); const ms=missionsFor(fid),m=ms[mi],r=m.req.find(x=>x.q===qid);
  if(n<=0) m.req=m.req.filter(x=>x.q!==qid); else if(r) r.n=n; else m.req.push({q:qid,n});
  S.missions[fid]=ms; save(); editMissions(fid); }
function exportPlan(fid){ const fr=FRBY[fid], ms=missionsFor(fid);
  const L=['🧩 שיבוץ — '+fr.name,'📅 '+fmtHe(d1date),''];
  ms.forEach(m=>{ const list=planCell(fid,m.id);
    L.push('▸ '+m.name+' ('+list.length+'/'+m.size+'):');
    list.forEach(pn=>{const d=ROSTER.find(x=>x.pn===pn)||{};const qs=[...qualsOf(pn)].map(q=>QBY[q]?QBY[q].name:q);L.push('   • '+d.name+(qs.length?' ['+qs.join(',')+']':''));});
    const gaps=m.req.filter(r=>list.filter(pn=>qualsOf(pn).has(r.q)).length<r.n).map(r=>QBY[r.q].name+' חסר '+(r.n-list.filter(pn=>qualsOf(pn).has(r.q)).length));
    if(list.length<m.size) gaps.push('חסרים '+(m.size-list.length)+' לוחמים');
    if(gaps.length) L.push('   ⚠ פער: '+gaps.join(' · '));
    L.push('');
  });
  window.open('https://wa.me/?text='+encodeURIComponent(L.join('\n')),'_blank');
}

/* modal + toast + date fmt */
function fmtHe(d){ if(!d)return'—'; const[y,m,dd]=d.split('-'); return dd+'/'+m+'/'+y; }
function closeSheet(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal')closeSheet(); });
let toastT; function toast(m){ let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:99999;background:#14231b;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 10px 30px -8px #0007;opacity:0;transition:opacity .2s';document.body.appendChild(t);}
  t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,1800); }
