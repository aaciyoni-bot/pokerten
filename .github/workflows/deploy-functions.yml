name: Deploy Firebase Functions

# Auto-deploys Cloud Functions on any push that touches functions/
# Requires a repo secret named FIREBASE_TOKEN (from `firebase login:ci`)

on:
  push:
    branches:
      - main
      - claude/pokerten-v1
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
      - '!functions/aviator*'
      - '!functions/test/aviator*'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Select poker functions only
        id: targets
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const aviator = new Set(['avJoin','avTick','avBet','avCancelBet','avCashout','avPeek','avCredit']);
          const names = Object.entries(require('./functions'))
            .filter(([name, value]) => !aviator.has(name) && typeof value === 'function' && (value.__endpoint || value.__trigger))
            .map(([name]) => name);
          if (!names.length) throw new Error('No poker function exports found');
          console.log('only=' + names.map(name => 'functions:' + name).join(','));
          JS
      - name: Deploy poker functions without changing AVIATOR
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only "${{ steps.targets.outputs.only }}" --project pokerten --non-interactive

      - name: Verify personal-code signing before publishing its login UI
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://us-central1-pokerten.cloudfunctions.net/pkPinStatus', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: {}})
          });
          const result = await response.json();
          if (!response.ok || result.result?.available !== true) {
            const reasons = ['signing-api-disabled', 'signing-permission', 'signing-configuration', 'signing-unavailable'];
            const reason = reasons.includes(result.result?.reason) ? result.result.reason : 'readiness-request-failed';
            throw new Error('Personal-code signing is unavailable: ' + reason);
          }
          console.log('Personal-code token signing verified; no user account was created.');
          JS
