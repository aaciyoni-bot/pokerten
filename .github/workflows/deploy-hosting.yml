name: Deploy Firebase Hosting

# Serves the precompiled site (this branch) on Firebase Hosting:
#   https://pokerten.web.app  and  https://pokerten.firebaseapp.com
# Independent of the pokerten.com custom-domain DNS — a reliable fallback link.
# Requires repo secret FIREBASE_TOKEN (same one used by the functions deploy).

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'ammo.html'
      - 'greeneyes/**'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'icon-*.png'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # The "ירוק בעיניים" app (greeneyes/) lives on its own hosting site inside
      # the same Firebase project — greeneyes95.web.app (+ the greeneyes95.com
      # custom domain, connected once in the Firebase console). First run
      # creates the site; later runs find it existing and continue.
      - name: Ensure greeneyes95 site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:create greeneyes95 --project pokerten --non-interactive || echo "greeneyes95 site already exists — continuing"

      - name: Deploy hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project pokerten --non-interactive
