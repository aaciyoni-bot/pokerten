<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MURMUR — a storytelling party game</title>
<meta name="theme-color" content="#0b0f1a" />
<style>
  :root{
    --bg:#0b0f1a; --bg2:#121a2e; --felt:#123a2e; --felt2:#0e2c22;
    --ink:#eef2ff; --muted:#9fb0d0; --line:#25314f;
    --gold:#f4c95d; --gold2:#e0a93b; --accent:#6ea8ff; --accent2:#3b6fd6;
    --good:#57d99a; --bad:#ff7a7a; --chip:#1b2740;
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #152036 0, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #16224a 0, transparent 55%),
      linear-gradient(160deg,var(--bg),#070a12 70%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:var(--accent)}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0 4px}
  .brand h1{
    font-size:clamp(28px,7vw,52px);letter-spacing:.22em;margin:0;font-weight:800;
    background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold)}
  .tag{text-align:center;color:var(--muted);letter-spacing:.28em;text-transform:uppercase;font-size:12px;margin-bottom:22px}

  .card-panel{
    background:linear-gradient(180deg,rgba(24,33,58,.92),rgba(15,21,40,.92));
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px;backdrop-filter:blur(6px);
  }
  .stack{display:grid;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1 1 auto}
  label.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:6px}
  input,select{
    width:100%;background:#0e152a;border:1px solid var(--line);color:var(--ink);
    padding:13px 14px;border-radius:12px;font-size:16px;outline:none;transition:border .15s,box-shadow .15s;
  }
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,255,.18)}
  .code-in{letter-spacing:.4em;text-align:center;font-weight:800;text-transform:uppercase;font-size:22px}
  button{
    cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;
    color:#0b0f1a;background:linear-gradient(180deg,var(--gold),var(--gold2));
    box-shadow:0 6px 18px rgba(224,169,59,.28);transition:transform .08s ease,filter .15s,opacity .15s;
  }
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  button.ghost:hover{border-color:var(--accent);color:#fff}
  button.blue{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(59,111,214,.3)}
  button.sm{padding:9px 12px;font-size:13px;border-radius:10px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:4px 0}
  .divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

  .muted{color:var(--muted)}
  .small{font-size:13px}
  .err{color:var(--bad);font-size:13px;min-height:16px}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
  .pill .num{color:var(--gold);font-weight:800}

  /* players */
  .players{display:flex;gap:10px;flex-wrap:wrap}
  .pcard{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:130px}
  .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0b0f1a;background:linear-gradient(180deg,var(--gold),var(--gold2))}
  .pcard.host .avatar{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff}
  .pcard .nm{font-weight:700;font-size:14px;line-height:1.1}
  .pcard .sc{font-size:12px;color:var(--muted)}
  .badge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 5px;margin-left:auto}
  .badge.you{color:var(--accent);border-color:var(--accent)}
  .badge.done{color:var(--good);border-color:var(--good)}

  /* board / hand */
  .phase-hd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:6px}
  .phase-hd h2{margin:0;font-size:20px}
  .clue-box{
    text-align:center;font-size:clamp(20px,4.4vw,30px);font-weight:800;color:var(--gold);
    padding:14px;border:1px dashed var(--gold);border-radius:14px;background:rgba(244,201,93,.06);margin:6px 0 4px;
    word-break:break-word;
  }
  .clue-quote{font-style:italic}
  .cardgrid{
    display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-top:12px;
  }
  .gcard{
    position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);
    background:#0a0f1f;aspect-ratio:3/4;cursor:pointer;transition:transform .12s ease,border-color .15s,box-shadow .15s;
  }
  .gcard img{width:100%;height:100%;object-fit:cover;display:block}
  .gcard:hover{transform:translateY(-4px);border-color:var(--accent)}
  .gcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,201,93,.35),0 12px 24px rgba(0,0,0,.5)}
  .gcard.dim{opacity:.5}
  .gcard.locked{cursor:default}
  .gcard.locked:hover{transform:none;border-color:var(--line)}
  .gcard .ribbon{
    position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;font-weight:700;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));color:#fff;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  }
  .gcard .tick{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#0b0f1a;display:grid;place-items:center;font-weight:900;font-size:15px}
  .vote-chip{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:1px 7px;font-size:11px}
  .owner-tag{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px;font-size:11px}
  .story-tag{color:var(--gold)}

  .waiting{display:flex;align-items:center;gap:10px;color:var(--muted);padding:10px 0}
  .spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e152a;border:1px solid var(--line);
    padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:50;max-width:90vw;text-align:center}

  .scoretable{width:100%;border-collapse:collapse;margin-top:8px}
  .scoretable th,.scoretable td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
  .scoretable th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .delta{color:var(--good);font-weight:800}
  .delta.zero{color:var(--muted)}

  .topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
  .roomtag{font-weight:800;letter-spacing:.3em;color:var(--gold)}
  .help{font-size:13px;color:var(--muted);line-height:1.55}
  .winner{text-align:center;padding:20px}
  .winner .crown{font-size:54px}
  .winner h2{font-size:30px;margin:6px 0}
  details.setup{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:#0c1226}
  details.setup summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
  code{background:#0e152a;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
  @media (max-width:520px){
    .cardgrid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
    .wrap{padding:14px 12px 50px}
    .card-panel{padding:16px}
  }
</style>
</head>

<script type="module">
import { h, render } from "preact";
import { useState, useEffect, useRef, useMemo } from "preact/hooks";
import htm from "htm";
const html = htm.bind(h);

/* ------------------------------------------------------------------ *
 *  Firebase (Firestore) — loaded lazily, only for online rooms.       *
 * ------------------------------------------------------------------ */
let FB = null;                 // { db, doc, setDoc, onSnapshot, runTransaction, deleteField }
let fbInitError = null;
const fbConfig = window.MURMUR_FIREBASE || {};
const fbConfigured = fbConfig.apiKey && !String(fbConfig.apiKey).startsWith("PASTE");

async function ensureFirebase(){
  if (FB) return FB;
  if (!fbConfigured) throw new Error("Online play is not configured yet.");
  const [{ initializeApp }, fs] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
  ]);
  const app = initializeApp(fbConfig);
  const db = fs.getFirestore(app);
  FB = { db, doc: fs.doc, setDoc: fs.setDoc, getDoc: fs.getDoc,
         onSnapshot: fs.onSnapshot, runTransaction: fs.runTransaction,
         deleteField: fs.deleteField, serverTimestamp: fs.serverTimestamp };
  return FB;
}

/* ------------------------------------------------------------------ *
 *  Deck — the animal images already in this repo.                     *
 * ------------------------------------------------------------------ */
const DECK = ["Ant","BabyChick","Bat","BearFace","Bird","BlowFish","Boar","Bug","Butterfly",
"Camel","CatFace","Cat","ChickenFace","CowFace","Cow","Crab","Cricket","Crocodile","DeerFace",
"DogFace","Dog","Dolphin","DragonFace","Dragon","EagleFace","Elephant","Ewe","Fish","Flamingo",
"FoxFace","FrogFace","Giraffe","Goat","Gorilla","Hamster","HatchingChick","HedgehogFace",
"Hippopotamus","HoneyBee","HorseFace","Horse","KoalaFace","LadyBeetle","LionFace","Lizard",
"Llama","Lobster","Microbe","MonkeyFace","Monkey","Mosquitos","MouseFace","Mouse","Octopus",
"Owl","Ox","PandaFace","Parrot","PigFace","Pig"].map(n => n + "_2k.png");

const cardSrc = id => id;   // images sit next to this file

/* ------------------------------------------------------------------ *
 *  Small helpers                                                      *
 * ------------------------------------------------------------------ */
const uid = () => {
  let v = localStorage.getItem("murmur_uid");
  if (!v){ v = "u_" + Math.random().toString(36).slice(2,10); localStorage.setItem("murmur_uid", v); }
  return v;
};
const MY = uid();
const savedName = () => localStorage.getItem("murmur_name") || "";
const genCode = () => { const A="ABCDEFGHJKLMNPQRSTUVWXYZ"; let s=""; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; };
const initials = n => (n||"?").trim().slice(0,2).toUpperCase();
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clone = o => JSON.parse(JSON.stringify(o));

/* ------------------------------------------------------------------ *
 *  Pure game engine — shared by local + online play.                  *
 *  A "game" is a plain object (serialisable to Firestore).            *
 * ------------------------------------------------------------------ */
const Engine = {
  newGame(hostUid, hostName, opts){
    return {
      status:"lobby",
      hostUid,
      targetScore: opts?.targetScore || 30,
      handSize: 6,
      players: { [hostUid]: { name: hostName, score: 0 } },
      order: [hostUid],
      deck: [], discard: [], hands: {},
      round: 0, storyteller: null,
      clue: "", storyCard: null,
      submissions: {}, votes: {}, board: [],
      scoring: null, winners: null,
    };
  },

  addPlayer(g, id, name){
    if (g.status!=="lobby") return g;
    if (g.players[id]) { g.players[id].name = name; return g; }
    g.players[id] = { name, score:0 };
    g.order.push(id);
    return g;
  },

  start(g){
    if (g.status!=="lobby" || g.order.length < 3) return g;
    g.deck = shuffle(DECK);
    g.discard = [];
    g.hands = {};
    for (const id of g.order){
      g.hands[id] = g.deck.splice(0, g.handSize);
    }
    g.round = 1;
    g.storyteller = g.order[0];
    g.status = "clue";
    g.clue=""; g.storyCard=null; g.submissions={}; g.votes={}; g.board=[]; g.scoring=null;
    return g;
  },

  setClue(g, id, cardId, clue){
    if (g.status!=="clue" || id!==g.storyteller) return g;
    if (!g.hands[id]?.includes(cardId) || !clue.trim()) return g;
    g.storyCard = cardId;
    g.clue = clue.trim();
    g.status = "submit";
    return g;
  },

  submit(g, id, cardId){
    if (g.status!=="submit" || id===g.storyteller) return g;
    if (!g.players[id] || !g.hands[id]?.includes(cardId)) return g;
    g.submissions[id] = cardId;
    // when every non-storyteller has submitted -> voting
    const voters = g.order.filter(u => u!==g.storyteller);
    if (voters.every(u => g.submissions[u])){
      const cards = [g.storyCard, ...voters.map(u => g.submissions[u])];
      g.board = shuffle(cards);
      g.status = "vote";
    }
    return g;
  },

  vote(g, id, cardId){
    if (g.status!=="vote" || id===g.storyteller) return g;
    if (g.submissions[id]===cardId) return g;        // can't vote your own
    if (!g.board.includes(cardId)) return g;
    g.votes[id] = cardId;
    const voters = g.order.filter(u => u!==g.storyteller);
    if (voters.every(u => g.votes[u])){
      Engine._score(g);
      g.status = "reveal";
    }
    return g;
  },

  _ownerOf(g, cardId){
    if (cardId===g.storyCard) return g.storyteller;
    for (const u in g.submissions) if (g.submissions[u]===cardId) return u;
    return null;
  },

  _score(g){
    const voters = g.order.filter(u => u!==g.storyteller);
    const N = voters.length;
    const correct = voters.filter(u => g.votes[u]===g.storyCard).length;
    const delta = {}; g.order.forEach(u => delta[u]=0);

    if (correct===0 || correct===N){
      voters.forEach(u => delta[u]+=2);            // storyteller fooled everyone / nobody
    } else {
      delta[g.storyteller]+=3;
      voters.forEach(u => { if (g.votes[u]===g.storyCard) delta[u]+=3; });
    }
    // +1 to a card's owner for every vote it received (storyteller excluded)
    const votesFor = {};
    voters.forEach(u => { const c=g.votes[u]; votesFor[c]=(votesFor[c]||0)+1; });
    for (const c in votesFor){
      const o = Engine._ownerOf(g, c);
      if (o && o!==g.storyteller) delta[o]+=votesFor[c];
    }
    g.order.forEach(u => g.players[u].score += delta[u]);

    g.scoring = {
      correct, voters:N,
      cards: g.board.map(c => ({
        id:c, owner:Engine._ownerOf(g,c), isStory:c===g.storyCard,
        voters: voters.filter(u => g.votes[u]===c),
      })),
      delta,
      votesByUser: clone(g.votes),
    };
  },

  next(g){
    if (g.status!=="reveal") return g;
    // check win
    const top = Math.max(...g.order.map(u => g.players[u].score));
    if (top >= g.targetScore){
      g.winners = g.order.filter(u => g.players[u].score===top);
      g.status = "ended";
      return g;
    }
    // discard played cards, refill hands
    const played = [g.storyCard, ...Object.values(g.submissions)];
    g.discard.push(...played);
    for (const u of g.order){
      const used = (u===g.storyteller) ? g.storyCard : g.submissions[u];
      g.hands[u] = g.hands[u].filter(c => c!==used);
      if (g.hands[u].length < g.handSize){
        if (g.deck.length===0){ g.deck = shuffle(g.discard); g.discard=[]; }
        if (g.deck.length) g.hands[u].push(g.deck.shift());
      }
    }
    // rotate storyteller
    const idx = g.order.indexOf(g.storyteller);
    g.storyteller = g.order[(idx+1)%g.order.length];
    g.round += 1;
    g.clue=""; g.storyCard=null; g.submissions={}; g.votes={}; g.board=[]; g.scoring=null;
    g.status = "clue";
    return g;
  },
};

/* ------------------------------------------------------------------ *
 *  Online room store (Firestore) — thin wrapper over the engine.      *
 *  The whole game object lives in one doc: murmurRooms/{code}.        *
 *  Phase-advancing moves are wrapped in a transaction so two clients  *
 *  finishing at once can't double-apply.                              *
 * ------------------------------------------------------------------ */
const Online = {
  ref(code){ return FB.doc(FB.db, "murmurRooms", code); },

  async create(code, name){
    await ensureFirebase();
    const g = Engine.newGame(MY, name, {});
    await FB.setDoc(this.ref(code), { game:g, updated:Date.now() });
  },
  async join(code, name){
    await ensureFirebase();
    const snap = await FB.getDoc(this.ref(code));
    if (!snap.exists()) throw new Error("No room with that code.");
    await FB.runTransaction(FB.db, async tx => {
      const d = await tx.get(this.ref(code));
      if (!d.exists()) throw new Error("No room with that code.");
      const g = d.data().game;
      if (g.status!=="lobby" && !g.players[MY]) throw new Error("That game has already started.");
      Engine.addPlayer(g, MY, name);
      tx.set(this.ref(code), { game:g, updated:Date.now() });
    });
  },
  subscribe(code, cb){
    return FB.onSnapshot(this.ref(code), s => cb(s.exists()? s.data().game : null));
  },
  // apply an engine move transactionally
  async move(code, fn){
    await FB.runTransaction(FB.db, async tx => {
      const d = await tx.get(this.ref(code));
      if (!d.exists()) return;
      const g = d.data().game;
      fn(g);
      tx.set(this.ref(code), { game:g, updated:Date.now() });
    });
  },
};

function Clue({g, me, act}){
  const isStory = g.storyteller===me;
  const [pick,setPick]=useState(null);
  const [clue,setClue]=useState("");
  const st = g.players[g.storyteller];
  if (!isStory){
    return html`<div class="waiting"><div class="spinner"></div> <b style="color:var(--gold)">${st.name}</b> is thinking of a clue…</div>`;
  }
  return html`<div>
    <div class="muted small">You are the storyteller. Pick a card, then give a clue that is not too obvious, not too obscure.</div>
    <div class="row" style="margin-top:12px">
      <input class="grow" placeholder="Your clue…" maxlength="60" value=${clue} onInput=${e=>setClue(e.target.value)} />
      <button disabled=${!pick||!clue.trim()} onClick=${()=>act(g=>Engine.setClue(g,me,pick,clue))}>Tell it</button>
    </div>
    <div class="cardgrid">
      ${g.hands[me].map(c => html`<${Card} key=${c} id=${c} sel=${pick===c} onClick=${()=>setPick(c)}/>`) }
    </div>
  </div>`;
}

function Submit({g, me, act}){
  const isStory = g.storyteller===me;
  const mine = g.submissions[me];
  const [pick,setPick]=useState(null);
  const voters = g.order.filter(u=>u!==g.storyteller);
  const done = voters.filter(u=>g.submissions[u]).length;
  return html`<div>
    <div class="clue-box"><span class="clue-quote">“${g.clue}”</span></div>
    ${isStory
      ? html`<div class="waiting"><div class="spinner"></div> Players are choosing a card to match your clue… (${done}/${voters.length})</div>`
      : mine
        ? html`<div class="waiting"><div class="spinner"></div> Card played. Waiting for others… (${done}/${voters.length})</div>`
        : html`<div>
            <div class="muted small">Pick a card from your hand that fits the clue.</div>
            <div class="row" style="margin-top:10px">
              <button disabled=${!pick} onClick=${()=>act(g=>Engine.submit(g,me,pick))}>Play this card</button>
            </div>
            <div class="cardgrid">
              ${g.hands[me].map(c => html`<${Card} key=${c} id=${c} sel=${pick===c} onClick=${()=>setPick(c)}/>`) }
            </div>
          </div>`}
  </div>`;
}

function Vote({g, me, act}){
  const isStory = g.storyteller===me;
  const myVote = g.votes[me];
  const [pick,setPick]=useState(null);
  const voters = g.order.filter(u=>u!==g.storyteller);
  const done = voters.filter(u=>g.votes[u]).length;
  return html`<div>
    <div class="clue-box"><span class="clue-quote">“${g.clue}”</span></div>
    ${isStory
      ? html`<div class="waiting"><div class="spinner"></div> Players are voting for your card… (${done}/${voters.length})</div>`
      : html`<div>
          <div class="muted small">${myVote?"Vote locked. Waiting for the others…":"Which card is the storyteller's? (You can't pick your own.)"}</div>
          ${!myVote && html`<div class="row" style="margin-top:10px">
            <button disabled=${!pick} onClick=${()=>act(g=>Engine.vote(g,me,pick))}>Vote</button>
          </div>`}
        </div>`}
    <div class="cardgrid">
      ${g.board.map(c => {
        const own = g.submissions[me]===c;
        const locked = isStory || !!myVote || own;
        const sel = myVote? myVote===c : pick===c;
        return html`<${Card} key=${c} id=${c} sel=${sel} dim=${own} locked=${locked}
          ribbon=${own?html`<span class="owner-tag">your card</span>`:null}
          onClick=${()=>setPick(c)}/>`;
      })}
    </div>
  </div>`;
}

function Reveal({g, act}){
  const isHost = g.hostUid===MY;
  const sc = g.scoring;
  const nm = id => g.players[id]?.name || "?";
  return html`<div>
    <div class="clue-box"><span class="clue-quote">“${g.clue}”</span> <span class="muted small" style="display:block;font-size:13px;margin-top:4px">— ${nm(g.storyteller)}</span></div>
    <div class="cardgrid">
      ${sc.cards.map(cd => html`<${Card} key=${cd.id} id=${cd.id} locked=${true}
        sel=${cd.isStory}
        ribbon=${html`<span class=${"owner-tag"+(cd.isStory?" story-tag":"")}>${cd.isStory?"🎙️ "+nm(cd.owner):nm(cd.owner)}</span>
          ${cd.voters.map(v=>html`<span class="vote-chip">${initials(nm(v))}</span>`)}`}/>`)}
    </div>
    <table class="scoretable">
      <thead><tr><th>Player</th><th>This round</th><th>Total</th></tr></thead>
      <tbody>
        ${g.order.map(id=>html`<tr key=${id}>
          <td>${nm(id)}${id===g.storyteller?" 🎙️":""}</td>

        </tr>`)}

    </table>
    <div class="row" style="margin-top:14px">
      ${isHost

    </div>
  </div>`;
}

function Ended({g, onAgain, onHome}){
  const nm = id => g.players[id]?.name || "?";
  const win = (g.winners||[]).map(nm).join(" & ");
  const sorted = g.order.slice().sort((a,b)=>g.players[b].score-g.players[a].score);
  const isHost = g.hostUid===MY;
  return html`<div class="winner">

}

/* ================================================================== *
 *  Root                                                               *
 * ================================================================== */
function App(){
  const [screen,setScreen]=useState("home");     // home | lobby | game | end
  const [online,setOnline]=useState(false);
  const [code,setCode]=useState("");
  const [game,setGame]=useState(null);
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState("");
  const [toastMsg,setToastMsg]=useState("");
  const [revealed,setRevealed]=useState(null);   // hotseat: whose curtain is lifted
  const unsub=useRef(null);
  const localG=useRef(null);

  // In hotseat, the player who should be holding the device right now.
  const localActor=(g)=>{
    if (g.status==="clue") return g.storyteller;
    if (g.status==="submit") return g.order.find(u=>u!==g.storyteller && !g.submissions[u]) || null;
    if (g.status==="vote")   return g.order.find(u=>u!==g.storyteller && !g.votes[u]) || null;
    return null;
  };

  const toast=(m)=>{
    if (m==="share"){
      const url=location.origin+location.pathname+"#"+code;
      const txt=`Join my MURMUR game — room ${code}: ${url}`;
      if (navigator.share) { navigator.share({title:"MURMUR",text:txt,url}).catch(()=>{}); return; }
      navigator.clipboard?.writeText(txt); m="Invite copied!";
    }
    setToastMsg(m); setTimeout(()=>setToastMsg(""),2200);
  };

  // route from #code in the URL
  useEffect(()=>{
    const hash=location.hash.replace("#","").toUpperCase().replace(/[^A-Z]/g,"");
    if (hash.length===4 && fbConfigured && savedName()){
      doJoin(savedName(), hash);
    }
  },[]); // eslint-disable-line

  const cleanup=()=>{ if(unsub.current){unsub.current();unsub.current=null;} localG.current=null; };

  /* ---- online actions ---- */
  async function doCreate(name){
    setError(""); setBusy(true);
    try{
      const c=genCode();
      await Online.create(c,name);
      setCode(c); setOnline(true);
      unsub.current=Online.subscribe(c, g=>onRemote(g));
      history.replaceState(null,"","#"+c);
    }catch(e){ setError(e.message||"Could not create room."); }
    setBusy(false);
  }
  async function doJoin(name,c){
    setError(""); setBusy(true);
    try{
      await Online.join(c,name);
      setCode(c); setOnline(true);
      unsub.current=Online.subscribe(c, g=>onRemote(g));
      history.replaceState(null,"","#"+c);
    }catch(e){ setError(e.message||"Could not join room."); }
    setBusy(false);
  }
  function onRemote(g){
    if (!g){ setError("The room was closed."); goHome(); return; }
    setGame(g);
    setScreen(g.status==="lobby" ? "lobby" : g.status==="ended" ? "end" : "game");
  }

  /* ---- local (hotseat) ---- */
  function doLocal(name){
    // seed with the host; more players are added in a tiny setup step
    const g=Engine.newGame(MY,name,{});
    // hotseat needs >=3 players: add placeholders the host can rename
    Engine.addPlayer(g,"p2","Player 2");
    Engine.addPlayer(g,"p3","Player 3");
    localG.current=g; setOnline(false); setCode(""); setRevealed(null); setGame(clone(g)); setScreen("lobby");
  }

  /* apply an engine move (fn mutates a game object) */
  async function act(fn){
    if (online){
      try{ await Online.move(code, fn); }
      catch(e){ toast(e.message||"Move failed"); }
    } else {
      const g=clone(localG.current); fn(g); localG.current=g;
      setGame(g);
      setScreen(g.status==="lobby"?"lobby":g.status==="ended"?"end":"game");
    }
  }

  function startGame(){ act(g=>Engine.start(g)); }
  function playAgain(){
    if (online) act(g=>{ const ng=Engine.newGame(g.hostUid,g.players[g.hostUid].name,{targetScore:g.targetScore});
      // keep everyone
      for(const id of g.order){ if(id!==g.hostUid) Engine.addPlayer(ng,id,g.players[id].name); }
      Object.assign(g,ng); });
    else { const g=localG.current; const ng=Engine.newGame(g.hostUid,g.players[g.hostUid].name,{targetScore:g.targetScore});
      for(const id of g.order){ if(id!==g.hostUid) Engine.addPlayer(ng,id,g.players[id].name); }
      localG.current=ng; setGame(clone(ng)); setScreen("lobby"); }
  }
  function goHome(){ cleanup(); setOnline(false); setCode(""); setGame(null); setRevealed(null); setScreen("home"); history.replaceState(null,"",location.pathname); }

  if (screen==="home")
    return html`<${Home} onLocal=${doLocal} onCreate=${doCreate} onJoin=${doJoin} busy=${busy} error=${error}/>`;

  if (!game) return html`<div class="wrap"><div class="waiting"><div class="spinner"></div> Loading…</div></div>`;

  if (screen==="lobby")
    return html`<div>
      ${!online && html`<${LocalLobby} g=${game} act=${act} onStart=${startGame} onHome=${goHome}/>`}
      ${online && html`<${Lobby} g=${game} code=${code} online=${true} onStart=${startGame} onLeave=${goHome} toast=${toast}/>`}
      ${toastMsg && html`<div class="toast">${toastMsg}</div>`}
    </div>`;

  if (screen==="end")
    return html`<div class="wrap"><div class="card-panel"><${Ended} g=${game} onAgain=${playAgain} onHome=${goHome}/></div></div>`;

  const me = online ? MY : localActor(game);
  if (!online && game.status!=="reveal" && me && revealed!==me)
    return html`<${Curtain} name=${game.players[me].name} onReady=${()=>setRevealed(me)}/>`;

  return html`<div>
    <${GameView} g=${game} me=${me} code=${code} online=${online} act=${act} onHome=${goHome}/>
    ${toastMsg && html`<div class="toast">${toastMsg}</div>`}
  </div>`;
}

/* Local hotseat lobby lets the host set player names & count (3–8). */
function LocalLobby({g, act, onStart, onHome}){
  const setName=(id,v)=>act(gg=>{ if(gg.players[id]) gg.players[id].name=v; });
  const addP=()=>act(gg=>{ const id="p"+(gg.order.length+1)+"_"+Math.random().toString(36).slice(2,5);
    Engine.addPlayer(gg,id,"Player "+(gg.order.length+1)); });
  const delP=(id)=>act(gg=>{ if(id===gg.hostUid) return; delete gg.players[id]; gg.order=gg.order.filter(x=>x!==id); });
  return html`<div class="wrap">
    <${Brand}/>
    <div class="card-panel stack">
      <div class="muted small">Pass-and-play on one device. Set each player's name (3–8 players).</div>
      ${g.order.map((id,i)=>html`<div class="row" key=${id}>
        <div class="avatar">${i+1}</div>
        <input class="grow" maxlength="16" value=${g.players[id].name} onInput=${e=>setName(id,e.target.value)} />
        ${id!==g.hostUid && g.order.length>3 && html`<button class="ghost sm" onClick=${()=>delP(id)}>✕</button>`}
      </div>`)}
      <div class="row">
        ${g.order.length<8 && html`<button class="ghost sm" onClick=${addP}>+ Add player</button>`}
      </div>
      <div class="row">
        <button class="grow" disabled=${g.order.length<3} onClick=${onStart}>Start game</button>
        <button class="ghost" onClick=${onHome}>Home</button>
      </div>
    </div>
  </div>`;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
