name: Verify poker security rules
on:
  pull_request:
    branches: [main]
    paths: ['firestore.rules', 'tests/security/**', '.github/workflows/security-rules.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix tests/security --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - run: npm test --prefix tests/security
      - name: Check server-authoritative cash and tournament lifecycle
        run: tests/security/node_modules/.bin/firebase emulators:exec --config firebase.security.json --project demo-pokerten-security --only firestore 'node --test tests/security/poker-server.test.cjs'
