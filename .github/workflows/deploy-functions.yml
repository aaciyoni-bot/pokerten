name: Deploy Firebase Functions

# Auto-deploys Cloud Functions on any push that touches functions/
# Requires a repo secret named FIREBASE_TOKEN (from `firebase login:ci`)

on:
  push:
    branches:
      - main
      - claude/pokerten-v1
    paths:
      - 'functions/**'
      - '!functions/aviator*'
      - '!functions/test/aviator*'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm --prefix functions install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Select poker functions only
        id: targets
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const aviator = new Set(['avJoin','avTick','avBet','avCancelBet','avCashout','avPeek','avCredit','avStream']);
          const names = Object.keys(require('./functions')).filter(name => !aviator.has(name));
          if (!names.length) throw new Error('No poker function exports found');
          console.log('only=' + names.map(name => 'functions:' + name).join(','));
          JS
      - name: Deploy poker functions without changing AVIATOR
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only "${{ steps.targets.outputs.only }}" --project pokerten --non-interactive
