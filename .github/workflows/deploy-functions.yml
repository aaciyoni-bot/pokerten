name: Deploy AVIATOR functions

on:
  push:
    branches: [claude/gambling-game-graph-08c7yw]
    paths: ['functions/aviator.js', 'functions/aviatorCore.js', 'functions/aviatorStream.js']
  workflow_dispatch: {}

concurrency:
  group: aviator-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/claude/gambling-game-graph-08c7yw'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scope the AVIATOR deployment to changed services
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const {execFileSync}=require('node:child_process');
          let streamOnly=false;
          if (/^[a-f0-9]{40}$/.test(process.env.BEFORE_SHA || '') && !/^0+$/.test(process.env.BEFORE_SHA)) {
            const changed=execFileSync('git',['diff','--name-only',process.env.BEFORE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n');
            streamOnly=changed.includes('functions/aviatorStream.js') &&
              !changed.includes('functions/aviator.js') && !changed.includes('functions/aviatorCore.js');
          }
          console.log('stream_only='+streamOnly);
          console.log('targets='+ (streamOnly ? 'functions:avStream' :
            'functions:avJoin,functions:avTick,functions:avCancelBet,functions:avCashout,functions:avPeek,functions:avCredit,functions:avStream'));
          JS
      - name: Verify source build and timing regressions
        run: |
          node aviator-src/live/build-live.js
          git diff --exit-code -- aviator-live.html
          node --test functions/aviator.test.js functions/aviatorStream.test.js aviator-src/live/timing.test.cjs aviator-ux.test.cjs
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Record database location for latency verification
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase firestore:databases:list --project pokerten --json
      - name: Require IDs on new bets before upgrading exits
        if: steps.scope.outputs.stream_only != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions:avBet --project pokerten --non-interactive
      - name: Deploy only compatible AVIATOR functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only "${{ steps.scope.outputs.targets }}" --project pokerten --non-interactive
      - name: Verify exact live chip settlement through the Firebase API
        run: node functions/test/aviatorLiveProbe.cjs --confirm-play-money-production
