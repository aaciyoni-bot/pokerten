<title>ניהול צי רכב — גדוד</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="מערכת ניהול צי רכב, נהגים ותזקיקים גדודית">
<meta name="theme-color" content="#155e3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#eef2ef; --panel:#fff; --panel2:#f5f8f5; --ink:#14231b; --ink2:#5c6f63; --mut:#8a9a8f;
  --line:#e0e7e1; --brand:#1f7a4d; --brand-d:#155e3a; --brand-l:#e7f4ec; --glow:#34c47d;
  --ok:#1f9d57; --okbg:#e6f6ec; --warn:#c67e12; --warnbg:#fdf3e0; --bad:#d63b3b; --badbg:#fdeaea;
  --info:#2563c4; --infobg:#e8f0fd; --army:#111; --civil:#ffd400;
  --r:18px; --sh:0 10px 30px -14px rgba(20,50,35,.35); --sh2:0 3px 10px -4px rgba(20,50,35,.2);
  color-scheme:light;
}
*{box-sizing:border-box} html,body{margin:0}
body{direction:rtl;font-family:"Rubik",system-ui,Arial,sans-serif;background:
  radial-gradient(1100px 480px at 90% -8%,rgba(31,122,77,.10),transparent 60%),var(--bg);
  color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:78px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--brand-d),var(--brand));color:#fff;box-shadow:0 6px 22px -12px rgba(0,0,0,.5)}
.head{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
.logo{width:44px;height:44px;border-radius:13px;background:#ffffff18;border:1px solid #ffffff33;display:grid;place-items:center;font-size:22px;flex:none}
.head h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.head .sub{font-size:11.5px;color:#d7e9de;margin-top:2px;font-weight:500}
.head .role{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.rolechip{background:#ffffff1c;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;font-size:21px}

/* menu */
.menu-pop{display:none;position:fixed;top:66px;inset-inline-start:12px;z-index:70;width:min(300px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 45px -18px rgba(0,0,0,.4);padding:8px;overflow:hidden}
.menu-pop.show{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.menu-pop button{width:100%;border:0;background:#fff;border-radius:11px;padding:12px 13px;text-align:right;font-weight:700;color:var(--ink);display:flex;gap:10px;align-items:center}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop .sep{height:1px;background:var(--line);margin:6px 4px}
.menu-pop .danger{color:#a13333}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--sh2);position:relative;overflow:hidden;transition:transform .12s}
.kpi:active{transform:scale(.98)}
.kpi .n{font-size:27px;font-weight:900;line-height:1}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:3px;font-weight:600}
.kpi.acc::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--brand)}
.kpi.alert{background:var(--badbg);border-color:#f3c7c7}.kpi.alert .n{color:var(--bad)}
.kpi.good .n{color:var(--ok)} .kpi.warnk .n{color:var(--warn)}
.kpi.clk{cursor:pointer}

/* filter chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;transition:.14s}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 14px -8px var(--brand)}

/* search */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 44px 13px 14px;font-size:15px;background:#fff;box-shadow:var(--sh2)}
.search .ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:14px;color:var(--mut);font-size:17px}

/* vehicle grid */
.section-h{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px}
.section-h h2{font-size:16px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh2);transition:transform .12s,box-shadow .2s;overflow:hidden}
.vcard:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.vcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--stripe,var(--line))}
.vcard.s-ok{--stripe:var(--ok)} .vcard.s-mission{--stripe:var(--info)} .vcard.s-bad{--stripe:var(--bad)}
.vcard.s-service{--stripe:var(--warn)} .vcard.s-wait{--stripe:var(--mut)}
.card-x{position:absolute;top:10px;inset-inline-start:10px;z-index:5;width:28px;height:28px;border-radius:9px;border:1px solid #f0c2c2;background:#fff;color:var(--bad);font-size:19px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;transition:.12s}
.card-x:active{transform:scale(.9)}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-inline-start:26px}
.vtitle{min-width:0}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:118px;height:34px;border-radius:6px;font-weight:900;letter-spacing:.6px;direction:ltr;padding:0 10px;font-size:16px;box-shadow:0 1px 3px #0002}
.plate.army{background:var(--army);color:#fff;border:2px solid #e9e9e9;position:relative;padding-inline-end:26px}
.plate.army::after{content:'צ';position:absolute;inset-inline-end:7px;font-weight:900}
.plate.civil{background:var(--civil);color:#111;border:2px solid #111;position:relative;padding-inline-start:24px}
.plate.civil::before{content:'🇮🇱';position:absolute;inset-inline-start:5px;font-size:11px}
.vtype{font-size:12.5px;color:var(--ink2);margin-top:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;height:max-content;display:inline-flex;gap:4px;align-items:center}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.mission{background:var(--infobg);color:var(--info)}
.pill.bad{background:var(--badbg);color:var(--bad)} .pill.service{background:var(--warnbg);color:var(--warn)} .pill.wait{background:#eef0ee;color:#6a776e}
.vmeta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.mbox{background:var(--panel2);border-radius:11px;padding:8px 10px}
.mbox small{display:block;color:var(--mut);font-size:10.5px;font-weight:600} .mbox b{font-size:13px}
.valert{margin-top:9px;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.valert.bad{background:var(--badbg);color:var(--bad)} .valert.warn{background:var(--warnbg);color:var(--warn)}
.vacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.vacts button{border:0;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800;background:var(--panel2);color:var(--ink2);transition:.12s}
.vacts button:active{transform:scale(.96)}
.vacts .b-ok{background:var(--okbg);color:var(--ok)} .vacts .b-move{background:var(--infobg);color:var(--info)} .vacts .b-edit{background:var(--brand-l);color:var(--brand-d)}

/* fuel */
.fuel-base{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh2);margin-bottom:12px}
.fuel-base h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.frow{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin:9px 0}
.frow .fk{font-size:13px;color:var(--ink2);font-weight:600}
.ftrk{height:12px;background:#ecefec;border-radius:7px;overflow:hidden}
.ffill{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fv{font-size:13px;font-weight:800;text-align:left}
.cardlist{display:grid;gap:8px}
.fcard{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--sh2)}
.fcard .fic{width:40px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--brand),var(--glow));color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.fcard b{font-size:14px} .fcard small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.fcard .st{margin-inline-start:auto}

/* drivers */
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--sh2);margin-bottom:9px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dname{font-size:15.5px;font-weight:800}
.dsub{font-size:12px;color:var(--ink2);margin-top:2px}
.permits{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.perm{font-size:11px;font-weight:700;background:var(--brand-l);color:var(--brand-d);border-radius:8px;padding:3px 9px}
.phone-line{display:flex;gap:7px;margin-top:10px;align-items:center}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:16px}
.mini.wa{color:#128c4a}
.dcard{transition:transform .12s,box-shadow .2s} .dcard:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.dchips{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12.5px;color:var(--ink2);font-weight:600}
.dchips .more{margin-inline-start:auto;color:var(--brand);font-weight:800}
.sfx{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;font-size:11.5px;font-weight:800;color:var(--warn);transition:.12s}
.sfx:active{transform:scale(.95)} .sfx.on{background:var(--okbg);color:var(--ok);border-color:#bfe6cd}
.sbadge{font-size:11.5px;font-weight:800} .sbadge.on{color:var(--ok)} .sbadge.off{color:var(--warn)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.dg{background:var(--panel2);border-radius:11px;padding:9px 11px}
.dg small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px} .dg b{font-size:13.5px}

/* bottom nav */
.bottom{position:fixed;bottom:0;inset-inline:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.3)}
.bottom button{border:0;background:none;padding:9px 4px 6px;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s}
.bottom button .bi{font-size:20px;line-height:1;transition:transform .16s}
.bottom button.active{color:var(--brand)} .bottom button.active .bi{transform:translateY(-2px) scale(1.08)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:
  radial-gradient(900px 500px at 50% -10%,rgba(31,122,77,.18),transparent 60%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:28px 24px;box-shadow:0 30px 70px -30px rgba(20,50,35,.5);text-align:center}
.login .biglogo{width:82px;height:82px;border-radius:24px;background:linear-gradient(140deg,var(--brand-d),var(--glow));display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 16px 34px -12px var(--brand)}
.veh{display:block} .biglogo .veh{width:56px;height:auto} .logo .veh{width:30px;height:auto}
.login h2{font-size:22px;font-weight:900}.login .p{color:var(--ink2);font-size:13px;margin:4px 0 18px}
.login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;text-align:center;margin-bottom:10px}
.login input:focus{outline:none;border-color:var(--brand)}
.login .go{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand-d));box-shadow:0 12px 26px -12px var(--brand)}
.login .go:active{transform:scale(.98)} .login .err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}

/* modal */
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:9999;align-items:flex-end}
.modal.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px)}}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:14px}
.field{margin:11px 0}.field label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:var(--panel2);color:var(--ink2)}

.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--mut);font-weight:600}
.demo-tag{display:inline-block;font-size:10px;font-weight:800;background:#fff4d8;color:#8a6410;border-radius:6px;padding:2px 7px;margin-inline-start:6px}
/* dashboard feature cards */
.gauge .gtop{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px}
.gauge .gtop b{font-size:30px;font-family:"Rubik"}
.gauge .gbar{height:14px;background:#ecefec;border-radius:8px;overflow:hidden;margin:9px 0 6px}
.gauge .gfill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge .gsub{font-size:12px;color:var(--ink2)}
.attn-grp{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.attn-grp summary{list-style:none;cursor:pointer;padding:11px 12px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;background:var(--panel2)}
.attn-grp summary::-webkit-details-marker{display:none}
.attn-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
.attn-row span{color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .attn-row b{white-space:nowrap}
.fov-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 11px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.fov-row:first-child{border-top:0} .fov-n{font-weight:800} .fov-stats{color:var(--ink2);font-size:12px}
.tl-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-top:1px solid var(--line);font-size:12.5px}
.tl-row:first-of-type{border-top:0} .tl-row span:last-child{color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-when{font-weight:800;min-width:74px;font-size:12px;color:var(--warn)} .tl-row.late .tl-when{color:var(--bad)} .tl-row.soon .tl-when{color:#b9820f}
.act-btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:13px;background:var(--brand-l);color:var(--brand-d);display:inline-flex;gap:7px;align-items:center;box-shadow:var(--sh2);transition:transform .12s,box-shadow .2s}
.act-btn:active{transform:scale(.97)} .act-btn:hover{box-shadow:var(--sh)}
.act-btn.wa{background:#e7f6ec;color:#128c4a}
.mod-acts{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 14px}
.mod-acts .act-btn{flex:1;justify-content:center;min-width:140px}

/* content module card (dashboard sections + driver detail blocks) */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh2);margin-bottom:12px;position:relative;overflow:hidden}
.card>.section-h:first-child{margin-top:0}
.card>.section-h{margin:0 0 8px} .card>.section-h h2{font-size:15px}
.detail-block{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-top:10px}
.detail-block>small{display:block;color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.02em}

/* section accent bar — a small tactical tick before every heading */
.section-h h2{position:relative;padding-inline-start:13px}
.section-h h2::before{content:"";position:absolute;inset-inline-start:0;top:.16em;bottom:.16em;width:4px;border-radius:3px;background:linear-gradient(180deg,var(--glow),var(--brand))}

/* KPI — soft top-lit tint + colored accent for plain tiles */
.kpi{background:linear-gradient(180deg,#fff,var(--panel2))}
.kpi.acc{background:linear-gradient(180deg,var(--brand-l),#fff)}

/* richer readiness gauge */
.gauge{background:linear-gradient(140deg,#fff 40%,var(--brand-l))}
.gauge .gtop b{font-size:34px;font-weight:900;line-height:.85}
.gauge .gbar{height:16px;background:#e6ebe6;box-shadow:inset 0 1px 3px rgba(20,50,35,.12)}
.gauge .gfill{position:relative;box-shadow:0 3px 12px -4px rgba(20,50,35,.45)}
.gauge .gfill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%)}
.gauge .gsub{margin-top:2px;font-weight:600}

/* attention group — colored left edge by severity + smooth open */
.attn-grp{box-shadow:var(--sh2)} .attn-grp[open]{border-color:#d9e2db}
.attn-row:hover{background:var(--panel2)} .attn-row .plate{transform:scale(.86);transform-origin:right}
.tl-row .plate,.attn-row .plate{flex:none}

/* QR sheet (per-framework, printable) */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qr-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 13px;text-align:center;box-shadow:var(--sh2);break-inside:avoid}
.qr-card .qh{font-weight:900;font-size:16px}
.qr-card .qb{font-size:12px;color:var(--ink2);margin:2px 0 11px}
.qr-card .qimg{width:100%;max-width:186px;margin:0 auto;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.qr-card .qimg svg{width:100%;height:100%;display:block}
.qr-card .qcap{font-size:10.5px;color:var(--mut);margin-top:9px;direction:ltr;font-weight:600}
.print-head{display:none;text-align:center;font-weight:900;font-size:19px;margin-bottom:6px}
@media print{
  header,.bottom,.menu-pop,#modal,#nav,.no-print{display:none!important}
  body{padding:0;background:#fff;color:#000} .wrap{max-width:none;padding:8px}
  .print-head{display:block} .qr-grid{grid-template-columns:repeat(3,1fr);gap:9px}
  .qr-card{box-shadow:none;border:1px solid #bbb;page-break-inside:avoid;padding:10px}
  .qr-card .qimg{border-color:#ddd}
}
.head>div{min-width:0} .head .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){
  body{font-size:14px;padding-bottom:74px}
  .wrap{padding:12px 11px}
  .head{gap:8px;padding:10px 11px} .head h1{font-size:16px} .head .sub{font-size:10.5px}
  #syncDot{font-size:10px} .rolechip{padding:5px 9px;font-size:11px}
  .kpis{gap:8px} .kpi{padding:11px 12px} .kpi .n{font-size:23px} .kpi .l{font-size:11px}
  .grid{grid-template-columns:1fr;gap:10px}

function doLogin(){
  const pn=($('#lgPn').value||'').replace(/\D/g,''), pin=($('#lgPin').value||'').replace(/\D/g,'');
  const d=DRIVERS.find(x=>x.pn===pn);
  // demo: officer master code 1894; otherwise match driver's last-4
  if(pn==='0000'||pn==='1894'){ startSession('officer','קצין הרכב',null); return; }
  if(!d){ $('#lgErr').textContent='מספר אישי לא נמצא ברשומה'; return; }
  if(pin!==d.pin){ $('#lgErr').textContent='קוד שגוי (4 ספרות אחרונות של המ״א)'; return; }
  // role by the roster's own role field — the source of truth
  let role, sc=null;
  if(d.role==='קצין רכב'||FLEET_FULL.indexOf(d.pn)>=0) role='officer';
  else if(d.role==='סמל רכב') role='sergeant';
  else if(['א','ג','ד'].includes(d.company)){ role='commander'; sc={'א':'A','ג':'C','ד':'D'}[d.company]; }
  else role='viewer';
  startSession(role, d.name, sc);
}

const isCivil=v=>String(v.prefix||'').includes('ל');
const fullNum=v=>v.prefix+v.number;
const STAT={'כשיר':'ok','במשימה':'mission','תקול':'bad','בטיפול':'service','מושבת':'bad','ממתין לשיבוץ':'wait'};
function daysUntil(d){ if(!d) return null; const a=new Date();a.setHours(0,0,0,0); return Math.ceil((new Date(d+'T00:00:00')-a)/864e5); }
function nextService(v){ if(isCivil(v)||!v.lastService||!v.frequency) return ''; const d=new Date(v.lastService+'T00:00:00'); d.setDate(d.getDate()+Number(v.frequency)); return d.toISOString().slice(0,10); }
function trackDate(v){ return isCivil(v)?(v.testExpiry||''):nextService(v); }
function fmtHe(d){ if(!d) return '—'; const [y,m,dd]=d.split('-'); return dd+'/'+m+'/'+y; }
function plate(v){ return `<span class="plate ${isCivil(v)?'civil':'army'}">${esc(v.number)}</span>`; }
function scopeVehicles(){ let vs=S.vehicles.filter(v=>!v.hiddenCard); if(sess.role==='commander'&&sess.scope) vs=vs.filter(v=>v.unit===sess.scope); return vs; }
function needsAttention(v){ const t=trackDate(v),n=daysUntil(t);
  return (!v.drivers||!v.drivers.length)||['תקול','מושבת'].includes(v.status)||(t&&n!=null&&n<=7)||v.deliveryVideo==='לא צולם'; }

function renderQR(){
  const base=location.origin+location.pathname;
  let h=`<div class="section-h no-print"><h2>🖨️ קודי QR לפלוגות</h2><button class="chip" onclick="window.print()">🖨️ הדפסה</button></div>`;
  h+=`<div class="no-print" style="font-size:12.5px;color:var(--ink2);margin:0 0 13px">כל מסגרת מקבלת קוד סריקה שמפנה ישר לתמונת־המצב שלה במערכת. סרוק בטלפון — או הדפס ותלה במסגרת.</div>`;
  h+=`<div class="print-head">קודי QR — צי הרכב הגדודי</div>`;
  h+=`<div class="qr-grid">`;
  FR.forEach(f=>{ const url=base+'?company='+encodeURIComponent(f.id); let svg='QR';
    try{ const q=qrcode(0,'M'); q.addData(url); q.make(); svg=q.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){}
    h+=`<div class="qr-card"><div class="qh">${esc(f.name)}</div><div class="qb">${esc(f.base)}</div>
      <div class="qimg">${svg}</div><div class="qcap">${esc(f.id)}</div></div>`; });
  h+=`</div>`;
  $('#screen').innerHTML=h;
}

let fleetFilter='all', fleetStatus='all', fleetSearch='';
function fleetMatches(v){
  if(fleetFilter!=='all'&&v.unit!==fleetFilter)return false;
  if(fleetStatus==='nodriver'){if(v.drivers&&v.drivers.length)return false;}
  else if(fleetStatus==='attention'){if(!needsAttention(v))return false;}
  else if(fleetStatus!=='all'&&STAT[v.status]!==fleetStatus)return false;
  const q=fleetSearch.trim().toLocaleLowerCase('he');
  if(!q)return true;
  const digits=q.replace(/\D/g,'');
  return [v.type,v.commander,v.slot,FRBY[v.unit]?.name].some(x=>String(x||'').toLocaleLowerCase('he').includes(q))||!!(digits&&String(v.number).replace(/\D/g,'').includes(digits));
}
function fleetEmpty(){
  if(!scopeVehicles().length)return `<div class="empty"><strong>עדיין אין רכבים בתצוגה</strong>לא ניתן לחשב מוכנות לפני שמופיעים רכבים.${canEdit()?'<br><button class="btn primary" onclick="openIntake()">קליטת רכב ראשון</button>':''}</div>`;
  return `<div class="empty"><strong>לא נמצאו רכבים מתאימים</strong>אפשר לשנות את החיפוש או לנקות את הסינון.<br><button class="btn ghost" onclick="fleetStatus='all';fleetFilter='all';fleetSearch='';render()">ניקוי חיפוש וסינון</button></div>`;
}
function renderFleet(){
  const all=scopeVehicles(),vs=all.filter(fleetMatches);
  const stats=[['all','כל הרכבים',all.length,'acc'],['ok','כשירים',all.filter(v=>v.status==='כשיר').length,'good'],['mission','במשימה',all.filter(v=>v.status==='במשימה').length,''],['bad','תקולים / מושבתים',all.filter(v=>['תקול','מושבת'].includes(v.status)).length,'alert']];
  let h=`<div class="page-heading"><div><h2>צי הרכב</h2><p>גדוד 1894 · תמונת מצב וניהול הרכבים</p></div>${canEdit()?'<button class="btn primary" onclick="openIntake()">קליטת רכב</button>':''}</div>`;
  h+='<div class="fleet-overview">'+readinessCard(all,'מוכנות הצי הגדודי');
  h+='<div class="kpis">'+stats.map(([key,label,count,cls])=>`<button class="kpi ${cls}" aria-pressed="${fleetStatus===key}" onclick="setStatusFilter('${key}')"><span class="n tnum">${count}</span><span class="l">${label}</span></button>`).join('')+'</div></div>';
  h+=`<section class="fleet-workspace" aria-label="חיפוש וסינון רכבים"><div class="section-h"><h2>רכבים <span id="fleetResultCount" class="tnum">(${vs.length})</span></h2><button class="chip" onclick="shareSummary(scopeVehicles(),'צי הרכב הגדודי')">שיתוף תמונת מצב</button></div>`;
  h+=`<label class="ux-field-label" for="fleetSearchInput">חיפוש רכב</label><div class="search"><span class="ic" aria-hidden="true">🔍</span><input id="fleetSearchInput" placeholder="מספר רכב, סוג, מפקד או מסגרת" value="${esc(fleetSearch)}" oninput="fleetSearch=this.value;renderFleetList()"></div>`;
  h+=`<div class="filter-label">מצב הרכב</div><div class="chips">${[['all','כל המצבים'],['service','בטיפול'],['nodriver','ללא נהג'],['attention','דורש תשומת לב']].map(([key,label])=>chip(key,label,fleetStatus===key,`setStatusFilter('${key}')`)).join('')}</div>`;
  h+=`<div class="filter-label">מסגרת</div><div class="chips" id="frChips">${chip('all','כל המסגרות',fleetFilter==='all',"setFleetFilter('all')")}${FR.map(f=>chip(f.id,f.name,fleetFilter===f.id,`setFleetFilter('${f.id}')`)).join('')}</div>`;
  h+=`<p id="fleetSearchStatus" class="ux-sr-only" role="status" aria-live="polite">${vs.length} רכבים מוצגים</p><div class="grid" id="fleetGrid">${vs.map(vehicleCard).join('')||fleetEmpty()}</div></section>`;
  h+=attentionCard(all)+timelineCard(all);
  if(fleetFilter==='all'&&fleetStatus==='all'&&!fleetSearch)h+=frameworkOverview();
  h+=safetyCard(DRIVERS,'תדריך בטיחות חודשי',false);
  $('#screen').innerHTML=h;
}


function renderFleetList(){
  const vs=scopeVehicles().filter(fleetMatches),grid=$('#fleetGrid');if(!grid)return;
  grid.innerHTML=vs.map(vehicleCard).join('')||fleetEmpty();
  $('#fleetResultCount').textContent='('+vs.length+')';$('#fleetSearchStatus').textContent=vs.length+' רכבים מוצגים';
}
function setStatusFilter(s){ fleetStatus = fleetStatus===s?'all':s; render(); }
function setFleetFilter(id){ fleetFilter=id; render(); }
function chip(id,label,on,fn){ return `<button class="chip" aria-pressed="${on}" onclick="${fn}">${esc(label)}</button>`; }
function scrollAttention(){ fleetStatus='attention'; render(); }

function vehicleCard(v){
  const sc=STAT[v.status]||'wait', t=trackDate(v), n=daysUntil(t);
  let al='';
  if(t&&n!=null){ if(n<0) al=`<div class="valert bad">⚠ ${isCivil(v)?'טסט פג':'טיפול באיחור'} · ${Math.abs(n)} ימים</div>`;
    else if(n<=7) al=`<div class="valert warn">${isCivil(v)?'🟨 טסט':'🛠 טיפול'} בעוד ${n} ימים</div>`; }
  const vid = v.deliveryVideo==='לא צולם' ? `<div class="valert bad">🔴 סרטון מסירה לא צולם</div>`:'';
  const fr=FRBY[v.unit];
  return `<div class="vcard s-${sc}">
    <button class="card-x" title="הסר קובייה" onclick="hideCard(${v.id})">×</button>
    <div class="vtop"><div class="vtitle">${plate(v)}
      <div class="vtype">${esc(v.type)} · ${esc(fr?fr.name:'—')}${v.slot?' · '+esc(v.slot):''}${v.demo?'<span class="demo-tag">דמו</span>':''}</div></div>
      <span class="pill ${sc}">${esc(v.status)}</span></div>
    <div class="vmeta">
      <div class="mbox"><small>${isCivil(v)?'תוקף טסט':'טיפול הבא'}</small><b class="tnum">${fmtHe(t)}</b></div>
      <div class="mbox"><small>מפקד/אחראי</small><b>${esc(v.commander||'—')}</b></div>
    </div>${al}${vid}
    <div class="vacts">
      <button class="b-ok" onclick="markOk(${v.id})">✔ תקין</button>
      <button class="b-move" onclick="openTransfer(${v.id})">🔄 העבר</button>
      <button class="b-edit" onclick="openEdit(${v.id})">✏ ערוך</button>
    </div></div>`;
}
function emptyBox(t){ return `<div class="empty" style="grid-column:1/-1">${esc(t)}</div>`; }

/* ===== dashboard feature components (shared: officer + company) ===== */
function readiness(vs){ const ok=vs.filter(v=>v.status==='כשיר').length; return {ok,total:vs.length,pct:vs.length?Math.round(ok/vs.length*100):0}; }
function readinessCard(vs,label){ const r=readiness(vs);
  if(!r.total)return `<section class="card gauge"><div class="gtop"><span>${esc(label||'מוכנות הצי')}</span><b style="color:var(--ink2)">אין נתונים</b></div><p class="ux-help">אין רכבים בתצוגה לחישוב מוכנות. אין להסיק מכך שהצי תקין או שאינו כשיר.</p></section>`;
  const col=r.pct>=75?'var(--ok)':r.pct>=50?'var(--warn)':'var(--bad)';
  return `<div class="card gauge"><div class="gtop"><span>🎖️ ${esc(label||'מוכנות מבצעית')}</span><b style="color:${col}" class="tnum">${r.pct}%</b></div>
    <div class="gbar"><div class="gfill" style="width:${r.pct}%;background:${col}"></div></div>
    <div class="gsub">${r.ok} כשירים · ${vs.filter(v=>v.status==='במשימה').length} במשימה · ${vs.filter(v=>['תקול','מושבת'].includes(v.status)).length} מושבתים · מתוך ${r.total}</div></div>`; }
function attentionCard(vs){
  if(!vs.length)return '';

  const g=[
    {k:'תקלות והשבתות',ic:'🔧',cls:'bad',it:vs.filter(v=>['תקול','מושבת'].includes(v.status))},
    {k:'ללא נהג משויך',ic:'👤',cls:'wait',it:vs.filter(v=>!v.drivers||!v.drivers.length)},
    {k:'טיפול / טסט קרוב או באיחור',ic:'🛠',cls:'warn',it:vs.filter(v=>{const t=trackDate(v),n=daysUntil(t);return t&&n!=null&&n<=7;})},
    {k:'סרטון מסירה לא צולם',ic:'🎬',cls:'bad',it:vs.filter(v=>v.deliveryVideo==='לא צולם')},
  ].filter(x=>x.it.length);
  if(!g.length) return `<div class="card"><div class="section-h"><h2>🟢 מוקד תשומת לב</h2></div><div style="color:var(--ok);font-weight:700;padding:6px 2px">לא נמצאו חריגים בבדיקות המוצגות ✓</div></div>`;
  return `<div class="card"><div class="section-h"><h2>🚨 מוקד תשומת לב</h2></div>
    ${g.map(x=>`<details class="attn-grp" open><summary><span class="pill ${x.cls}">${x.it.length}</span> ${x.ic} ${esc(x.k)}</summary>
      ${x.it.map(v=>`<div class="attn-row" onclick="${canEdit()?`openEdit(${v.id})`:''}">${plate(v)}<span>${esc(v.type)} · ${esc(FRBY[v.unit]?FRBY[v.unit].name:'')}${v.slot?' · '+esc(v.slot):''}</span><b>${esc(v.status)}</b></div>`).join('')}
    </details>`).join('')}</div>`;
}
function timelineCard(vs){
  const due=vs.map(v=>({v,t:trackDate(v),n:daysUntil(trackDate(v))})).filter(x=>x.t&&x.n!=null&&x.n<=7).sort((a,b)=>a.n-b.n);
  if(!due.length) return '';
  return `<div class="card"><div class="section-h"><h2>🗓️ טיפולים וטסטים קרובים</h2></div>
    ${due.map(x=>`<div class="tl-row ${x.n<0?'late':x.n<=2?'soon':''}"><span class="tl-when">${x.n<0?('באיחור '+Math.abs(x.n)+'י'):x.n===0?'היום':('בעוד '+x.n+'י')}</span>${plate(x.v)}<span>${esc(x.v.type)} · ${isCivil(x.v)?'טסט':'טיפול'} ${fmtHe(x.t)}</span></div>`).join('')}</div>`;
}
function frameworkOverview(){
  return `<div class="card"><div class="section-h"><h2>🧭 מבט לפי מסגרת</h2></div>
    ${FR.map(f=>{const vs=S.vehicles.filter(v=>v.unit===f.id&&!v.hiddenCard);const ok=vs.filter(v=>v.status==='כשיר').length;const bad=vs.filter(v=>['תקול','מושבת'].includes(v.status)).length;
      return `<div class="fov-row" onclick="setFleetFilter('${f.id}')"><span class="fov-n">${esc(f.name)}</span>
      <span class="fov-stats"><b>${vs.length}</b> רכבים${vs.length?` · <span style="color:var(--ok)">${ok} כשירים</span>${bad?` · <span style="color:var(--bad)">${bad} מושבתים</span>`:''}`:''} ›</span></div>`;}).join('')}</div>`;
}
function shareSummary(vs,title){ const r=readiness(vs);
  const L=['🚗 '+title+' — תמונת מצב',r.total?`מוכנות: ${r.pct}% (${r.ok}/${r.total} כשירים)`:'מוכנות: אין נתונים — אין רכבים בתצוגה',
    `במשימה: ${vs.filter(v=>v.status==='במשימה').length} · מושבתים: ${vs.filter(v=>['תקול','מושבת'].includes(v.status)).length}`,
    `ללא נהג: ${vs.filter(v=>!v.drivers||!v.drivers.length).length} · דורש תשומת לב: ${vs.filter(needsAttention).length}`,'',location.origin+location.pathname];
  window.open('https://wa.me/?text='+encodeURIComponent(L.join('\n')),'_blank'); }

/* ===== monthly safety briefing (תדריך בטיחות) — once a month from 24/10/2026 ===== */
const SAFETY_ANCHOR='2026-10-24';
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function cycleStart(){ const t=new Date(); t.setHours(0,0,0,0); const anc=new Date(SAFETY_ANCHOR+'T00:00:00');
  if(t<anc) return anc; const s=new Date(t.getFullYear(),t.getMonth(),24); if(t.getDate()<24) s.setMonth(s.getMonth()-1); return s; }
function cycleDateStr(){ return ymd(cycleStart()); }
function safetyOf(pn){ return getDriver(pn).safety||''; }
function safetyDone(pn){ const s=safetyOf(pn); return !!s && new Date(s+'T00:00:00')>=cycleStart(); }
function setSafety(pn,val){ if(!guard())return; S.driverOverrides=S.driverOverrides||{}; const o={...(S.driverOverrides[pn]||{})};
  o.safety=val; S.driverOverrides[pn]=o; save(); toast(val?'✔ תדריך סומן':'הסימון בוטל'); render(); }
function markSafety(pn){ if(!guard())return; const cur=safetyOf(pn), d=getDriver(pn);
  openSheet('🦺 תדריך בטיחות — '+(d.name||''),
    `<div class="field"><label>תאריך ביצוע התדריך</label><input id="sf_d" type="date" value="${esc(cur||cycleDateStr())}"></div>
     <div style="font-size:12px;color:var(--ink2)">תדריך בטיחות נדרש אחת לחודש, החל מ‑24/10/2026. הסימון ✓ נשמר לפי התאריך.</div>`,
    ()=>{ const v=$('#sf_d').value; if(!v){toast('בחר תאריך');return;} setSafety(pn,v); closeSheet(); },
    cur?{label:'בטל סימון תדריך',fn:()=>{ setSafety(pn,''); closeSheet(); }}:null);
}
function safetyCard(list,title,showList){ list=list.filter(d=>d.pn);
  const done=list.filter(d=>safetyDone(d.pn)).length, tot=list.length, pct=tot?Math.round(done/tot*100):0;
  const col=pct>=75?'var(--ok)':pct>=40?'var(--warn)':'var(--bad)'; const miss=list.filter(d=>!safetyDone(d.pn));
  return `<div class="card gauge"><div class="gtop"><span>🦺 ${esc(title||'תדריך בטיחות חודשי')}</span><b style="color:${col}" class="tnum">${done}/${tot}</b></div>
    <div class="gbar"><div class="gfill" style="width:${pct}%;background:${col}"></div></div>
    <div class="gsub">${pct}% תודרכו במחזור הנוכחי · ${miss.length} ממתינים · אחת לחודש מ‑24/10/2026</div>
    ${showList&&miss.length&&canEdit()?`<details class="attn-grp" style="margin-top:10px"><summary><span class="pill bad">${miss.length}</span> ⚠ ממתינים לתדריך החודש</summary>
      ${miss.slice(0,60).map(d=>`<div class="attn-row" onclick="markSafety('${esc(d.pn)}')"><span>${esc(d.name)}${d.company?' · פלוגה '+esc(d.company):''}</span><button class="sfx" onclick="event.stopPropagation();setSafety('${esc(d.pn)}',cycleDateStr())">סמן ✓</button></div>`).join('')}
      ${miss.length>60?`<div class="attn-row" style="color:var(--mut)">ועוד ${miss.length-60}…</div>`:''}</details>`
     :(!showList&&canEdit()?`<div style="margin-top:10px"><button class="chip no-print" onclick="go('drivers')">🦺 ניהול תדריכי בטיחות ›</button></div>`:'')}</div>`;
}

/* ===== COMPANY (green-eyes-like scoped) ===== */
let compSel='A';
function companyCid(){ return sess.role==='commander' ? sess.scope : compSel; }
function renderCompanyScope(){ const cid=companyCid(); return S.vehicles.filter(v=>v.unit===cid&&!v.hiddenCard); }
function renderCompany(){
  const cid = companyCid();
  const fr=FRBY[cid]; const vs=S.vehicles.filter(v=>v.unit===cid&&!v.hiddenCard);
  const done=vs.filter(v=>v.status==='כשיר'&&!needsAttention(v)).length;
  let h='';
  if(sess.role!=='commander'){
    h+=`<div class="chips">${FR.filter(f=>['A','C','D'].includes(f.id)).map(f=>chip(f.id,f.name,cid===f.id,`compSel='${f.id}';render()`)).join('')}
      ${FR.filter(f=>!['A','C','D'].includes(f.id)).map(f=>chip(f.id,f.name,cid===f.id,`compSel='${f.id}';render()`)).join('')}</div>`;
  }
  h+=`<div class="section-h"><h2>🎖️ ${esc(fr.name)} <span style="color:var(--mut);font-weight:600;font-size:13px">· ${esc(fr.base)}</span></h2></div>`;
  h+=readinessCard(vs,'מוכנות '+fr.name);
  h+=`<div class="kpis"><div class="kpi acc"><div class="n tnum">${vs.length}</div><div class="l">רכבים במסגרת</div></div>
    <div class="kpi good"><div class="n tnum">${done}</div><div class="l">כשירים ותקינים</div></div>
    <div class="kpi warnk"><div class="n tnum">${vs.filter(needsAttention).length}</div><div class="l">דורש תשומת לב</div></div>
    <div class="kpi"><div class="n tnum" style="color:var(--info)">${vs.filter(v=>v.status==='במשימה').length}</div><div class="l">במשימה</div></div></div>`;
  h+=`<div class="mod-acts"><button class="act-btn wa" onclick="shareSummary(renderCompanyScope(),'${esc(fr.name)}')">📤 דיווח מצב לקצין הרכב</button></div>`;
  h+=attentionCard(vs);
  h+=timelineCard(vs);
  // slot checklist (green-eyes style)
  h+=`<div class="section-h"><h2>סבב בדיקה יומי</h2></div><div class="grid">`;
  fr.slots.forEach(slot=>{ const v=vs.find(x=>x.slot===slot);
    if(v){ h+=vehicleCard(v); }
    else h+=`<div class="vcard s-wait" style="opacity:.85"><div class="vtop"><div class="vtitle"><b>${esc(slot)}</b><div class="vtype">אין רכב משובץ</div></div><span class="pill wait">ריק</span></div>
      <div class="vacts" style="grid-template-columns:1fr"><button class="b-edit" onclick="openIntake('${cid}','${esc(slot)}')">➕ שבץ רכב</button></div></div>`; });
  h+=`</div>`;
  $('#screen').innerHTML=h;
}

/* ===== DRIVERS ===== */
let drvSearch='';
function renderDrivers(){
  const q=drvSearch.trim(), dg=q.replace(/\D/g,'');
  let list=DRIVERS.filter(d=>{ if(!q) return true;
    return (d.name||'').includes(q)||(dg&&(d.pn.includes(dg)||(d.phone||'').replace(/\D/g,'').includes(dg))); });
  if(sess.role==='commander'){ const c={A:'א',C:'ג',D:'ד'}[sess.scope]; list=list.filter(d=>d.company===c); }
  const safetyBase = sess.role==='commander' ? DRIVERS.filter(d=>d.company==={A:'א',C:'ג',D:'ד'}[sess.scope]) : DRIVERS;
  let h=safetyCard(safetyBase,'תדריך בטיחות חודשי',true);
  h+=`<div class="search"><span class="ic">🔍</span><input placeholder="חיפוש נהג — שם / מ״א / טלפון" value="${esc(drvSearch)}" oninput="drvSearch=this.value;renderDrivers();focusSearch()"></div>`;
  h+=`<div class="section-h"><h2>נהגים <span style="color:var(--mut);font-weight:600;font-size:13px">(${list.length})</span></h2></div>`;
  h+=list.slice(0,120).map(driverCard).join('')||emptyBox('לא נמצאו נהגים');
  if(list.length>120) h+=`<div class="empty">מוצגים 120 ראשונים — צמצם בחיפוש</div>`;
  $('#screen').innerHTML=h;
}
function focusSearch(){ const i=$('#screen .search input'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} }
function piiOk(){ return sess.role==='officer'||sess.role==='sergeant'; } // מ״א/טלפון — קצין/סמל בלבד
function driverCard(base){
  const d=getDriver(base.pn); const pii=piiOk(); const phone=(d.phone||'').replace(/\D/g,'');
  const np=(d.permits||[]).length; const sdone=d.pn?safetyDone(d.pn):false; const so=d.pn?safetyOf(d.pn):'';
  return `<div class="dcard" onclick="openDriver('${esc(d.pn)}')" style="cursor:pointer">
    <div class="dtop"><div><div class="dname">${esc(d.name||'—')}</div>
      <div class="dsub">${esc(d.company?('פלוגה '+d.company):'')}${d.dept?' · '+esc(d.dept):''}${d.role?' · '+esc(d.role):''}</div></div>
      ${pii?`<span class="pill wait tnum">מ״א ${esc(d.pn)}</span>`:''}</div>
    <div class="dchips">
      ${d.license?`<span>🪪 ${esc(d.license)}</span>`:''}
      ${np?`<span>🔑 ${np} היתרים</span>`:'<span style="color:var(--mut)">ללא היתרים מיוחדים</span>'}
      ${pii&&phone?`<span>📞 ${esc(d.phone)}</span>`:''}
      ${d.pn?`<span class="sbadge ${sdone?'on':'off'}">🦺 ${sdone?('תודרך '+fmtHe(so)):'תדריך חסר'}</span>`:''}
      ${d.pn&&canEdit()?`<button class="sfx ${sdone?'on':''}" onclick="event.stopPropagation();markSafety('${esc(d.pn)}')">${sdone?'עדכן':'סמן ✓'}</button>`:''}
      <span class="more">כרטיס מלא ›</span></div>
  </div>`;
}
function openDriver(pn){
  const d=getDriver(pn); if(!d.name&&!d.pn) return; const pii=piiOk(); const phone=(d.phone||'').replace(/\D/g,'');
  const rows=[['תפקיד',d.role],['פלוגה',d.company],['מחלקה',d.dept],['סוג רישיון',d.license],
    ['נגררת',d.trailer],['רכב פרטי',d.private],['רענון נהיגה אחרון',d.lastRefresh],['דרישות קורסים',d.courses]];
  if(pii) rows.unshift(['מספר אישי',d.pn]);
  let b=`<div class="dgrid">${rows.map(([k,v])=>`<div class="dg"><small>${esc(k)}</small><b>${esc(v||'—')}</b></div>`).join('')}</div>`;
  b+=`<div class="detail-block"><small>🔑 היתרי נהיגה / רכבים</small>${(d.permits&&d.permits.length)
    ?`<div class="permits" style="margin-top:8px">${d.permits.map(p=>`<span class="perm">${esc(p)}</span>`).join('')}</div>`
    :`<div style="color:var(--mut);margin-top:6px">אין היתרים מיוחדים רשומים</div>`}</div>`;
  { const sdone=safetyDone(pn), so=safetyOf(pn);
    b+=`<div class="detail-block"><small>🦺 תדריך בטיחות חודשי</small>
      <div style="margin-top:7px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="sbadge ${sdone?'on':'off'}">${sdone?('✓ בוצע · '+fmtHe(so)):'⚠ טרם בוצע במחזור הנוכחי'}</span>
        ${canEdit()?`<button class="sfx ${sdone?'on':''}" onclick="markSafety('${esc(pn)}')">${sdone?'עדכון תאריך':'סימון ביצוע ✓'}</button>`:''}
      </div></div>`; }
  if(pii){ b+=`<div class="detail-block"><small>📞 טלפון</small>${phone

/* ===== modal + toast ===== */
let sheetReturnFocus=null,sheetPreviousOverflow='';
function openSheet(title,body,onSave,extra){
  if(!$('#modal').classList.contains('show')){sheetReturnFocus=document.activeElement;sheetPreviousOverflow=document.body.style.overflow;}
  $('#sheet').innerHTML=`<h3 id="sheetTitle">${esc(title)}</h3>${body}<div class="srow ux-actions"><button class="btn primary" id="_sv">שמור</button><button class="btn ghost" onclick="closeSheet()">ביטול</button></div>${extra?`<button class="btn" style="width:100%;margin-top:8px;background:var(--badbg);color:var(--bad)" id="_ex">${esc(extra.label)}</button>`:''}`;
  $('#sheet').setAttribute('role','dialog');$('#sheet').setAttribute('aria-modal','true');$('#sheet').setAttribute('aria-labelledby','sheetTitle');$('#sheet').tabIndex=-1;
  $('#modal').classList.add('show');document.body.style.overflow='hidden';$('#app').inert=true;$('#nav').inert=true;
  if(onSave)$('#_sv').onclick=onSave;if(extra)$('#_ex').onclick=extra.fn;
  requestAnimationFrame(()=>($('#sheet').querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled])')||$('#sheet')).focus());
}
function closeSheet(){
  $('#modal').classList.remove('show');document.body.style.overflow=sheetPreviousOverflow;$('#app').inert=false;$('#nav').inert=false;
  if(sheetReturnFocus&&sheetReturnFocus.isConnected)sheetReturnFocus.focus();sheetReturnFocus=null;
}
document.addEventListener('keydown',e=>{
  if(!$('#modal').classList.contains('show'))return;
  if(e.key==='Escape'){e.preventDefault();closeSheet();return;}
  if(e.key!=='Tab')return;
  const nodes=Array.from($('#sheet').querySelectorAll('button,input,select,textarea,a[href],[tabindex]')).filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
  const first=nodes[0],last=nodes[nodes.length-1];
  if(!first){e.preventDefault();$('#sheet').focus();return;}
  if(e.shiftKey&&(document.activeElement===first||!$('#sheet').contains(document.activeElement))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(document.activeElement===last||!$('#sheet').contains(document.activeElement))){e.preventDefault();first.focus();}
});



$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeSheet(); });
let toastT; function toast(m){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast';
  t.style.cssText='position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:99999;background:#14231b;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 10px 30px -8px #0007;opacity:0;transition:opacity .2s'; document.body.appendChild(t);}
  t.textContent=m; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,1800); }

// SSO / resume — arrive already-authenticated from the unified 1894 shell, or resume on return
(function(){ const raw=new URLSearchParams(location.search).get('sso');
  if(raw){ const pn=String(raw).replace(/\D/g,''); window.__ssoPn=pn;
    if(pn==='1894'||pn==='0000'){ startSession('officer','קצין הרכב',null); return; }
    const d=DRIVERS.find(x=>x.pn===pn);
    if(d){ let role='viewer',sc=null;
      if(d.role==='קצין רכב'||FLEET_FULL.indexOf(d.pn)>=0) role='officer';
      else if(d.role==='סמל רכב') role='sergeant';
      else if(['א','ג','ד'].includes(d.company)){ role='commander'; sc={'א':'A','ג':'C','ד':'D'}[d.company]; }
      startSession(role,d.name,sc); return; } }
  // no SSO param → resume a live session if one exists (survives leaving to the shell and back)
  let s=null; try{s=JSON.parse(sessionStorage.getItem(SS_F));}catch(e){}
  if(s&&s.role) startSession(s.role,s.name,s.scope);
})();

<script>

// Semantic labels and keyboard access follow dynamically rendered controls.
(function(){
  let serial=0,queued=false;
  function enhance(){
    queued=false;
    document.querySelectorAll('input,select,textarea').forEach(el=>{
      if(el.type==='hidden'||el.getAttribute('aria-label')||el.getAttribute('aria-labelledby')||(el.labels&&el.labels.length))return;
      let label=el.previousElementSibling;
      if(!label||label.tagName!=='LABEL')label=el.parentElement.querySelector(':scope > label');
      if(label&&label.tagName==='LABEL'&&(!label.control||label.control===el)){
        if(!el.id)el.id='ux-field-'+(++serial);label.htmlFor=el.id;
      }else if(el.getAttribute('placeholder')){
        if(!el.id)el.id='ux-field-'+(++serial);
        label=document.createElement('label');label.htmlFor=el.id;label.className='ux-field-label';label.textContent=el.getAttribute('placeholder');
        const parent=el.closest('.search');
        if(parent)parent.before(label);else el.before(label);
      }
    });
    document.querySelectorAll('div[onclick]').forEach(el=>{
      if(el.dataset.uxKeyboard)return;
      el.dataset.uxKeyboard='1';el.setAttribute('role','button');el.tabIndex=0;
      el.addEventListener('keydown',e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click();}});
    });
    document.querySelectorAll('nav button[data-tab],nav button[data-v]').forEach(el=>{
      const active=el.classList.contains('on')||el.classList.contains('active');
      if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
    });
    document.querySelectorAll('#scrCount .vbtn').forEach(el=>{
      const row=el.closest('.item');const name=row&&row.querySelector('.nm');
      el.setAttribute('aria-label','אישור ספירה'+(name?' — '+name.textContent.trim():''));
      el.setAttribute('aria-pressed',String(!!row&&row.classList.contains('ok')));
    });
  }
  new MutationObserver(()=>{if(!queued){queued=true;queueMicrotask(enhance);}}).observe(document.body,{subtree:true,childList:true});
  enhance();
})();

</script>
