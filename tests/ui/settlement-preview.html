<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POKERTEN — בדיקת התחשבנות מבודדת</title><link rel="stylesheet" href="assets/css/settlement.css"><style>body{margin:0;background:#07111f;color:#edf5fc;font-family:Arial,sans-serif;padding:24px}main{max-width:1150px;margin:auto}header.preview{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0}header.preview span{font-size:13px;color:#95a7be}a{color:#9be6d1}@media(max-width:500px){body{padding:14px}}</style><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script></head><body><main><header class="preview"><h1>מידע והתחשבנות</h1><span>נתוני בדיקה בלבד</span></header><div id="root"></div></main><script src="assets/js/poker-settlement-ui.js"></script><script>
const viewportWidth=Number(new URLSearchParams(location.search).get('width')); if(viewportWidth>=320&&viewportWidth<=1024){const frame=document.createElement('iframe'),params=new URLSearchParams(location.search);params.delete('width');frame.src=location.pathname+'?'+params;frame.style.cssText='width:'+viewportWidth+'px;height:850px;border:0;display:block;margin:auto;background:#07111f';document.body.replaceChildren(frame);}else{const role=new URLSearchParams(location.search).get('role')||'owner',uid=role==='owner'?'owner':role==='agent'?'agentA':'A',at=Date.now(),cycle={id:'cycle_1',number:1,status:'open',startAt:at-86400000*2,endAt:at+86400000*5,autoClose:false};
const source=[['A','יונתן כהן',-200000,60000,685,18000,'agentA',15983],['B','דניאל לוי',120000,40000,520,0,'agentA',100000],['C','איתי מרום',-50000,25000,300,0,'agentA',42000],['D','אור שפירא',300000,200000,800,0,'agentB',350000]];
const details=source.map(([playerId,playerName,result,rake,hands,rakeback,agentId])=>({playerId,playerName,agentId,totals:{result,rake,hands,rakeback,games:1},rows:[{tableId:'NLH',tableName:'NLH 1/2 — שולחן 4',gameType:'NLH',kind:'cash',result,rake,hands,games:1}],opening:0,activity:result+rakeback,paid:0,closing:result+rakeback}));
const agents=[{agentId:'agentA',agentName:'איתי מרום',playersResult:-130000,rake:125000,hands:1505,commission:62500,earnings:44500,leadsIncome:0,opening:0,paid:0,toClub:67500,closing:67500,leads:[],players:[]},{agentId:'agentB',agentName:'מיכאל גולן',playersResult:300000,rake:200000,hands:800,commission:80000,earnings:80000,leadsIncome:0,opening:0,paid:0,toClub:-380000,closing:-380000,leads:[],players:[]}];
const player={playerId:'A',playerName:'יונתן כהן',totals:{result:-200000,hands:685,games:3},opening:0,paid:0,closing:-182000,hasRakeback:true,rakebackTotal:18000,rows:[{tableId:'nlh',tableName:'NLH 1/2 — שולחן 4',kind:'cash',result:-120000,hands:410,games:1},{tableId:'plo',tableName:'PLO 2/5 — שולחן 7',kind:'cash',result:-100000,hands:180,games:1},{tableId:'mtt',tableName:'טורניר יום חמישי',kind:'tournament',result:20000,hands:95,games:1}],counterparties:[{id:'agentA',name:'איתי מרום',closing:-182000}]};
if(new URLSearchParams(location.search).has('no-rb')){delete player.hasRakeback;delete player.rakebackTotal;player.closing=-200000;player.counterparties[0].closing=-200000;}
const report={active:true,role,clubPartyId:'owner',cycle,cycles:[cycle],currentCycleId:cycle.id,activatedAt:at-86400000*2,payments:[],approvals:[],...(role==='player'?{player,balance:15983}:role==='agent'?{player,agent:agents[0],details:details.filter(p=>p.agentId===uid),funds:source.filter(p=>p[6]===uid).map(p=>({uid:p[0],balance:p[7]}))}:{club:{totals:{playersResult:170000,rake:325000,commission:142500,leadsIncome:0,hands:2305,toClub:-312500,closing:-312500}},agents,details,funds:source.map(p=>({uid:p[0],balance:p[7]}))})};
const legacyMode=new URLSearchParams(location.search).has('legacy');
const legacyRows=source.map(([id,name,result,rake,hands,rb,agentUid,chips])=>({uid:id,name,agentUid,balance:id==='A'?80000:chips,onTables:0,chips:id==='A'?80000:chips,result:id==='A'?-20000:result,totalResult:id==='A'?-20000:result,rake,openSessions:0}));
const legacySum=rows=>rows.reduce((t,p)=>{for(const k of ['balance','onTables','chips','result','totalResult','rake','openSessions'])t[k]+=p[k];return t;},{balance:0,onTables:0,chips:0,result:0,totalResult:0,rake:0,openSessions:0});
const legacyAgents=agents.map(a=>({...legacySum(legacyRows.filter(p=>p.agentUid===a.agentId)),uid:a.agentId,name:a.agentName,commission:a.commission,toClub:-legacySum(legacyRows.filter(p=>p.agentUid===a.agentId)).result-a.commission}));
let legacyOpen=true;
const legacyReport=()=>{const rows=legacyRows.filter(p=>role==='owner'||role==='agent'&&p.agentUid===uid||role==='player'&&p.uid===uid),totals=role==='agent'?legacyAgents.find(a=>a.uid===uid):role==='owner'?{...legacySum(rows),commission:legacyAgents.reduce((n,a)=>n+a.commission,0)}:rows[0];const safe=p=>{const{rake,agentUid,...rest}=p;return rest;};return{active:false,legacy:true,role,canClose:role==='owner'&&legacyOpen,cycle:{id:'legacy_current',number:0,status:legacyOpen?'open':'closed',startAt:at-2*86400000,endAt:legacyOpen?null:at,legacy:true},cycles:legacyOpen?[]:[{...cycle},{id:'legacy_current',number:0,status:'closed',legacy:true}],currentCycleId:legacyOpen?'legacy_current':cycle.id,legacyReport:{players:role==='player'?rows.map(safe):rows,totals:role==='player'?safe(totals):totals,...(role==='player'?{}:{agents:role==='owner'?legacyAgents:legacyAgents.filter(a=>a.uid===uid)}),asOf:at}};};
const call=async(name,args)=>{if(name==='pkSettlementReport'&&legacyMode&&(legacyOpen||args.cycleId==='legacy_current'))return legacyReport();if(name==='pkSettlementReport')return {...report,cycle:args.cycleId==='all'?{...cycle,id:'all',status:'all'}:cycle};if(name==='pkSettlementArchive')return{at:report.activatedAt,rows:source.filter(p=>role==='owner'||role==='agent'&&p[6]===uid||p[0]===uid).map(p=>({uid:p[0],name:p[1],balance:p[7]/100,result:p[2]/100,chips:p[7]/100}))};if(name==='pkSettlementTerms')return{role,members:source.map(p=>({uid:p[0],name:p[1],role:'player',status:'approved',primaryAgentId:p[6],rakebackPct:p[0]==='A'?30:0})).concat(agents.map(a=>({uid:a.agentId,name:a.agentName,role:'agent',status:'approved',agentPct:a.agentId==='agentA'?50:40})))};if(name==='pkSettlement'){if(args.action==='closeLegacy'){legacyOpen=false;report.cycles=[cycle,{id:'legacy_current',number:0,status:'closed',legacy:true}];return{ok:true,cycleId:cycle.id};}if(args.action==='payment')report.payments.push({id:'preview-payment',amount:Math.round(args.amount*100),fromId:args.fromId,toId:args.toId,status:'pending',createdBy:uid,at:Date.now(),canConfirm:false,note:args.note});return{ok:true};}throw Error('Unknown preview operation');};
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(new URLSearchParams(location.search).has('terms')?PokerSettlement.SettlementMembers:PokerSettlement.Settlement,{user:{uid,role},clubId:'isolated-preview',call}));
}
</script></body></html>
