name: TWA Rebuild (API 36)

on:
  push:
    branches: [twa-rebuild]
    paths: ['twa-build/**', '.github/workflows/twa-rebuild.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twa-rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        app: [agromall, chibwenzi, chipazi, kayachi, lernoto, mwanako, reljob, vochira, zedglow, zedmall, zuwango]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: twa-rebuild

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -eux
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -sSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip
          mv cmdline-tools latest
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@latest

      - name: Point Bubblewrap at system JDK + SDK
        run: |
          set -eux
          mkdir -p "$HOME/.bubblewrap"
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$HOME/android-sdk" > "$HOME/.bubblewrap/config.json"

      - name: Build unsigned AAB
        working-directory: twa-build/${{ matrix.app }}
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          keytool -genkeypair -keystore ./android.keystore -alias android \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ORIZIS, O=ORIZIS, C=ZM"
          printf '1.0.1\n2\ny\ny\ny\ny\ny\ny\ny\ny\n' | timeout 240 bubblewrap update --skipPwaValidation
          test -f app/build.gradle
          sed -i -E 's/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdkVersion 36/' app/build.gradle
          sed -i -E 's/targetSdk(Version)?[[:space:]]+[0-9]+/targetSdkVersion 36/' app/build.gradle
          sed -i -E '/signingConfig[[:space:]]+signingConfigs\.release/d' app/build.gradle
          chmod +x gradlew
          timeout 1200 ./gradlew :app:bundleRelease --stacktrace --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/build/outputs -name '*.aab' -exec cp {} "$GITHUB_WORKSPACE/out/${{ matrix.app }}.aab" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: out/${{ matrix.app }}.aab
          if-no-files-found: error

      - name: Commit AAB back
        run: |
          set -eux
          cp "out/${{ matrix.app }}.aab" "$RUNNER_TEMP/${{ matrix.app }}.aab"
          # discard all working-tree changes bubblewrap made (tracked + untracked)
          git checkout -- . 2>/dev/null || true
          git clean -fdx twa-build out 2>/dev/null || true
          mkdir -p twa-build/out
          cp "$RUNNER_TEMP/${{ matrix.app }}.aab" "twa-build/out/${{ matrix.app }}.aab"
          git config user.name  "twa-bot"
          git config user.email "twa-bot@users.noreply.github.com"
          git add -f "twa-build/out/${{ matrix.app }}.aab"
          git commit -m "build(${{ matrix.app }}): AAB targeting API 36" || echo "nothing to commit"
          for i in $(seq 1 8); do
            git pull --rebase --autostash origin twa-rebuild && git push origin twa-rebuild && break || sleep $((RANDOM % 8 + 3))
          done
