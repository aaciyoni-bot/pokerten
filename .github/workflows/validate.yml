name: Validate game and bot decisions

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test and engine dependencies
        run: |
          npm ci --prefix tests/ui --ignore-scripts
          npm ci --prefix functions --ignore-scripts
      - name: Check mandatory game invariants
        run: node predeploy-check.js
      - name: Verify generated poker worker matches client policy
        run: node scripts/build-poker-worker.cjs --check
      - name: Check read-only live-table status parsing
        run: node --test scripts/verify-bot-lobby-variety.test.cjs
      - name: Check actual client and server bot decisions
        run: node tests/ui/bot-policy.test.cjs
      - name: Check managed bot tables, waiting lists and management access
        run: |
          node --test functions/test/botLobby.test.js functions/test/waitlistPriority.test.js functions/test/manualBotWaitlist.test.js functions/test/managementAccess.test.js functions/test/godAccess.test.js functions/test/clubDirectory.test.js functions/test/memberApproval.test.js functions/test/clubArchive.test.js
          node tests/ui/waitlist-ui.test.cjs
          node tests/ui/bot-lobby-control.test.cjs
      - name: Check game engine
        run: node functions/engine.smoke.test.js
      - name: Check multi-table tournament lifecycle and paid-place finishing
        run: node --test functions/test/tournamentLifecycle.test.js
      - name: Check audio and accounting
        run: node --test tests/*.test.cjs
      - name: Check simulated login, chat, lobby and settlement flows
        run: npm test --prefix tests/ui
