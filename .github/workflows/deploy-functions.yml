name: Read-only card creation diagnostics
on:
  push:
    branches: [diagnostics/card-create-20261023]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Inspect error classes without exposing raw logs or changing data
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node <<'JS'
          const {spawnSync}=require('node:child_process');
          for (const name of ['pkCardTableCreate','pkCardGame']) {
            const r=spawnSync('firebase',['functions:log','--only',name,'--lines','100','--project','pokerten','--non-interactive'],{encoding:'utf8',timeout:60000,maxBuffer:3*1024*1024});
            const s=r.stdout||'';
            const patterns={
              undefinedValue:/Cannot use .undefined.|undefined.*Firestore/i,
              readsAfterWrites:/reads.*before.*writes|read.*after.*writ/i,
              nestedArrays:/nested arrays|array.*array/i,
              indexMissing:/requires an index|index.*required/i,
              permissionDenied:/PERMISSION_DENIED|permission.denied/i,
              internal:/Unhandled error|INTERNAL/i,
              unauthenticated:/UNAUTHENTICATED|Sign in first/i,
              numericSetting:/Invalid numeric setting/i,
              transactionAborted:/ABORTED|transaction.*abort/i,
              insufficientFunds:/Insufficient balance/i,
              unavailable:/UNAVAILABLE|unavailable/i,
              invalidDocument:/Invalid document|not a valid Firestore document/i
            };
            const stack=[...s.matchAll(/(?:cardGames|cardGamesCore|pokerAuthority|pokerLedger|settlementStore)\.js:\d+:\d+/g)].map(x=>x[0]);
            const codes=[...s.matchAll(/(?:code|status)[:=]\s*['"]?([0-9]{1,2}|[A-Z_]{4,30})/g)].map(x=>x[1]);
            console.log(JSON.stringify({name,readOK:r.status===0,logLines:s.split('\n').length,diagnoses:Object.keys(patterns).filter(k=>patterns[k].test(s)),stack:[...new Set(stack)],codes:[...new Set(codes)]}));
          }
          JS
