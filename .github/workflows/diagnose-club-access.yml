name: Diagnose missing Durak tables (read only)
on:
  push:
    branches: [diagnostics/durak-lobby-20261024]
    paths: ['.github/workflows/diagnose-club-access.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/card-cli" --no-audit --no-fund firebase-tools@13.35.1
      - name: Read card table visibility metadata only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/card-cli/node_modules"
          node <<'JS'
          'use strict';
          const {createHash}=require('node:crypto');
          function decode(v){if(!v)return undefined;if('stringValue'in v)return v.stringValue;if('booleanValue'in v)return v.booleanValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;if('nullValue'in v)return null;if(v.mapValue)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,decode(x)]));return undefined;}
          async function main(){
           if(process.env.GITHUB_ACTIONS!=='true'||!process.env.FIREBASE_TOKEN)throw Error('auth-unavailable');
           const {getAccessToken}=require('firebase-tools/lib/auth');
           const token=await getAccessToken(process.env.FIREBASE_TOKEN,['https://www.googleapis.com/auth/cloud-platform']);
           if(!token.access_token)throw Error('auth-unavailable');
           const base='https://firestore.googleapis.com/v1/projects/pokerten/databases/(default)/documents';
           async function query(collection,fields,where){
            const response=await fetch(base+':runQuery',{method:'POST',headers:{Authorization:'Bearer '+token.access_token,'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:collection}],select:{fields:fields.map(fieldPath=>({fieldPath}))},...(where?{where}:{}),limit:101}}),signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('read-http-'+response.status);
            return(await response.json()).filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),data:decode({mapValue:{fields:x.document.fields}})}));
           }
           const clubs=await query('clubs',['name']);if(clubs.length>100)throw Error('scope-ambiguous');
           const selected=clubs.filter(x=>String(x.data.name||'').trim().toLowerCase()==='netabel');if(selected.length!==1)throw Error('scope-ambiguous');
           const filter={fieldFilter:{field:{fieldPath:'clubId'},op:'EQUAL',value:{stringValue:selected[0].id}}};
           const fields=['type','authorityVersion','cardGameVersion','status','createdAt','closedAt','tournamentId','closeRequested','settings.serverEngine'];
           const [tables,closed]=await Promise.all([query('tables',fields,filter),query('_pkClosedTables',fields,filter)]);
           if(tables.length>100)throw Error('scope-ambiguous');
           const safe=x=>({tableRef:createHash('sha256').update(x.id).digest('hex').slice(0,10),type:x.data.type,authority:x.data.authorityVersion||0,cardVersion:x.data.cardGameVersion||0,status:['setup','waiting','playing','showdown','ended','finished','done','gameover'].includes(x.data.status)?x.data.status:'other',createdAt:x.data.createdAt||null,closedAt:x.data.closedAt||null,tournament:Boolean(x.data.tournamentId),closing:Boolean(x.data.closeRequested),serverEngine:x.data.settings?.serverEngine===true});
           console.log('CARD_LOBBY_DIAGNOSTIC '+JSON.stringify({activeCounts:tables.reduce((r,x)=>(r[x.data.type]=(r[x.data.type]||0)+1,r),{}),active:tables.filter(x=>['durak','ofc'].includes(x.data.type)).map(safe),archivedResultsTruncated:closed.length>100,archived:closed.filter(x=>['durak','ofc'].includes(x.data.type)).map(safe)}));
          }
          main().catch(error=>{const reason=/^(auth-unavailable|scope-ambiguous|read-http-\d+)$/.test(error.message)?error.message:'read-unavailable';console.log('CARD_LOBBY_DIAGNOSTIC '+JSON.stringify({state:'failed',reason}));process.exitCode=1;});
          JS
