name: Restore requested Omaha table chat
on:
  push:
    branches: [repair/omaha-chat-20261024]
    paths: ['.github/workflows/diagnose-club-access.yml']
permissions:
  contents: read
concurrency:
  group: restore-requested-omaha-chat
  cancel-in-progress: false
jobs:
  restore-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/chat-cli" --no-audit --no-fund firebase-tools@13.35.1
      - name: Open only the identified table chat and verify
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/chat-cli/node_modules"
          node <<'JS'
          'use strict';
          const {createHash}=require('node:crypto');
          const targetRef='55da67adbd';
          function decode(v){
           if(!v)return undefined;
           if('stringValue'in v)return v.stringValue;
           if('booleanValue'in v)return v.booleanValue;
           if('integerValue'in v)return Number(v.integerValue);
           if('nullValue'in v)return null;
           if(v.mapValue)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,decode(x)]));
           return undefined;
          }
          async function main(){
           if(process.env.GITHUB_ACTIONS!=='true'||!process.env.FIREBASE_TOKEN)throw Error('auth-unavailable');
           const {getAccessToken}=require('firebase-tools/lib/auth');
           const token=await getAccessToken(process.env.FIREBASE_TOKEN,['https://www.googleapis.com/auth/cloud-platform']);
           if(!token.access_token)throw Error('auth-unavailable');
           const base='https://firestore.googleapis.com/v1/projects/pokerten/databases/(default)/documents';
           async function api(url,body,method='POST'){
            const response=await fetch(url,{method,headers:{Authorization:'Bearer '+token.access_token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
            if(!response.ok){const e=Error('http-'+response.status);e.status=response.status;throw e;}
            return response.json();
           }
           async function query(collection,fields,where){
            return(await api(base+':runQuery',{structuredQuery:{from:[{collectionId:collection}],select:{fields:fields.map(fieldPath=>({fieldPath}))},...(where?{where}:{}),limit:101}})).filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),name:x.document.name,updateTime:x.document.updateTime,data:decode({mapValue:{fields:x.document.fields}})}));
           }
           const clubs=await query('clubs',['name']);
           if(clubs.length>100)throw Error('scope-ambiguous');
           const selected=clubs.filter(x=>String(x.data.name||'').trim().toLowerCase()==='netabel');
           if(selected.length!==1)throw Error('scope-ambiguous');
           for(let attempt=0;attempt<5;attempt++){
            const tables=await query('tables',['type','settings.baseGameType','settings.serverEngine','authorityVersion','chatMuted'],{fieldFilter:{field:{fieldPath:'clubId'},op:'EQUAL',value:{stringValue:selected[0].id}}});
            if(tables.length>100)throw Error('scope-ambiguous');
            const targets=tables.filter(x=>createHash('sha256').update(x.id).digest('hex').slice(0,10)===targetRef&&x.data.type==='poker'&&x.data.settings?.baseGameType==='Omaha 6'&&x.data.settings.serverEngine===true&&x.data.authorityVersion===2);
            if(targets.length!==1)throw Error('scope-ambiguous');
            const target=targets[0];
            if(target.data.chatMuted===false){console.log('CHAT_REPAIR '+JSON.stringify({tableRef:targetRef,state:'already-open',muted:false}));return;}
            if(target.data.chatMuted!==true)throw Error('unexpected-chat-state');
            try {
             // Only this boolean field can change. The exact read version is required;
             // concurrent game updates cause a retry, never a whole-table overwrite.
             await api(base+':commit',{writes:[{update:{name:target.name,fields:{chatMuted:{booleanValue:false}}},updateMask:{fieldPaths:['chatMuted']},currentDocument:{updateTime:target.updateTime}}]});
            } catch(error) {if([409,412].includes(error.status))continue;throw error;}
            const checked=await api('https://firestore.googleapis.com/v1/'+target.name+'?mask.fieldPaths=chatMuted',null,'GET');
            if(checked.fields?.chatMuted?.booleanValue!==false)throw Error('verification-failed');
            console.log('CHAT_REPAIR '+JSON.stringify({tableRef:targetRef,state:'unmuted-and-verified',muted:false,changedFields:['chatMuted']}));
            return;
           }
           throw Error('concurrent-update-retry-limit');
          }
          main().catch(error=>{const reason=/^(auth-unavailable|scope-ambiguous|unexpected-chat-state|verification-failed|concurrent-update-retry-limit|http-\d+)$/.test(error.message)?error.message:'repair-unavailable';console.log('CHAT_REPAIR '+JSON.stringify({state:'failed',reason}));process.exitCode=1;});
          
          JS
