<div id="loginModal">
  <div id="loginCard" dir="rtl">
    <h2>ברוכים הבאים למועדון</h2>
    <div class="note">AVIATORIZIS · משחק באסימונים בלבד — ללא כסף אמיתי.<br>סיבוב אחד משותף לכל השחקנים, בזמן אמת.</div>
    <input class="lgField" id="nickInput" type="text" maxlength="24" placeholder="הכינוי שלך במועדון" autocomplete="nickname">
    <button class="lgBtn" id="guestBtn">כניסה למשחק ✈</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="chatModal">
  <div id="chatCard" dir="rtl">
    <div id="chatHead"><span>צ'אט המועדון</span><button id="chatClose">✕</button></div>
    <div id="chatList"></div>
    <form id="chatForm">
      <input id="chatInput" maxlength="140" placeholder="כתוב הודעה…" autocomplete="off">
      <button id="chatSend" type="submit">שלח</button>
    </form>
  </div>
</div>

<div id="adminModal">
  <div id="adminCard" dir="rtl">
    <h2>פיקוח מנהל <button id="adminClose">✕</button></h2>
    <div class="admSec">שחקנים ויתרות</div>
    <div id="admPlayers" style="display:grid;gap:6px"></div>
    <div class="admSec">סיבובים אחרונים</div>
    <div id="admRounds" style="display:grid;gap:2px"></div>
  </div>
</div>
