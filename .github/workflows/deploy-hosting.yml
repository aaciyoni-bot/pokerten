name: Deploy Firebase Hosting

# Serves the precompiled site (this branch) on Firebase Hosting:
#   https://pokerten.web.app  and  https://pokerten.firebaseapp.com
# Independent of the pokerten.com custom-domain DNS — a reliable fallback link.
# Requires repo secret FIREBASE_TOKEN (same one used by the functions deploy).

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'update.html'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'icon-*.png'
      - 'firebase.json'
      - '.github/workflows/deploy-hosting.yml'
      - 'scripts/wait-for-backend.cjs'
      - 'scripts/mobile-update-source.json'
      - 'scripts/package-public-site.cjs'
      - 'CNAME'
      - '*.png'
      - '*.js'
      - 'src/**'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: public-site-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy-hosting:
    needs: validate
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read pinned Android web runtime
        id: runtime
        run: node -e "const r=require('./scripts/mobile-update-source.json'); if(!/^[a-f0-9]{40}$/.test(r.commit))throw Error('Invalid runtime pin'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'commit='+r.commit+'\n');"

      - name: Check out reviewed native web builder
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.runtime.outputs.commit }}
          path: .native-runtime

      - name: Prepare compatible Android game update
        run: |
          cp -R .native-runtime/mobile mobile
          node - <<'JS'
          const fs=require('fs');
          const file='mobile/ota-release.json';
          const release=JSON.parse(fs.readFileSync(file));
          const web=JSON.parse(fs.readFileSync('assets/release.json'));
          release.version='0.'+web.version+'.'+(Number(process.env.GITHUB_RUN_NUMBER)+1);
          fs.writeFileSync(file,JSON.stringify(release,null,2)+'\n');
          JS
          npm ci --prefix mobile --no-audit --no-fund
          npm run verify --prefix mobile
          node mobile/scripts/package-update.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Wait for the matching backend before publishing new controls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-for-backend.cjs

      - name: Deploy hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project pokerten --non-interactive

      - name: Package the same game and Android update for pokerten.com
        run: node scripts/package-public-site.cjs

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .public-site

  deploy-pages:
    needs: deploy-hosting
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game and compatible Android updates to the main domain
        id: deployment
        uses: actions/deploy-pages@v4
