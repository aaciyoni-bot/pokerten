name: TWA Rebuild (API 36)

on:
  push:
    branches: [twa-rebuild]
    paths: ['twa-build/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [zedmall]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: twa-rebuild

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -eux
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -sSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip
          mv cmdline-tools latest
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@latest

      - name: Build unsigned AAB
        working-directory: twa-build/${{ matrix.app }}
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          yes '' | bubblewrap update --skipPwaValidation || bubblewrap update || true
          ls -la
          if [ -f app/build.gradle ]; then
            sed -i -E 's/compileSd(k|kVersion)[[:space:]]+[0-9]+/compileSdkVersion 36/' app/build.gradle
            sed -i -E 's/targetSdk(Version)?[[:space:]]+[0-9]+/targetSdkVersion 36/' app/build.gradle
            sed -i -E '/signingConfig[[:space:]]+signingConfigs\.release/d' app/build.gradle
            echo '----- build.gradle -----'; cat app/build.gradle
          fi
          chmod +x gradlew || true
          ./gradlew :app:bundleRelease --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/twa-build/out"
          find app/build/outputs -name '*.aab' -exec cp {} "$GITHUB_WORKSPACE/twa-build/out/${{ matrix.app }}.aab" \;
          ls -la "$GITHUB_WORKSPACE/twa-build/out"

      - name: Commit AAB back
        run: |
          set -eux
          git config user.name  "twa-bot"
          git config user.email "twa-bot@users.noreply.github.com"
          git add -f twa-build/out/${{ matrix.app }}.aab
          git commit -m "build(${{ matrix.app }}): unsigned AAB targeting API 36" || echo "nothing to commit"
          git pull --rebase origin twa-rebuild || true
          git push origin twa-rebuild
