name: Deploy Firebase Functions

# Auto-deploys Cloud Functions on any push that touches functions/
# Requires a repo secret named FIREBASE_TOKEN (from `firebase login:ci`)

on:
  push:
    branches:
      - main
      - claude/pokerten-v1
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions --project pokerten --non-interactive --force

      - name: Verify personal-code signing before publishing its login UI
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://us-central1-pokerten.cloudfunctions.net/pkPinStatus', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: {}})
          });
          const result = await response.json();
          if (!response.ok || result.result?.available !== true) {
            const reasons = ['signing-api-disabled', 'signing-permission', 'signing-configuration', 'signing-unavailable'];
            const reason = reasons.includes(result.result?.reason) ? result.result.reason : 'readiness-request-failed';
            throw new Error('Personal-code signing is unavailable: ' + reason);
          }
          console.log('Personal-code token signing verified; no user account was created.');
          JS
