name: Deploy AVIATOR functions

on:
  push:
    branches: [claude/gambling-game-graph-08c7yw]
    paths: ['functions/aviator.js', 'functions/aviatorCore.js']
  workflow_dispatch: {}

concurrency:
  group: aviator-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/claude/gambling-game-graph-08c7yw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source build and timing regressions
        run: |
          node aviator-src/live/build-live.js
          git diff --exit-code -- aviator-live.html
          node --test functions/aviator.test.js aviator-src/live/timing.test.cjs aviator-ux.test.cjs
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Require IDs on new bets before upgrading exits
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions:avBet --project pokerten --non-interactive
      - name: Deploy only compatible AVIATOR functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions:avJoin,functions:avTick,functions:avCancelBet,functions:avCashout,functions:avPeek,functions:avCredit --project pokerten --non-interactive
