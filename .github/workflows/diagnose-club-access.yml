name: Diagnose missing Durak tables (read only)
on:
  push:
    branches: [diagnostics/durak-lobby-20261024]
    paths: ['.github/workflows/diagnose-club-access.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/card-cli" --no-audit --no-fund firebase-tools@13.35.1
      - name: Read card table visibility metadata only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/card-cli/node_modules"
          node <<'JS'
          'use strict';
          const {createHash}=require('node:crypto');
          function decode(v){if(!v)return undefined;if('stringValue'in v)return v.stringValue;if('booleanValue'in v)return v.booleanValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;if('nullValue'in v)return null;if(v.mapValue)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,decode(x)]));return undefined;}
          async function main(){
           if(process.env.GITHUB_ACTIONS!=='true'||!process.env.FIREBASE_TOKEN)throw Error('auth-unavailable');
           const {getAccessToken}=require('firebase-tools/lib/auth');
           const token=await getAccessToken(process.env.FIREBASE_TOKEN,['https://www.googleapis.com/auth/cloud-platform']);
           if(!token.access_token)throw Error('auth-unavailable');
           const base='https://firestore.googleapis.com/v1/projects/pokerten/databases/(default)/documents';
           async function query(collection,fields,where){
            const response=await fetch(base+':runQuery',{method:'POST',headers:{Authorization:'Bearer '+token.access_token,'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:collection}],select:{fields:fields.map(fieldPath=>({fieldPath}))},...(where?{where}:{}),limit:101}}),signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('read-http-'+response.status);
            return(await response.json()).filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),data:decode({mapValue:{fields:x.document.fields}})}));
           }
           const clubs=await query('clubs',['name']);if(clubs.length>100)throw Error('scope-ambiguous');
           const selected=clubs.filter(x=>String(x.data.name||'').trim().toLowerCase()==='netabel');if(selected.length!==1)throw Error('scope-ambiguous');
           const filter={fieldFilter:{field:{fieldPath:'clubId'},op:'EQUAL',value:{stringValue:selected[0].id}}};
           const fields=['type','authorityVersion','cardGameVersion','status','createdAt','closedAt','tournamentId','closeRequested','settings.serverEngine'];
          
           const [durak,ofc,closed,receipts]=await Promise.all([
           query('tables',fields.concat('clubId'),{fieldFilter:{field:{fieldPath:'type'},op:'EQUAL',value:{stringValue:'durak'}}}),
           query('tables',fields.concat('clubId'),{fieldFilter:{field:{fieldPath:'type'},op:'EQUAL',value:{stringValue:'ofc'}}}),
           query('_pkClosedTables',fields.concat('clubId'),{fieldFilter:{field:{fieldPath:'type'},op:'EQUAL',value:{stringValue:'durak'}}}),
           query('_pkRequests',['at','result.tableId'],{fieldFilter:{field:{fieldPath:'scope'},op:'EQUAL',value:{stringValue:'card-table-create'}}})
           ]);
           const safe=x=>({tableRef:createHash('sha256').update(x.id).digest('hex').slice(0,10),inReportedClub:x.data.clubId===selected[0].id,type:x.data.type,authority:x.data.authorityVersion||0,cardVersion:x.data.cardGameVersion||0,status:['setup','waiting','playing','showdown','ended','finished','done','gameover'].includes(x.data.status)?x.data.status:'other',createdAt:x.data.createdAt||null,closedAt:x.data.closedAt||null,tournament:Boolean(x.data.tournamentId),closing:Boolean(x.data.closeRequested)});
           console.log('CARD_LOBBY_DIAGNOSTIC '+JSON.stringify({activeDurak:durak.map(safe),activeOfc:ofc.map(safe),archivedDurak:closed.map(safe),receiptsCount:receipts.length,receipts:receipts.sort((a,b)=>b.data.at-a.data.at).slice(0,20).map(x=>({at:x.data.at,tableRef:createHash('sha256').update(x.data.result?.tableId||'').digest('hex').slice(0,10)}))}));
           const {spawnSync}=require('node:child_process');
           const cli=require.resolve('firebase-tools/lib/bin/firebase');
           const logs=spawnSync(process.execPath,[cli,'functions:log','--only','pkCardTableCreate,pkcardtablecreate','--lines','120','--project','pokerten','--non-interactive'],{encoding:'utf8',timeout:45000,maxBuffer:4*1024*1024,stdio:['ignore','pipe','pipe']});
           const raw=String(logs.stdout||'').replace(/\u001b\[[0-9;]*m/g,'');
           const patterns=[['permission-denied',/permission.denied|Club owner or approved manager|Approved membership required/i],['invalid-input',/invalid.argument|Invalid numeric|Unknown card game|Choose 36|Maximum/i],['serialization',/Cannot use.*undefined|invalid Firestore|Cannot encode|Unsupported field value|not a valid Firestore|serialize|serialization|NaN/i],['read-after-write',/all reads.*before.*writes|read.*after.*write/i],['missing-index',/requires an index/i],['internal',/Unhandled error|INTERNAL|TypeError|ReferenceError/i],['auth',/unauthenticated|unauthorized|authentication required/i],['not-found',/not.found|Club missing|table missing/i]];
           const observed=raw.split('\n').filter(line=>/^\d{4}-\d\d-\d\dT/.test(line));
           console.log('CARD_CREATE_LOG_DIAGNOSTIC '+JSON.stringify({available:logs.status===0,entries:observed.length,latest:observed.map(line=>line.match(/^\d{4}-\d\d-\d\dT\S+/)?.[0]).filter(Boolean).sort().at(-1)||null,categories:patterns.map(([category,re])=>({category,count:observed.filter(line=>re.test(line)).length})).filter(x=>x.count)}));
          
          }
          main().catch(error=>{const reason=/^(auth-unavailable|scope-ambiguous|read-http-\d+)$/.test(error.message)?error.message:'read-unavailable';console.log('CARD_LOBBY_DIAGNOSTIC '+JSON.stringify({state:'failed',reason}));process.exitCode=1;});
          JS
