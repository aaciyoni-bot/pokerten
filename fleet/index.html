<title>ניהול צי רכב — גדוד</title>
<meta name="description" content="מערכת ניהול צי רכב, נהגים ותזקיקים גדודית">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#eef2ef; --panel:#fff; --panel2:#f5f8f5; --ink:#14231b; --ink2:#5c6f63; --mut:#8a9a8f;
  --line:#e0e7e1; --brand:#1f7a4d; --brand-d:#155e3a; --brand-l:#e7f4ec; --glow:#34c47d;
  --ok:#1f9d57; --okbg:#e6f6ec; --warn:#c67e12; --warnbg:#fdf3e0; --bad:#d63b3b; --badbg:#fdeaea;
  --info:#2563c4; --infobg:#e8f0fd; --army:#111; --civil:#ffd400;
  --r:18px; --sh:0 10px 30px -14px rgba(20,50,35,.35); --sh2:0 3px 10px -4px rgba(20,50,35,.2);
  color-scheme:light;
}
*{box-sizing:border-box} html,body{margin:0}
body{direction:rtl;font-family:"Rubik",system-ui,Arial,sans-serif;background:
  radial-gradient(1100px 480px at 90% -8%,rgba(31,122,77,.10),transparent 60%),var(--bg);
  color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:78px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--brand-d),var(--brand));color:#fff;box-shadow:0 6px 22px -12px rgba(0,0,0,.5)}
.head{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
.logo{width:44px;height:44px;border-radius:13px;background:#ffffff18;border:1px solid #ffffff33;display:grid;place-items:center;font-size:22px;flex:none}
.head h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.head .sub{font-size:11.5px;color:#d7e9de;margin-top:2px;font-weight:500}
.head .role{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.rolechip{background:#ffffff1c;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;font-size:21px}

/* menu */
.menu-pop{display:none;position:fixed;top:66px;inset-inline-start:12px;z-index:70;width:min(300px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 45px -18px rgba(0,0,0,.4);padding:8px;overflow:hidden}
.menu-pop.show{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.menu-pop button{width:100%;border:0;background:#fff;border-radius:11px;padding:12px 13px;text-align:right;font-weight:700;color:var(--ink);display:flex;gap:10px;align-items:center}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop .sep{height:1px;background:var(--line);margin:6px 4px}
.menu-pop .danger{color:#a13333}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--sh2);position:relative;overflow:hidden;transition:transform .12s}
.kpi:active{transform:scale(.98)}
.kpi .n{font-size:27px;font-weight:900;line-height:1}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:3px;font-weight:600}
.kpi.acc::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--brand)}
.kpi.alert{background:var(--badbg);border-color:#f3c7c7}.kpi.alert .n{color:var(--bad)}
.kpi.good .n{color:var(--ok)} .kpi.warnk .n{color:var(--warn)}
.kpi.clk{cursor:pointer}

/* filter chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;transition:.14s}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 14px -8px var(--brand)}

/* search */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 44px 13px 14px;font-size:15px;background:#fff;box-shadow:var(--sh2)}
.search .ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:14px;color:var(--mut);font-size:17px}

/* vehicle grid */
.section-h{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px}
.section-h h2{font-size:16px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh2);transition:transform .12s,box-shadow .2s;overflow:hidden}
.vcard:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.vcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--stripe,var(--line))}
.vcard.s-ok{--stripe:var(--ok)} .vcard.s-mission{--stripe:var(--info)} .vcard.s-bad{--stripe:var(--bad)}
.vcard.s-service{--stripe:var(--warn)} .vcard.s-wait{--stripe:var(--mut)}
.card-x{position:absolute;top:10px;inset-inline-start:10px;z-index:5;width:28px;height:28px;border-radius:9px;border:1px solid #f0c2c2;background:#fff;color:var(--bad);font-size:19px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;transition:.12s}
.card-x:active{transform:scale(.9)}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-inline-start:26px}
.vtitle{min-width:0}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:118px;height:34px;border-radius:6px;font-weight:900;letter-spacing:.6px;direction:ltr;padding:0 10px;font-size:16px;box-shadow:0 1px 3px #0002}
.plate.army{background:var(--army);color:#fff;border:2px solid #e9e9e9;position:relative;padding-inline-end:26px}
.plate.army::after{content:'צ';position:absolute;inset-inline-end:7px;font-weight:900}
.plate.civil{background:var(--civil);color:#111;border:2px solid #111;position:relative;padding-inline-start:24px}
.plate.civil::before{content:'🇮🇱';position:absolute;inset-inline-start:5px;font-size:11px}
.vtype{font-size:12.5px;color:var(--ink2);margin-top:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;height:max-content;display:inline-flex;gap:4px;align-items:center}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.mission{background:var(--infobg);color:var(--info)}
.pill.bad{background:var(--badbg);color:var(--bad)} .pill.service{background:var(--warnbg);color:var(--warn)} .pill.wait{background:#eef0ee;color:#6a776e}
.vmeta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.mbox{background:var(--panel2);border-radius:11px;padding:8px 10px}
.mbox small{display:block;color:var(--mut);font-size:10.5px;font-weight:600} .mbox b{font-size:13px}
.valert{margin-top:9px;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.valert.bad{background:var(--badbg);color:var(--bad)} .valert.warn{background:var(--warnbg);color:var(--warn)}
.vacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.vacts button{border:0;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800;background:var(--panel2);color:var(--ink2);transition:.12s}
.vacts button:active{transform:scale(.96)}
.vacts .b-ok{background:var(--okbg);color:var(--ok)} .vacts .b-move{background:var(--infobg);color:var(--info)} .vacts .b-edit{background:var(--brand-l);color:var(--brand-d)}

/* fuel */
.fuel-base{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh2);margin-bottom:12px}
.fuel-base h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.frow{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin:9px 0}
.frow .fk{font-size:13px;color:var(--ink2);font-weight:600}
.ftrk{height:12px;background:#ecefec;border-radius:7px;overflow:hidden}
.ffill{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fv{font-size:13px;font-weight:800;text-align:left}
.cardlist{display:grid;gap:8px}
.fcard{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--sh2)}
.fcard .fic{width:40px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--brand),var(--glow));color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.fcard b{font-size:14px} .fcard small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.fcard .st{margin-inline-start:auto}

/* drivers */
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--sh2);margin-bottom:9px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dname{font-size:15.5px;font-weight:800}
.dsub{font-size:12px;color:var(--ink2);margin-top:2px}
.permits{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.perm{font-size:11px;font-weight:700;background:var(--brand-l);color:var(--brand-d);border-radius:8px;padding:3px 9px}
.phone-line{display:flex;gap:7px;margin-top:10px;align-items:center}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:16px}
.mini.wa{color:#128c4a}
.dcard{transition:transform .12s,box-shadow .2s} .dcard:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.dchips{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12.5px;color:var(--ink2);font-weight:600}
.dchips .more{margin-inline-start:auto;color:var(--brand);font-weight:800}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.dg{background:var(--panel2);border-radius:11px;padding:9px 11px}
.dg small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px} .dg b{font-size:13.5px}

/* bottom nav */
.bottom{position:fixed;bottom:0;inset-inline:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.3)}
.bottom button{border:0;background:none;padding:9px 4px 6px;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s}
.bottom button .bi{font-size:20px;line-height:1;transition:transform .16s}
.bottom button.active{color:var(--brand)} .bottom button.active .bi{transform:translateY(-2px) scale(1.08)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:
  radial-gradient(900px 500px at 50% -10%,rgba(31,122,77,.18),transparent 60%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:28px 24px;box-shadow:0 30px 70px -30px rgba(20,50,35,.5);text-align:center}
.login .biglogo{width:82px;height:82px;border-radius:24px;background:linear-gradient(140deg,var(--brand-d),var(--glow));display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 16px 34px -12px var(--brand)}
.veh{display:block} .biglogo .veh{width:56px;height:auto} .logo .veh{width:30px;height:auto}
.login h2{font-size:22px;font-weight:900}.login .p{color:var(--ink2);font-size:13px;margin:4px 0 18px}
.login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;text-align:center;margin-bottom:10px}
.login input:focus{outline:none;border-color:var(--brand)}
.login .go{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand-d));box-shadow:0 12px 26px -12px var(--brand)}
.login .go:active{transform:scale(.98)} .login .err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}

/* modal */
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:9999;align-items:flex-end}
.modal.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px)}}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:14px}
.field{margin:11px 0}.field label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:var(--panel2);color:var(--ink2)}

.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--mut);font-weight:600}
.demo-tag{display:inline-block;font-size:10px;font-weight:800;background:#fff4d8;color:#8a6410;border-radius:6px;padding:2px 7px;margin-inline-start:6px}
.head>div{min-width:0} .head .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){
  body{font-size:14px;padding-bottom:74px}
  .wrap{padding:12px 11px}
  .head{gap:8px;padding:10px 11px} .head h1{font-size:16px} .head .sub{font-size:10.5px}
  #syncDot{font-size:10px} .rolechip{padding:5px 9px;font-size:11px}
  .kpis{gap:8px} .kpi{padding:11px 12px} .kpi .n{font-size:23px} .kpi .l{font-size:11px}
  .grid{grid-template-columns:1fr;gap:10px}
  .vcard{padding:13px 13px 11px} .plate{min-width:104px;height:32px;font-size:15px}
  .vacts button{font-size:11.5px;padding:9px 3px}
  .frow{grid-template-columns:84px 1fr 40px;gap:8px}
  .fuel-base,.dcard{padding:13px}
  .bottom button{font-size:9.5px;padding:8px 2px 5px} .bottom button .bi{font-size:18px}
  .sheet{padding:16px} .login-card{padding:24px 18px}
}
@media(max-width:360px){ .kpis{grid-template-columns:repeat(2,1fr)} .head h1{font-size:15px} }
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <div class="head">

function doLogin(){
  const pn=($('#lgPn').value||'').replace(/\D/g,''), pin=($('#lgPin').value||'').replace(/\D/g,'');
  const d=DRIVERS.find(x=>x.pn===pn);
  // demo: officer master code 1894; otherwise match driver's last-4
  if(pn==='0000'||pn==='1894'){ startSession('officer','קצין הרכב',null); return; }
  if(!d){ $('#lgErr').textContent='מספר אישי לא נמצא ברשומה'; return; }
  if(pin!==d.pin){ $('#lgErr').textContent='קוד שגוי (4 ספרות אחרונות של המ״א)'; return; }
  // role by the roster's own role field — the source of truth
  let role, sc=null;
  if(d.role==='קצין רכב') role='officer';
  else if(d.role==='סמל רכב') role='sergeant';
  else if(['א','ג','ד'].includes(d.company)){ role='commander'; sc={'א':'A','ג':'C','ד':'D'}[d.company]; }
  else role='viewer';
  startSession(role, d.name, sc);
}
function startSession(role,name,scope){ sess={role,name,scope}; $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  applyRole(); go(role==='commander'?'company':'fleet');
  if(name) setTimeout(()=>toast('👋 ברוך הבא, '+name),350); }
function applyRole(){ $('#hdrTitle').textContent=ROLE_TITLE[sess.role];
  $('#hdrSub').textContent = sess.name ? ('שלום, '+firstName(sess.name)+' · '+ROLE_SUB[sess.role]) : ROLE_SUB[sess.role];

function switchRole(){ const order=['officer','sergeant','commander']; let i=order.indexOf(sess.role);
  sess.role=order[(i+1)%3]; sess.scope = sess.role==='commander'?'A':null; sess.name = ROLE_CHIP[sess.role];
  applyRole(); go(sess.role==='commander'?'company':'fleet'); }

function daysUntil(d){ if(!d) return null; const a=new Date();a.setHours(0,0,0,0); return Math.ceil((new Date(d+'T00:00:00')-a)/864e5); }
function nextService(v){ if(isCivil(v)||!v.lastService||!v.frequency) return ''; const d=new Date(v.lastService+'T00:00:00'); d.setDate(d.getDate()+Number(v.frequency)); return d.toISOString().slice(0,10); }

function renderFleet(){
  const all=scopeVehicles();
  const k={total:all.length,ok:0,mission:0,bad:0,service:0,noDrv:0,att:0};
  all.forEach(v=>{ if(v.status==='כשיר')k.ok++; if(v.status==='במשימה')k.mission++;
    if(['תקול','מושבת'].includes(v.status))k.bad++; if(v.status==='בטיפול')k.service++;
    if(!v.drivers||!v.drivers.length)k.noDrv++; if(needsAttention(v))k.att++; });
  let vs=all.filter(v=>{
    if(fleetStatus!=='all'&&STAT[v.status]!==fleetStatus) return false;
    if(fleetFilter!=='all'&&v.unit!==fleetFilter) return false;
    if(fleetSearch){ const q=fleetSearch, dg=q.replace(/\D/g,''); const num=String(v.number).replace(/\D/g,'');
      if(!( (v.type||'').includes(q)||(dg&&num.includes(dg))||(v.commander||'').includes(q) )) return false; }
    return true;
  });
  let h=`<div class="kpis">
    <div class="kpi acc clk" onclick="fleetStatus='all';render()"><div class="n tnum">${k.total}</div><div class="l">סה״כ רכבים</div></div>
    <div class="kpi good clk" onclick="setStatusFilter('ok')"><div class="n tnum">${k.ok}</div><div class="l">כשירים</div></div>
    <div class="kpi clk" onclick="setStatusFilter('mission')"><div class="n tnum" style="color:var(--info)">${k.mission}</div><div class="l">במשימה</div></div>
    <div class="kpi alert clk" onclick="setStatusFilter('bad')"><div class="n tnum">${k.bad}</div><div class="l">תקולים/מושבתים</div></div>
    <div class="kpi warnk clk" onclick="setStatusFilter('service')"><div class="n tnum">${k.service}</div><div class="l">בטיפול</div></div>
    <div class="kpi clk" onclick="fleetStatus='all';render()"><div class="n tnum" style="color:var(--mut)">${k.noDrv}</div><div class="l">ללא נהג</div></div>
    <div class="kpi alert clk" onclick="scrollAttention()"><div class="n tnum">${k.att}</div><div class="l">דורש תשומת לב</div></div>
    <div class="kpi clk" onclick="openIntake()"><div class="n" style="color:var(--brand)">➕</div><div class="l">קליטת רכב</div></div>
  </div>`;
  h+=`<div class="search"><span class="ic">🔍</span><input placeholder="חיפוש מספר / סוג / מפקד" value="${esc(fleetSearch)}" oninput="fleetSearch=this.value.trim();renderFleetList()"></div>`;
  h+=`<div class="chips" id="frChips">${chip('all','כל המסגרות',fleetFilter==='all',"setFleetFilter('all')")}
    ${FR.map(f=>chip(f.id,f.name,fleetFilter===f.id,`setFleetFilter('${f.id}')`)).join('')}</div>`;
  h+=`<div class="section-h"><h2>הצי <span style="color:var(--mut);font-weight:600;font-size:13px">(${vs.length})</span></h2></div>`;
  h+=`<div class="grid" id="fleetGrid">${vs.map(vehicleCard).join('')||emptyBox('אין רכבים בסינון זה')}</div>`;
  $('#screen').innerHTML=h;
}
function renderFleetList(){ renderFleet(); const inp=$('#screen .search input'); if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);} }
function setStatusFilter(s){ fleetStatus = fleetStatus===s?'all':s; render(); }
function setFleetFilter(id){ fleetFilter=id; render(); }
function chip(id,label,on,fn){ return `<button class="chip" aria-pressed="${on}" onclick="${fn}">${esc(label)}</button>`; }
function scrollAttention(){ fleetStatus='all'; render(); }

function vehicleCard(v){
  const sc=STAT[v.status]||'wait', t=trackDate(v), n=daysUntil(t);
  let al='';
  if(t&&n!=null){ if(n<0) al=`<div class="valert bad">⚠ ${isCivil(v)?'טסט פג':'טיפול באיחור'} · ${Math.abs(n)} ימים</div>`;
    else if(n<=7) al=`<div class="valert warn">${isCivil(v)?'🟨 טסט':'🛠 טיפול'} בעוד ${n} ימים</div>`; }
  const vid = v.deliveryVideo==='לא צולם' ? `<div class="valert bad">🔴 סרטון מסירה לא צולם</div>`:'';
  const fr=FRBY[v.unit];
  return `<div class="vcard s-${sc}">
    <button class="card-x" title="הסר קובייה" onclick="hideCard(${v.id})">×</button>
    <div class="vtop"><div class="vtitle">${plate(v)}
      <div class="vtype">${esc(v.type)} · ${esc(fr?fr.name:'—')}${v.slot?' · '+esc(v.slot):''}${v.demo?'<span class="demo-tag">דמו</span>':''}</div></div>
      <span class="pill ${sc}">${esc(v.status)}</span></div>
    <div class="vmeta">
      <div class="mbox"><small>${isCivil(v)?'תוקף טסט':'טיפול הבא'}</small><b class="tnum">${fmtHe(t)}</b></div>
      <div class="mbox"><small>מפקד/אחראי</small><b>${esc(v.commander||'—')}</b></div>
    </div>${al}${vid}
    <div class="vacts">
      <button class="b-ok" onclick="markOk(${v.id})">✔ תקין</button>
      <button class="b-move" onclick="openTransfer(${v.id})">🔄 העבר</button>
      <button class="b-edit" onclick="openEdit(${v.id})">✏ ערוך</button>
    </div></div>`;
}
function emptyBox(t){ return `<div class="empty" style="grid-column:1/-1">${esc(t)}</div>`; }

/* ===== COMPANY (green-eyes-like scoped) ===== */
let compSel='A';
function renderCompany(){
  const cid = sess.role==='commander' ? sess.scope : compSel;
  const fr=FRBY[cid]; const vs=S.vehicles.filter(v=>v.unit===cid);
  const done=vs.filter(v=>v.status==='כשיר'&&!needsAttention(v)).length;
  let h='';
  if(sess.role!=='commander'){
    h+=`<div class="chips">${FR.filter(f=>['A','C','D'].includes(f.id)).map(f=>chip(f.id,f.name,cid===f.id,`compSel='${f.id}';render()`)).join('')}
      ${FR.filter(f=>!['A','C','D'].includes(f.id)).map(f=>chip(f.id,f.name,cid===f.id,`compSel='${f.id}';render()`)).join('')}</div>`;
  }
  h+=`<div class="section-h"><h2>🎖️ ${esc(fr.name)} <span style="color:var(--mut);font-weight:600;font-size:13px">· ${esc(fr.base)}</span></h2></div>`;
  h+=`<div class="kpis"><div class="kpi acc"><div class="n tnum">${vs.length}</div><div class="l">רכבים במסגרת</div></div>
    <div class="kpi good"><div class="n tnum">${done}</div><div class="l">כשירים ותקינים</div></div>
    <div class="kpi warnk"><div class="n tnum">${vs.filter(needsAttention).length}</div><div class="l">דורש תשומת לב</div></div>
    <div class="kpi"><div class="n tnum" style="color:var(--info)">${vs.filter(v=>v.status==='במשימה').length}</div><div class="l">במשימה</div></div></div>`;
  // slot checklist (green-eyes style)
  h+=`<div class="section-h"><h2>סבב בדיקה יומי</h2></div><div class="grid">`;
  fr.slots.forEach(slot=>{ const v=vs.find(x=>x.slot===slot);
    if(v){ h+=vehicleCard(v); }
    else h+=`<div class="vcard s-wait" style="opacity:.85"><div class="vtop"><div class="vtitle"><b>${esc(slot)}</b><div class="vtype">אין רכב משובץ</div></div><span class="pill wait">ריק</span></div>
      <div class="vacts" style="grid-template-columns:1fr"><button class="b-edit" onclick="openIntake('${cid}','${esc(slot)}')">➕ שבץ רכב</button></div></div>`; });
  h+=`</div>`;
  $('#screen').innerHTML=h;
}

/* ===== DRIVERS ===== */
let drvSearch='';
function renderDrivers(){
  const q=drvSearch.trim(), dg=q.replace(/\D/g,'');
  let list=DRIVERS.filter(d=>{ if(!q) return true;
    return (d.name||'').includes(q)||(dg&&(d.pn.includes(dg)||(d.phone||'').replace(/\D/g,'').includes(dg))); });
  if(sess.role==='commander'){ const c={A:'א',C:'ג',D:'ד'}[sess.scope]; list=list.filter(d=>d.company===c); }
  let h=`<div class="search"><span class="ic">🔍</span><input placeholder="חיפוש נהג — שם / מ״א / טלפון" value="${esc(drvSearch)}" oninput="drvSearch=this.value;renderDrivers();focusSearch()"></div>`;
  h+=`<div class="section-h"><h2>נהגים <span style="color:var(--mut);font-weight:600;font-size:13px">(${list.length})</span></h2></div>`;
  h+=list.slice(0,120).map(driverCard).join('')||emptyBox('לא נמצאו נהגים');
  if(list.length>120) h+=`<div class="empty">מוצגים 120 ראשונים — צמצם בחיפוש</div>`;
  $('#screen').innerHTML=h;
}
function focusSearch(){ const i=$('#screen .search input'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} }
function piiOk(){ return sess.role==='officer'||sess.role==='sergeant'; } // מ״א/טלפון — קצין/סמל בלבד
function driverCard(base){
  const d=getDriver(base.pn); const pii=piiOk(); const phone=(d.phone||'').replace(/\D/g,'');
  const np=(d.permits||[]).length;
  return `<div class="dcard" onclick="openDriver('${esc(d.pn)}')" style="cursor:pointer">
    <div class="dtop"><div><div class="dname">${esc(d.name||'—')}</div>
      <div class="dsub">${esc(d.company?('פלוגה '+d.company):'')}${d.dept?' · '+esc(d.dept):''}${d.role?' · '+esc(d.role):''}</div></div>
      ${pii?`<span class="pill wait tnum">מ״א ${esc(d.pn)}</span>`:''}</div>
    <div class="dchips">
      ${d.license?`<span>🪪 ${esc(d.license)}</span>`:''}
      ${np?`<span>🔑 ${np} היתרים</span>`:'<span style="color:var(--mut)">ללא היתרים מיוחדים</span>'}
      ${pii&&phone?`<span>📞 ${esc(d.phone)}</span>`:''}
      <span class="more">כרטיס מלא ›</span></div>
  </div>`;
}
function openDriver(pn){
  const d=getDriver(pn); if(!d.name&&!d.pn) return; const pii=piiOk(); const phone=(d.phone||'').replace(/\D/g,'');
  const rows=[['תפקיד',d.role],['פלוגה',d.company],['מחלקה',d.dept],['סוג רישיון',d.license],
    ['נגררת',d.trailer],['רכב פרטי',d.private],['רענון נהיגה אחרון',d.lastRefresh],['דרישות קורסים',d.courses]];
  if(pii) rows.unshift(['מספר אישי',d.pn]);
  let b=`<div class="dgrid">${rows.map(([k,v])=>`<div class="dg"><small>${esc(k)}</small><b>${esc(v||'—')}</b></div>`).join('')}</div>`;
  b+=`<div class="detail-block"><small>🔑 היתרי נהיגה / רכבים</small>${(d.permits&&d.permits.length)
    ?`<div class="permits" style="margin-top:8px">${d.permits.map(p=>`<span class="perm">${esc(p)}</span>`).join('')}</div>`
    :`<div style="color:var(--mut);margin-top:6px">אין היתרים מיוחדים רשומים</div>`}</div>`;
  if(pii){ b+=`<div class="detail-block"><small>📞 טלפון</small>${phone
    ?`<div class="phone-line" style="margin-top:8px"><a class="mini" href="tel:${phone}">📞</a>
        <a class="mini wa" href="https://wa.me/972${phone.replace(/^0/,'')}" target="_blank" rel="noopener">🟢</a>
        <span class="tnum" style="font-size:15px;font-weight:700">${esc(d.phone)}</span></div>`
    :`<div style="color:var(--mut);margin-top:6px">אין טלפון${canEdit()?' — הוסף בעריכה':''}</div>`}</div>`; }
  if(d.notes) b+=`<div class="detail-block"><small>הערות</small><div style="margin-top:4px">${esc(d.notes)}</div></div>`;
  $('#sheet').innerHTML=`<h3>כרטיס נהג — ${esc(d.name||'')}</h3>${b}
    <div class="srow">${canEdit()?`<button class="btn primary" onclick="editDriver('${esc(pn)}')">✏️ עריכת נהג</button>`:'<span></span>'}
      <button class="btn ghost" onclick="closeSheet()">סגירה</button></div>`;
  $('#modal').classList.add('show');
}
function editDriver(pn){
  const d=getDriver(pn); const ov=(S.driverOverrides||{})[pn]||{};
  openSheet('עריכת נהג — '+(d.name||''),`
    <div class="field"><label>טלפון (עדכון ידני נשמר כ-Override)</label><input id="ed_phone" inputmode="tel" value="${esc(d.phone||'')}" placeholder="05..."></div>
    <div class="field"><label>תפקיד</label><input id="ed_role" value="${esc(d.role||'')}"></div>
    <div class="field"><label>מחלקה</label><input id="ed_dept" value="${esc(d.dept||'')}"></div>
    <div class="field"><label>הערות</label><textarea id="ed_notes" rows="2">${esc(d.notes||'')}</textarea></div>`,
    ()=>{ if(!guard())return; S.driverOverrides=S.driverOverrides||{};
      S.driverOverrides[pn]={...ov, phone:$('#ed_phone').value.trim(), role:$('#ed_role').value.trim(), dept:$('#ed_dept').value.trim(), notes:$('#ed_notes').value.trim()};
      save(); toast('✔ נשמר'); closeSheet(); render(); });
}

/* ===== FUEL / תזקיקים ===== */
function renderFuel(){
  const fuelColor=p=>p<25?'var(--bad)':p<50?'var(--warn)':'var(--ok)';
  let h=`<div class="section-h"><h2>⛽ תזקיקים לפי בסיס</h2></div>`;
  h+=`<div class="kpis"><div class="kpi acc"><div class="n">${S.fuel.length}</div><div class="l">בסיסים</div></div>
    <div class="kpi alert"><div class="n tnum">${S.fuel.reduce((a,b)=>a+b.items.filter(i=>i.pct<25).length,0)}</div><div class="l">מלאי קריטי</div></div>
    <div class="kpi"><div class="n tnum">${S.cards.length}</div><div class="l">כרטיסי דלק</div></div>
    <div class="kpi alert"><div class="n tnum">${S.cards.filter(c=>c.status==='חסום').length}</div><div class="l">כרטיסים חסומים</div></div></div>`;
  S.fuel.forEach((b,bi)=>{ h+=`<div class="fuel-base"><h3>📍 ${esc(b.base)}</h3>`;
    b.items.forEach((it,ii)=>{ h+=`<div class="frow"><div class="fk">${esc(it.k)}</div>
      <div class="ftrk"><div class="ffill" style="width:${it.pct}%;background:${fuelColor(it.pct)}"></div></div>
      <div class="fv tnum" style="color:${fuelColor(it.pct)}">${it.pct}%</div></div>`; });
    h+=`</div>`; });
  h+=`<div class="section-h"><h2>💳 כרטיסי דלק</h2><button class="chip" aria-pressed="false" onclick="alert('הוספת כרטיס — בגרסה המחוברת')">➕ כרטיס</button></div>`;
  h+=`<div class="cardlist">${S.cards.map(c=>`<div class="fcard"><div class="fic">💳</div>
    <div><b>${esc(c.id)}</b><small>${esc(c.holder)} · ${esc(c.type)} · פעולה אחרונה ${esc(c.last)}</small></div>
    <span class="pill ${c.status==='פעיל'?'ok':'bad'} st">${esc(c.status)}</span></div>`).join('')}</div>`;
  $('#screen').innerHTML=h;
}

/* ===== ACTIONS ===== */
function canEdit(){ return sess.role==='officer'||sess.role==='sergeant'; }
function guard(){ if(!canEdit()){ toast('מצב צפייה בלבד'); return false;} return true; }
function hideCard(id){ if(!guard())return; const v=S.vehicles.find(x=>x.id===id);
  if(confirm(`להסיר את הקובייה של ${fullNum(v)} מהתצוגה?\nהרכב וכל נתוניו יישארו במאגר.`)){ v.hiddenCard=true; save(); toast('הקובייה הוסרה'); render(); } }
function markOk(id){ if(!guard())return; const v=S.vehicles.find(x=>x.id===id); v.status='כשיר'; v.lastCheck=new Date().toISOString().slice(0,10); save(); toast('✔ סומן תקין'); render(); }
function openEdit(id){ const v=S.vehicles.find(x=>x.id===id);
  openSheet('עריכת '+fullNum(v),`
    <div class="field"><label>סטטוס</label><select id="e_st">${['כשיר','במשימה','תקול','בטיפול','מושבת','ממתין לשיבוץ'].map(s=>`<option ${v.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>מפקד / אחראי (טקסט חופשי)</label><input id="e_cmd" value="${esc(v.commander||'')}"></div>
    <div class="field"><label>🎬 סרטון מסירה</label><select id="e_vid"><option value="">— לא הוגדר —</option><option ${v.deliveryVideo==='צולם'?'selected':''}>צולם</option><option ${v.deliveryVideo==='לא צולם'?'selected':''}>לא צולם</option></select></div>
    <div class="field"><label>הערות</label><textarea id="e_notes" rows="2">${esc(v.notes||'')}</textarea></div>`,
    ()=>{ if(!guard())return; v.status=$('#e_st').value; v.commander=$('#e_cmd').value.trim(); v.deliveryVideo=$('#e_vid').value; v.notes=$('#e_notes').value.trim(); save(); toast('נשמר'); closeSheet(); render(); },
    v.status==='מושבת'?null:{label:'⛔ השבת רכב',fn:()=>{ if(!guard())return; v.status='מושבת'; save(); closeSheet(); toast('הרכב הושבת'); render(); }});
}
function openTransfer(id){ const v=S.vehicles.find(x=>x.id===id);
  openSheet('העברת '+fullNum(v)+' בין מסגרות',`
    <div class="field"><label>מסגרת יעד</label><select id="t_fr">${FR.map(f=>`<option value="${f.id}" ${v.unit===f.id?'selected':''}>${f.name}</option>`).join('')}</select></div>
    <div class="field"><label>משימה / slot</label><input id="t_slot" value="${esc(v.slot||'')}" placeholder="למשל סיור 1"></div>
    <div style="font-size:12px;color:var(--ink2)">מעביר מסגרת · משימה · והשיוך לרכב.</div>`,
    ()=>{ if(!guard())return; v.unit=$('#t_fr').value; v.slot=$('#t_slot').value.trim(); save(); toast('✔ הרכב הועבר'); closeSheet(); render(); });
}
function openIntake(unit,slot){ if(!guard())return;
  openSheet('➕ קליטת רכב חדש',`
    <div class="srow" style="margin-top:0"><div class="field"><label>סוג מספר</label><select id="i_pref"><option>צ-</option><option>ל.ז-</option></select></div>
      <div class="field"><label>מספר רכב</label><input id="i_num" inputmode="numeric" placeholder="591220"></div></div>
    <div class="field"><label>סוג רכב</label><input id="i_type" placeholder="טריטון / דויד / אמבולנס..."></div>
    <div class="field"><label>מסגרת</label><select id="i_fr">${FR.map(f=>`<option value="${f.id}" ${f.id===unit?'selected':''}>${f.name}</option>`).join('')}</select></div>
    <div class="field"><label>משימה / slot</label><input id="i_slot" value="${slot?esc(slot):''}" placeholder="סיור 1 / כ״כ..."></div>
    <div class="field"><label>מפקד / אחראי</label><input id="i_cmd" placeholder="שם (חופשי)"></div>`,
    ()=>{ const num=($('#i_num').value||'').trim(); if(!num){toast('הזן מספר רכב');return;}
      const id=Math.max(0,...S.vehicles.map(x=>x.id))+1; const pref=$('#i_pref').value;
      S.vehicles.push({id,prefix:pref,number:num,type:$('#i_type').value.trim()||'לא הוגדר',unit:$('#i_fr').value,slot:$('#i_slot').value.trim(),
        commander:$('#i_cmd').value.trim(),status:'ממתין לשיבוץ',drivers:[],notes:'',deliveryVideo:'',
        ...(pref.includes('ל')?{testExpiry:''}:{lastService:new Date().toISOString().slice(0,10),frequency:14})});
      save(); toast('✔ הרכב נקלט'); closeSheet(); view='fleet'; go('fleet'); });
}

/* ===== modal + toast ===== */
function openSheet(title,body,onSave,extra){
  $('#sheet').innerHTML=`<h3>${esc(title)}</h3>${body}
    <div class="srow"><button class="btn primary" id="_sv">שמור</button><button class="btn ghost" onclick="closeSheet()">ביטול</button></div>
    ${extra?`<button class="btn" style="width:100%;margin-top:8px;background:var(--badbg);color:var(--bad)" id="_ex">${esc(extra.label)}</button>`:''}`;
  $('#modal').classList.add('show'); if(onSave)$('#_sv').onclick=onSave; if(extra)$('#_ex').onclick=extra.fn;
}
function closeSheet(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeSheet(); });
let toastT; function toast(m){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast';
  t.style.cssText='position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:99999;background:#14231b;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 10px 30px -8px #0007;opacity:0;transition:opacity .2s'; document.body.appendChild(t);}
  t.textContent=m; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,1800); }

// boot
$('#lgPn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lgPin').focus();});
$('#lgPin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
