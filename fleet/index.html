<title>מצבת רכב גדודית</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap">
<style>
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --surface2:#E9EBE2; --ink:#1E2419; --muted:#5C6455;
  --line:#D5D9CC; --accent:#4E6636; --accent-soft:#E3EAD5; --accent-ink:#FFFFFF;
  --good:#2F7D4F; --good-soft:#DDEEE3; --warn:#A96F1F; --warn-soft:#F4E8D2;
  --crit:#B3372E; --crit-soft:#F6DCD9; --info:#31708F; --info-soft:#DBE9F0;
  --shadow:0 1px 3px rgba(30,36,25,.10);
  --veh-body:#68794F; --veh-dark:#46523A; --veh-window:#C6D2D8; --veh-tire:#23261F;
  --veh-rim:#99A188; --veh-white:#F2F2EC; --veh-red:#C0392B; --veh-metal:#A9AF9C;
  --veh-shadow:rgba(30,36,25,.16); --card-hover:0 10px 24px rgba(30,36,25,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A13; --surface:#1F2419; --surface2:#262C1F; --ink:#E8EADF; --muted:#9AA28C;
    --line:#39402F; --accent:#8FA860; --accent-soft:#33401F; --accent-ink:#141810;
    --good:#6FBF8B; --good-soft:#1E3527; --warn:#D9A24A; --warn-soft:#3B2F17;
    --crit:#E07B6E; --crit-soft:#3E211D; --info:#6FAECB; --info-soft:#1D3340;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --veh-body:#7E905F; --veh-dark:#5A6847; --veh-window:#9FB4BF; --veh-tire:#0F110D;
    --veh-rim:#6F7863; --veh-white:#D8D9D2; --veh-red:#E07B6E; --veh-metal:#7C8270;
    --veh-shadow:rgba(0,0,0,.45); --card-hover:0 10px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#161A13; --surface:#1F2419; --surface2:#262C1F; --ink:#E8EADF; --muted:#9AA28C;
  --line:#39402F; --accent:#8FA860; --accent-soft:#33401F; --accent-ink:#141810;
  --good:#6FBF8B; --good-soft:#1E3527; --warn:#D9A24A; --warn-soft:#3B2F17;
  --crit:#E07B6E; --crit-soft:#3E211D; --info:#6FAECB; --info-soft:#1D3340;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --veh-body:#7E905F; --veh-dark:#5A6847; --veh-window:#9FB4BF; --veh-tire:#0F110D;
  --veh-rim:#6F7863; --veh-white:#D8D9D2; --veh-red:#E07B6E; --veh-metal:#7C8270;
  --veh-shadow:rgba(0,0,0,.45); --card-hover:0 10px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{direction:rtl}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.55;
}
h1,h2,h3{font-family:'Secular One','Heebo',sans-serif; font-weight:400; margin:0; text-wrap:balance}
button{font-family:inherit; font-size:14px; cursor:pointer}
input,select,textarea{
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:6px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
label{font-size:13px; color:var(--muted); display:block; margin-bottom:3px}

/* ---------- header + nav ---------- */
header.app{
  background:
    repeating-linear-gradient(-45deg, rgba(255,255,255,.045) 0 14px, transparent 14px 28px),
    linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #10130C));
  color:var(--accent-ink); padding:14px 22px 0;
}
header.app h1{display:flex; align-items:center; gap:10px}
.emblem{
  width:34px; height:34px; border-radius:8px; flex:none;
  background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.35);
  display:inline-flex; align-items:center; justify-content:center;
}
.emblem svg{width:20px; height:20px; fill:var(--accent-ink)}
header.app .top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
header.app h1{font-size:26px; letter-spacing:.5px}
header.app .sub{opacity:.85; font-size:13px}
header.app .spacer{flex:1}
nav.tabs{display:flex; gap:7px; margin-top:14px; padding-bottom:14px; flex-wrap:wrap}
nav.tabs button{
  background:rgba(255,255,255,.10); color:var(--accent-ink);
  border:1px solid rgba(255,255,255,.28); border-radius:9px;
  padding:8px 15px; font-size:14.5px; font-weight:500; position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
  transition:background .13s, transform .13s, box-shadow .13s;
}
nav.tabs button:hover{background:rgba(255,255,255,.22); transform:translateY(-1px)}
nav.tabs button:active{transform:translateY(0)}
nav.tabs button .bdg{
  background:var(--crit); color:#fff; border-radius:999px; font-size:11px;
  padding:0 6px; margin-inline-start:5px; display:inline-block; min-width:18px; text-align:center;
}
nav.tabs button.on{
  background:var(--bg); color:var(--ink); border-color:var(--bg);
  box-shadow:0 2px 6px rgba(0,0,0,.28); font-weight:700; transform:none;
}
main{max-width:1240px; margin:0 auto; padding:20px 22px 60px}

/* ---------- cards / layout ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin-bottom:18px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 15px; box-shadow:var(--shadow)}
.card .num{font-size:30px; font-family:'Secular One',sans-serif; line-height:1.1; font-variant-numeric:tabular-nums}
.card .lbl{font-size:12.5px; color:var(--muted); letter-spacing:.04em}
.card.good .num{color:var(--good)} .card.warn .num{color:var(--warn)} .card.crit .num{color:var(--crit)} .card.info .num{color:var(--info)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden}
.panel>.hd{display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--line); background:var(--surface2); flex-wrap:wrap}
.panel>.hd h2{font-size:17px}
.panel>.hd .spacer{flex:1}
.panel>.bd{padding:14px 16px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px}
th{font-size:12.5px; color:var(--muted); text-align:right; font-weight:500; letter-spacing:.03em}
th,td{padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td.wrap{white-space:normal; min-width:140px}

/* ---------- chips / pills ---------- */
.pill{display:inline-block; padding:1px 9px; border-radius:999px; font-size:12.5px; font-weight:500}
.p-good{background:var(--good-soft); color:var(--good)}
.p-warn{background:var(--warn-soft); color:var(--warn)}
.p-crit{background:var(--crit-soft); color:var(--crit)}
.p-info{background:var(--info-soft); color:var(--info)}
.p-mut{background:var(--surface2); color:var(--muted)}

/* ---------- buttons ---------- */
.btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:7px; padding:8px 14px; font-weight:500}
.btn.sec{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:var(--crit); color:#fff}
.btn.sm{padding:3px 9px; font-size:12.5px; border-radius:6px}
.btn:hover{filter:brightness(1.06)}

/* ---------- filter bar ---------- */
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.filters select,.filters input{width:auto; min-width:120px}
.filters input[type=search]{min-width:170px}

/* ---------- alerts list ---------- */
ul.alerts{list-style:none; margin:0; padding:0}
ul.alerts li{display:flex; gap:10px; align-items:baseline; padding:7px 4px; border-bottom:1px dashed var(--line)}
ul.alerts li:last-child{border-bottom:none}
ul.alerts .dot{width:9px; height:9px; border-radius:50%; flex:none; align-self:center}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)}
.empty{color:var(--muted); font-size:14px; padding:14px 4px; text-align:center}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,24,16,.55); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:12px; width:100%; max-width:640px; box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .hd{display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line)}
.modal .hd h3{font-size:18px; flex:1}
.modal .bd{padding:16px 18px; display:grid; grid-template-columns:1fr 1fr; gap:12px}
.modal .bd .full{grid-column:1/-1}
.modal .ft{display:flex; gap:10px; justify-content:flex-start; padding:14px 18px; border-top:1px solid var(--line)}
.x{background:none; border:none; font-size:20px; color:var(--muted); line-height:1}

/* ---------- weekly board ---------- */
.week{display:grid; grid-template-columns:repeat(6,1fr); gap:10px}
@media(max-width:980px){.week{grid-template-columns:repeat(2,1fr)}}
.day{background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:9px; min-height:130px}
.day h4{margin:0 0 8px; font-size:13.5px; color:var(--muted); font-weight:500; text-align:center}
.mnt{background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:6px 8px; margin-bottom:6px; font-size:13px}
.mnt .t{font-weight:500}
.mnt.done{border-inline-start:3px solid var(--good)}
.mnt.todo{border-inline-start:3px solid var(--warn)}
.mnt .row{display:flex; gap:6px; align-items:center; justify-content:space-between; margin-top:3px}

/* ---------- dohh 1 form ---------- */
.checkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px}
.chk{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13.5px}
.chk .opts{display:flex; gap:4px}
.chk .opts button{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:2px 9px; font-size:12.5px; color:var(--muted)}
.chk .opts button.ok{background:var(--good); border-color:var(--good); color:#fff}
.chk .opts button.bad{background:var(--crit); border-color:var(--crit); color:#fff}

/* ---------- military license plate ---------- */
.plate{
  display:inline-flex; align-items:center; gap:7px; direction:rtl;
  background:linear-gradient(180deg,#1E1E1E,#0C0C0C); color:#F5F5F0;
  border:1px solid #000; border-radius:5px; padding:2px 9px 2.5px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.35);
  font-weight:700; font-size:13px; line-height:1.4; letter-spacing:.06em;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.plate::before,.plate::after{content:''; width:3.5px; height:3.5px; border-radius:50%;
  background:rgba(255,255,255,.35); flex:none}
.plate .num{direction:ltr; unicode-bidi:isolate}
.plate.lg{font-size:16.5px; padding:3.5px 12px 4px; border-radius:6px; gap:9px}
.plate.lg::before,.plate.lg::after{width:4.5px; height:4.5px}

/* ---------- vehicle cards ---------- */
.vcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:14px}
.vcard{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden; position:relative;
  transition:transform .16s ease, box-shadow .16s ease;
}
.vcard:hover{transform:translateY(-3px); box-shadow:var(--card-hover)}
.vcard::before{content:''; position:absolute; inset-inline:0; top:0; height:4px; background:var(--stat,var(--good))}
.vcard.st-warn{--stat:var(--warn)} .vcard.st-crit{--stat:var(--crit)}
.vcard .art{
  padding:16px 14px 6px; display:flex; justify-content:center;
  background:
    radial-gradient(120% 90% at 50% 100%, var(--surface2) 0%, transparent 62%),
    linear-gradient(180deg, transparent, rgba(0,0,0,.02));
}
.vcard .art svg{width:100%; max-width:196px; height:auto; display:block}
.vcard .plate-row{display:flex; justify-content:center; margin-top:-2px}
.vcard .info{padding:9px 13px 12px; text-align:center}
.vcard .ttl{font-weight:700; font-size:14.5px; margin-top:7px}
.vcard .meta{font-size:12.5px; color:var(--muted); margin-top:1px}
.vcard .pills{display:flex; justify-content:center; gap:5px; flex-wrap:wrap; margin-top:7px}
.vcard .stats{
  display:flex; justify-content:center; gap:14px; margin-top:9px;
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.vcard .stats b{display:block; font-size:13.5px; color:var(--ink); font-weight:600}
.vcard .acts{display:flex; gap:6px; justify-content:center; margin-top:10px}
.viewtog{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.viewtog button{border:none; background:var(--surface); color:var(--muted); padding:6px 12px; font-size:13px}
.viewtog button.on{background:var(--accent); color:var(--accent-ink)}

/* ---------- calendar ---------- */
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.cald{min-width:0}
.calh{font-size:12px; color:var(--muted); text-align:center; padding:2px 0}
.cald{background:var(--surface2); border:1px solid var(--line); border-radius:8px; min-height:96px; padding:5px 6px; cursor:pointer; transition:box-shadow .12s}
.cald:hover{box-shadow:var(--shadow)}
.cald.out{opacity:.4}
.cald.today{outline:2px solid var(--accent); outline-offset:-1px; background:var(--surface)}
.cald .dn{font-size:12px; color:var(--muted); font-weight:600}
.cev{display:block; font-size:10.8px; line-height:1.4; border-radius:4px; padding:1px 5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cev.info{background:var(--info-soft); color:var(--info)}
.cev.warn{background:var(--warn-soft); color:var(--warn)}
.cev.crit{background:var(--crit-soft); color:var(--crit)}
.cev.mut{background:var(--accent-soft); color:var(--accent)}
.cev.fore{background:transparent; border:1px dashed var(--warn); color:var(--warn)}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); align-items:center}
.legend .cev{display:inline-block; margin:0}

.small{font-size:12.5px; color:var(--muted)}
.sec-title{font-size:15px; margin:14px 0 6px; color:var(--muted); font-family:'Heebo'; font-weight:700}
.due-neg{color:var(--crit); font-weight:700}
.due-soon{color:var(--warn); font-weight:700}

/* ---------- mobile ---------- */
@media(max-width:640px){
  header.app{padding:10px 12px 0}
  header.app h1{font-size:20px}
  header.app h1 .emblem{width:26px;height:26px;border-radius:6px}
  header.app h1 .emblem svg{width:15px;height:15px}
  header.app .sub{font-size:11.5px}
  nav.tabs{gap:5px;margin-top:10px;padding-bottom:10px}
  nav.tabs button{padding:5px 10px;font-size:12.5px;border-radius:7px}
  main{padding:12px 10px 40px}
  .cards{grid-template-columns:repeat(3,1fr);gap:8px}
  .card{padding:9px 11px}
  .card .num{font-size:23px}
  .card .lbl{font-size:11px}
  .panel>.hd{padding:9px 12px}
  .panel>.bd{padding:10px 10px}
  .modal .bd{grid-template-columns:1fr}
  .overlay{padding:14px 8px}
  .filters select,.filters input{min-width:0;flex:1}
  .filters input[type=search]{min-width:130px}
  .cal{min-width:660px}
  .week{grid-template-columns:1fr}
  .day{min-height:auto}
  .vcards{grid-template-columns:1fr 1fr;gap:10px}
  .vcard .art svg{max-width:150px}
  .checkgrid{grid-template-columns:1fr}
  th,td{padding:6px 7px;font-size:13px}
}
@media(max-width:430px){
  .vcards{grid-template-columns:1fr}
}

@media print{
  header.app, .filters, .btn, .noprint{display:none !important}
  body{background:#fff; color:#000}
  .panel{box-shadow:none; border-color:#999; break-inside:avoid}
  main{max-width:none; padding:0}
}
</style>

<header class="app">
  <div class="top">
    <h1><span class="emblem"><svg viewBox="0 0 24 24"><path d="M12 1.8 14.7 8l6.7.6-5 4.4 1.5 6.6L12 16l-5.9 3.6 1.5-6.6-5-4.4L9.3 8Z"/></svg></span>מצבת רכב גדודית</h1>
    <span class="sub">מערכת קצין רכב · גדוד מילואים · 3 פלוגות לוחמות + פלוגת מפקדה</span>
    <span class="spacer"></span>
    <span class="sub" id="todayLbl"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
'use strict';
/* ============================ data model ============================ */
const LS_KEY='fleet_mgmt_v1';
const COMPANIES=['פלוגה א','פלוגה ב','פלוגה ג','פלוגת מפקדה'];
const VTYPES=['האמר','היילקס','רכב סיור','רכב מנהלה','משאית משא','משאית תדלוק','אמבולנס','מיניבוס','רכב חילוץ','נגרר'];
const PERMITS=['האמר','היילקס','רכב סיור','רכב מנהלה','משאית משא','משאית תדלוק','אמבולנס','מיניבוס','רכב חילוץ','גרירת נגרר'];
const STATUSES=['כשיר','בטיפול','מושבת'];
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
const TRAINING_TYPES=['יום בטיחות שנתי','יום עיון נהגים','רענון נהגים','מבדק נהיגה'];
const SAFETY_VALID_DAYS=365;
const PRESENCE_STATUSES=['ביחידה','משימה מחוץ ליחידה','חופשה / בבית','גימלים','קורס / הדרכה','נפקד'];
const PRESENT_SET=new Set(['ביחידה','משימה מחוץ ליחידה']);
const EQUIP_ITEMS=['מגבה + מפתח גלגלים','גלגל רזרבי','מטפה כיבוי','משולש אזהרה','ערכת עזרה ראשונה','כבל גרירה / שרשרת','כבלי התנעה','אפוד זוהר','תיק רכב (רישיונות)','פנס עבודה','ג\'ריקן מים','טריז עצירה'];
const FUEL_SOURCES=['משאית תדלוק גזרתית','תחנת דלק (דלקן)','בסיס אם'];
const CHECK_ITEMS=['מים / מצנן','שמן מנוע','דלק (מעל 3/4)','צמיגים + לחץ אוויר','גלגל רזרבי + מגבה','בלמים','בלם חניה','אורות ופנסים','מגבים ומתזים','מראות','חגורות בטיחות','מטפה כיבוי תקף','משולש אזהרה','דליפות (שמן/דלק/מים)','מצבר וחיבורים','היגוי','צופר','ניקיון ומטען מאובטח'];

function todayStr(){return new Date().toISOString().slice(0,10);}
function addDays(dstr,n){const d=new Date(dstr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysUntil(dstr){if(!dstr)return null;const a=new Date(todayStr()+'T12:00:00'),b=new Date(dstr+'T12:00:00');return Math.round((b-a)/86400000);}
function fmtDate(dstr){if(!dstr)return '—';const[y,m,d]=dstr.split('-');return d+'.'+m+'.'+y.slice(2);}
function weekStart(dstr){const d=new Date(dstr+'T12:00:00');d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}
function plate(tz,lg){return `<span class="plate${lg?' lg':''}"><span>צ</span><span class="num">${esc(tz)}</span></span>`;}
function vehSVG(type){
  const W=x=>`<circle cx="${x}" cy="83" r="12" fill="var(--veh-tire)"/><circle cx="${x}" cy="83" r="5.5" fill="var(--veh-rim)"/>`;

let S;
function load(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw){S=JSON.parse(raw);migrate(S);return;}}catch(e){}
  S=seed(); save();
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
function migrate(d){
  if(!d.trainings)d.trainings=[];
  if(!d.reports)d.reports=[];
  if(!d.faults)d.faults=[];
  if(!d.presence)d.presence={};
  if(!d.trips)d.trips=[];
  if(!d.fuels)d.fuels=[];
  if(!d.accidents)d.accidents=[];
  if(!d.serviceLog)d.serviceLog=[];
  if(!d.standby)d.standby=[];
  if(!d.docs)d.docs=[];
  d.drivers.forEach(x=>{if(!('safetyDay' in x))x.safetyDay='';});
  d.vehicles.forEach(v=>{if(!v.missingEquip)v.missingEquip=[];if(!('keyLocation' in v))v.keyLocation='לוח מפתחות';});
}

/* ============================ derived ============================ */
const vById=id=>S.vehicles.find(v=>v.id===id);
const dById=id=>S.drivers.find(d=>d.id===id);
function kmToService(v){return v.lastServiceKm+v.serviceIntervalKm-v.km;}
function safetyDaysLeft(d){if(!d.safetyDay)return null;return SAFETY_VALID_DAYS+daysUntil(d.safetyDay);}
function safetyCell(d){
  const left=safetyDaysLeft(d);
  if(left===null)return '<span class="pill p-crit">לא עבר</span>';
  if(left<0)return `<span class="pill p-crit">חורג ${-left} ימים</span>`;
  if(left<=30)return `<span class="pill p-warn">${fmtDate(d.safetyDay)} · נותרו ${left} ימים</span>`;
  return `<span class="pill p-good">${fmtDate(d.safetyDay)}</span>`;
}
function openFaults(vid){return S.faults.filter(f=>f.vehicleId===vid&&f.status==='פתוחה');}

function licenseAlerts(){
  const out=[];
  for(const v of S.vehicles){
    const dt=daysUntil(v.testDate);
    if(dt!==null&&dt<0)out.push({sev:'crit',txt:`טסט פג תוקף — ${v.type} צ׳ ${v.tz} (לפני ${-dt} ימים)`,tab:'vehicles'});
    else if(dt!==null&&dt<=30)out.push({sev:'warn',txt:`טסט מתקרב — ${v.type} צ׳ ${v.tz} בעוד ${dt} ימים`,tab:'vehicles'});
    const di=daysUntil(v.insuranceDate);
    if(di!==null&&di<0)out.push({sev:'crit',txt:`ביטוח/רישוי פג — ${v.type} צ׳ ${v.tz}`,tab:'vehicles'});
    else if(di!==null&&di<=30)out.push({sev:'warn',txt:`ביטוח/רישוי מתקרב — ${v.type} צ׳ ${v.tz} בעוד ${di} ימים`,tab:'vehicles'});
  }
  for(const d of S.drivers){
    const c=daysUntil(d.civilExpiry);
    if(c!==null&&c<0)out.push({sev:'crit',txt:`רישיון אזרחי פג — ${d.name} (${d.company})`,tab:'drivers'});
    else if(c!==null&&c<=30)out.push({sev:'warn',txt:`רישיון אזרחי של ${d.name} פג בעוד ${c} ימים`,tab:'drivers'});
    const m=daysUntil(d.militaryExpiry);
    if(m!==null&&m<0)out.push({sev:'crit',txt:`רישיון צבאי פג — ${d.name} (${d.company})`,tab:'drivers'});
    else if(m!==null&&m<=30)out.push({sev:'warn',txt:`רישיון צבאי של ${d.name} פג בעוד ${m} ימים`,tab:'drivers'});
    const sl=safetyDaysLeft(d);
    if(sl===null)out.push({sev:'crit',txt:`יום בטיחות שנתי — ${d.name} (${d.company}) לא עבר כלל`,tab:'training'});
    else if(sl<0)out.push({sev:'crit',txt:`יום בטיחות שנתי של ${d.name} חורג ב-${-sl} ימים`,tab:'training'});
    else if(sl<=30)out.push({sev:'warn',txt:`יום בטיחות שנתי של ${d.name} פג בעוד ${sl} ימים`,tab:'training'});
  }
  return out;
}
function serviceAlerts(){
  const out=[];
  for(const v of S.vehicles){
    if(v.category==='trailer')continue;
    const left=kmToService(v);
    if(left<=0)out.push({sev:'crit',txt:`טיפול חורג — ${v.type} צ׳ ${v.tz} (חריגה של ${(-left).toLocaleString()} ק"מ)`,tab:'maintenance'});
    else if(left<=500)out.push({sev:'warn',txt:`טיפול מתקרב — ${v.type} צ׳ ${v.tz} בעוד ${left.toLocaleString()} ק"מ`,tab:'maintenance'});
  }
  return out;
}
function vcheckMissingToday(){
  const t=todayStr();
  const usedToday=new Set();
  for(const m of S.missions)if(m.date===t)for(const a of m.assignments)usedToday.add(a.vehicleId);
  const reported=new Set(S.reports.filter(r=>r.date===t).map(r=>r.vehicleId));
  return [...usedToday].filter(vid=>!reported.has(vid)).map(vById).filter(Boolean);
}
function presenceOf(date,did){return (S.presence[date]||{})[did]||null;}
function presenceSummary(date){
  const day=S.presence[date]||{};
  const counts={};PRESENCE_STATUSES.forEach(s=>counts[s]=0);
  let marked=0;
  for(const d of S.drivers){const st=day[d.id];if(st){marked++;if(counts[st]!==undefined)counts[st]++;}}
  return {counts,marked,total:S.drivers.length};
}
function driverScore(d){
  let s=100;
  s-=15*S.accidents.filter(a=>a.driverId===d.id).length;
  const ce=daysUntil(d.civilExpiry),me=daysUntil(d.militaryExpiry),sl=safetyDaysLeft(d);
  if(ce!==null&&ce<0)s-=10;
  if(me!==null&&me<0)s-=10;
  if(sl===null||sl<0)s-=10;
  return Math.max(0,s);
}
function scorePill(n){
  const c=n>=90?'p-good':(n>=70?'p-warn':'p-crit');
  return `<span class="pill ${c}">${n}</span>`;
}

/* ============================ missions ============================ */
function missionConflicts(m,skipId){
  const issues=[];
  for(const a of m.assignments){
    const v=vById(a.vehicleId),d=dById(a.driverId);
    if(v&&v.status!=='כשיר')issues.push(`${v.type} צ׳ ${v.tz} במצב "${v.status}"`);
    if(v){
      const clash=S.missions.find(o=>o.id!==skipId&&o.date===m.date&&o.assignments.some(x=>x.vehicleId===v.id));
      if(clash)issues.push(`${v.type} צ׳ ${v.tz} כבר משובץ ל"${clash.name}" באותו יום`);
    }
    if(d){
      const clash=S.missions.find(o=>o.id!==skipId&&o.date===m.date&&o.assignments.some(x=>x.driverId===d.id));
      if(clash)issues.push(`${d.name} כבר משובץ ל"${clash.name}" באותו יום`);
      const ce=daysUntil(d.civilExpiry),me=daysUntil(d.militaryExpiry);
      if(ce!==null&&ce<0)issues.push(`רישיון אזרחי של ${d.name} פג תוקף`);
      if(me!==null&&me<0)issues.push(`רישיון צבאי של ${d.name} פג תוקף`);
      const sl=safetyDaysLeft(d);
      if(sl===null||sl<0)issues.push(`${d.name} ללא יום בטיחות שנתי בתוקף`);
      const pr=presenceOf(m.date,d.id);
      if(pr&&!PRESENT_SET.has(pr))issues.push(`${d.name} מסומן בדוח 1 כ"${pr}"`);
      if(v&&!d.permits.includes(v.permit))issues.push(`${d.name} ללא היתר ל${v.permit}`);
    }
  }
  return issues;
}

/* ============================ calendar with forecast ============================ */
const AVG_KM_PER_DAY=35;
let calMonth=todayStr().slice(0,7);
const HEB_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function calEvents(){
  const ev={};
  const add=(date,txt,cls)=>{if(!date)return;(ev[date]=ev[date]||[]).push({txt,cls});};
  S.missions.forEach(m=>{if(m.status!=='בוטלה')add(m.date,'משימה: '+m.name,'info');});
  S.trainings.filter(e=>!e.done).forEach(e=>add(e.date,e.type,'mut'));
  S.maintenance.filter(e=>!e.done).forEach(e=>{const v=vById(e.vehicleId);add(addDays(e.week,e.day),'טיפול: '+(v?v.type+' צ׳ '+v.tz:''),'warn');});
  S.vehicles.forEach(v=>{
    add(v.testDate,'טסט פג: '+v.type+' צ׳ '+v.tz,'crit');
    add(v.insuranceDate,'ביטוח פג: צ׳ '+v.tz,'crit');
    if(v.category==='vehicle'){
      const left=kmToService(v);
      if(left>0&&left<=AVG_KM_PER_DAY*120)add(addDays(todayStr(),Math.round(left/AVG_KM_PER_DAY)),'צפי טיפול: '+v.type+' צ׳ '+v.tz,'fore');
    }
  });
  S.drivers.forEach(d=>{
    add(d.civilExpiry,'רישיון אזרחי פג: '+d.name,'crit');
    add(d.militaryExpiry,'רישיון צבאי פג: '+d.name,'crit');
    if(d.safetyDay)add(addDays(d.safetyDay,SAFETY_VALID_DAYS),'יום בטיחות פג: '+d.name,'warn');
  });
  return ev;
}
function rCalendar(){
  const [yy,mm]=calMonth.split('-').map(Number);
  const first=calMonth+'-01';
  const firstDow=new Date(first+'T12:00:00').getDay();
  const start=addDays(first,-firstDow);
  const ev=calEvents();
  const t=todayStr();
  let cells='';
  for(let i=0;i<42;i++){
    const date=addDays(start,i);
    const inMonth=date.slice(0,7)===calMonth;
    const items=(ev[date]||[]);
    const shown=items.slice(0,4);
    cells+=`<div class="cald ${inMonth?'':'out'} ${date===t?'today':''}" onclick="dayModal('${date}')">
      <div class="dn">${+date.slice(8)}</div>
      ${shown.map(e=>`<span class="cev ${e.cls}">${esc(e.txt)}</span>`).join('')}
      ${items.length>4?`<span class="cev mut">+ עוד ${items.length-4}</span>`:''}
    </div>`;
  }
  return `<div class="panel"><div class="hd">
    <h2>לוח שנה גדודי — ${HEB_MONTHS[mm-1]} ${yy}</h2><span class="spacer"></span>
    <div class="filters noprint">
      <button class="btn sec sm" onclick="calShift(-1)">◀ חודש קודם</button>
      <button class="btn sec sm" onclick="calMonth=todayStr().slice(0,7);render()">החודש</button>
      <button class="btn sec sm" onclick="calShift(1)">חודש הבא ▶</button>
      <button class="btn sec sm" onclick="window.print()">הדפסה</button>
    </div>
  </div><div class="bd">
    <div class="legend" style="margin-bottom:10px">
      <span class="cev info">משימה</span><span class="cev mut">הדרכה</span>
      <span class="cev warn">טיפול / פקיעה מתקרבת</span><span class="cev crit">פקיעת רישוי</span>
      <span class="cev fore">צפי טיפול (תחזית לפי ~${AVG_KM_PER_DAY} ק"מ ליום)</span>
    </div>
    <div class="tblwrap"><div class="cal">${DAYS.concat(['שבת']).map(d=>`<div class="calh">${d}</div>`).join('')}${cells}</div></div>
    <div class="small" style="margin-top:10px">לחיצה על יום פותחת את הפירוט המלא. התחזית מחושבת מיתרת הק"מ לטיפול חלקי קצב נסועה ממוצע — ככל שמזינים ק"מ עדכני (בתדלוק, בנסיעות ובבדיקות), הצפי מתייחד ומתדייק.</div>
  </div></div>`;
}
function calShift(n){
  let [y,m]=calMonth.split('-').map(Number);
  m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  calMonth=y+'-'+String(m).padStart(2,'0');
  render();
}
function dayModal(date){
  const items=calEvents()[date]||[];
  openModal(`
    <div class="hd"><h3>${DAYS.concat(['שבת'])[new Date(date+'T12:00:00').getDay()]} · ${fmtDate(date)}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd"><div class="full">
      ${items.length?items.map(e=>`<div style="padding:5px 0;border-bottom:1px dashed var(--line)"><span class="cev ${e.cls}" style="display:inline">${esc(e.txt)}</span></div>`).join(''):'<div class="empty">אין אירועים ביום זה</div>'}
    </div></div>
    <div class="ft"><button class="btn sec" onclick="closeModal()">סגירה</button></div>`);
}

/* ============================ weekly maintenance ============================ */
function rMnt(){
  const entries=S.maintenance.filter(e=>e.week===mntWeek);
  const dueList=S.vehicles.filter(v=>v.category==='vehicle'&&kmToService(v)<=500&&!entries.some(e=>e.vehicleId===v.id));
  const unscheduled=S.vehicles.filter(v=>!entries.some(e=>e.vehicleId===v.id));
  const days=DAYS.map((dn,di)=>{
    const dayDate=addDays(mntWeek,di);
    const items=entries.filter(e=>e.day===di).map(e=>{
      const v=vById(e.vehicleId); if(!v)return '';
      return `<div class="mnt ${e.done?'done':'todo'}">
        <div class="t">${v.type} צ׳ ${v.tz}</div>
        <div class="small">${esc(v.company)}${e.notes?' · '+esc(e.notes):''}</div>
        <div class="row noprint">
          ${e.done?`<span class="pill p-good">בוצע ${fmtDate(e.doneDate)}</span>`:`<button class="btn sm" onclick="mntDone('${e.id}')">סמן בוצע</button>`}
          <button class="btn sm sec" onclick="mntDel('${e.id}')">✕</button>
        </div>
      </div>`;}).join('');
    return `<div class="day"><h4>${dn} · ${fmtDate(dayDate)}</h4>${items}
      <select class="noprint" style="font-size:12.5px" onchange="mntAdd(this.value,${di});this.value=''">
        <option value="">+ שבץ רכב…</option>
        ${S.vehicles.filter(v=>!entries.some(e=>e.vehicleId===v.id)).map(v=>`<option value="${v.id}">${v.type} צ׳ ${v.tz}${v.category==='vehicle'&&kmToService(v)<=500?' ⚠':''}</option>`).join('')}
      </select></div>`;
  }).join('');
  return `<div class="panel"><div class="hd">
    <h2>תכנון טיפול שבועי</h2>
    <span class="small">שבוע ${fmtDate(mntWeek)} – ${fmtDate(addDays(mntWeek,5))}</span>
    ${unscheduled.length?`<span class="pill p-warn">${unscheduled.length} כלים ללא שיבוץ השבוע</span>`:'<span class="pill p-good">כל הכלים משובצים ✓</span>'}
    <span class="spacer"></span>
    <div class="filters noprint">
      <button class="btn sec sm" onclick="mntWeek=addDays(mntWeek,-7);render()">◀ שבוע קודם</button>
      <button class="btn sec sm" onclick="mntWeek=weekStart(todayStr());render()">השבוע</button>
      <button class="btn sec sm" onclick="mntWeek=addDays(mntWeek,7);render()">שבוע הבא ▶</button>
      <button class="btn sm" onclick="mntAuto()">שיבוץ שבועי מלא — כל הכלים</button>
      <button class="btn sec sm" onclick="window.print()">הדפסה</button>
    </div>
  </div><div class="bd">
    <div class="week">${days}</div>
    ${dueList.length?`<div class="sec-title">בדחיפות — הגיעו לחלון טיפול ק"מ (${dueList.length})</div>
      <div class="small">${dueList.map(v=>`${v.type} צ׳ ${v.tz} (${kmToService(v)<=0?'חריגה '+(-kmToService(v)).toLocaleString():'עוד '+kmToService(v).toLocaleString()} ק"מ)`).join(' · ')}</div>`:''}
    <div class="small" style="margin-top:12px"><b>על פי הפקודות, טיפול שבועי מחייב כל כלי רכב — גם רכב שעמד ולא נסע</b> (עמידה שוחקת: מצבר, לחץ צמיגים, נוזלים, גומיות). הטיפול כולל: בדיקת נוזלים, לחץ אוויר וסוליות צמיגים, אורות, הנעה והרצת מנוע לרכבים עומדים, שטיפה ובדיקת ציוד חובה. נגררים — וו גרירה, תאורה וצמיגים. כפתור השיבוץ המלא מפזר את כל כלי הגדוד על פני השבוע, כשהדחופים לפי ק"מ משובצים ראשונים.</div>
  </div></div>`;
}
function mntAdd(vid,day){if(!vid)return;S.maintenance.push({id:uid('mt'),vehicleId:vid,week:mntWeek,day,done:false,notes:''});save();render();}
function mntDone(id){const e=S.maintenance.find(x=>x.id===id);e.done=true;e.doneDate=todayStr();
  const v=vById(e.vehicleId);
  let type='טיפול שבועי';
  if(v&&v.category==='vehicle'&&kmToService(v)<=500){v.lastServiceKm=v.km;if(v.status==='בטיפול')v.status='כשיר';type='טיפול ק"מ';}
  if(v)S.serviceLog.push({id:uid('sl'),vehicleId:v.id,date:todayStr(),km:v.km,type,notes:e.notes||''});
  save();render();}
function mntDel(id){S.maintenance=S.maintenance.filter(x=>x.id!==id);save();render();}
function mntAuto(){
  const entries=S.maintenance.filter(e=>e.week===mntWeek);
  const todo=S.vehicles.filter(v=>!entries.some(e=>e.vehicleId===v.id))
    .sort((a,b)=>{
      const ka=a.category==='vehicle'?kmToService(a):Infinity;
      const kb=b.category==='vehicle'?kmToService(b):Infinity;
      return ka-kb;
    });
  if(!todo.length)return;
  const cap=Math.ceil((entries.length+todo.length)/6);
  const perDay={};entries.forEach(e=>perDay[e.day]=(perDay[e.day]||0)+1);
  let day=0;
  for(const v of todo){
    while((perDay[day]||0)>=cap&&day<5)day++;
    const kmDue=v.category==='vehicle'&&kmToService(v)<=500;
    S.maintenance.push({id:uid('mt'),vehicleId:v.id,week:mntWeek,day,done:false,notes:kmDue?'דחוף — טיפול ק"מ':''});
    perDay[day]=(perDay[day]||0)+1;
  }
  save();render();
}

function waReminder(d){
  const items=[];
  const ce=daysUntil(d.civilExpiry),me=daysUntil(d.militaryExpiry),sl=safetyDaysLeft(d);
  if(ce!==null&&ce<=30)items.push('רישיון נהיגה אזרחי ('+(ce<0?'פג תוקף':'פג בעוד '+ce+' ימים')+')');
  if(me!==null&&me<=30)items.push('רישיון צבאי ('+(me<0?'פג תוקף':'פג בעוד '+me+' ימים')+')');
  if(sl===null||sl<0)items.push('יום בטיחות שנתי (נדרש חידוש)');
  if(!items.length)return '';
  const phone='972'+String(d.phone||'').replace(/\D/g,'').replace(/^0/,'');
  const msg=encodeURIComponent('שלום '+d.name+', כאן קצין הרכב הגדודי. תזכורת לחידוש: '+items.join(', ')+'. נא לטפל ולעדכן אותי. תודה!');
  return `<a class="btn sm sec noprint" style="text-decoration:none" href="https://wa.me/${phone}?text=${msg}" target="_blank" rel="noopener">📱 תזכורת</a>`;
}

  S.missions.forEach(m=>m.assignments.forEach(a=>{if(a.driverId===id)a.driverId='';}));
  save();closeModal();render();
}

/* ============================ training & safety ============================ */
function rTraining(){
  const upcoming=S.trainings.filter(e=>!e.done).sort((a,b)=>a.date<b.date?-1:1);
  const past=S.trainings.filter(e=>e.done).sort((a,b)=>a.date<b.date?1:-1).slice(0,10);
  const evRow=e=>`<tr>
    <td>${fmtDate(e.date)}</td><td><b>${esc(e.type)}</b></td>
    <td class="wrap" style="max-width:260px">${esc(e.notes||'')}</td>
    <td class="wrap" style="max-width:280px">${e.attendees.length?e.attendees.map(id=>{const d=dById(id);return d?`<span class="pill p-mut" style="margin:1px">${esc(d.name)}</span>`:'';}).join(' '):'<span class="small">טרם שובצו</span>'}</td>
    <td class="noprint">${e.done?'<span class="pill p-good">בוצע</span>':`
      <button class="btn sm sec" onclick="editTraining('${e.id}')">עריכה</button>
      <button class="btn sm" onclick="doneTraining('${e.id}')">בוצע ✓</button>`}</td>
  </tr>`;

  </div><div class="bd tblwrap">
    <table><thead><tr><th>תאריך</th><th>סוג</th><th>הערות</th><th>משתתפים</th><th class="noprint"></th></tr></thead>
    <tbody>${upcoming.map(evRow).join('')||'<tr><td colspan="5" class="empty">אין אירועי הדרכה מתוכננים</td></tr>'}</tbody></table>
    ${past.length?`<div class="sec-title">אירועים שבוצעו</div><div class="tblwrap"><table><tbody>${past.map(evRow).join('')}</tbody></table></div>`:''}
    <div class="small" style="margin-top:8px">סימון אירוע מסוג "יום בטיחות שנתי" או "רענון נהגים" כבוצע — מעדכן אוטומטית את תוקף יום הבטיחות לכל המשתתפים.</div>
  </div></div>
  <div class="panel"><div class="hd"><h2>מעקב יום בטיחות שנתי לפי נהג</h2>
    ${overdue.length?`<span class="pill p-crit">${overdue.length} נהגים ללא תוקף</span>`:'<span class="pill p-good">כל הנהגים בתוקף</span>'}
    <span class="spacer"></span>
    ${overdue.length?`<button class="btn sm noprint" onclick="scheduleOverdue()">שבץ חורגים ליום בטיחות</button>`:''}
  </div><div class="bd tblwrap">
    <table><thead><tr><th>נהג</th><th>פלוגה</th><th>יום בטיחות אחרון (תוקף ${SAFETY_VALID_DAYS} ימים)</th><th class="noprint"></th></tr></thead>

  </div></div>`;
}
let trDraft=null;
function editTraining(id){
  const e=id?S.trainings.find(x=>x.id===id):{id:'',type:TRAINING_TYPES[0],date:todayStr(),notes:'',attendees:[],done:false};
  trDraft=JSON.parse(JSON.stringify(e));trDraft._editId=id;
  renderTrainingModal();
}
function renderTrainingModal(){
  const e=trDraft,id=e._editId;
  openModal(`
    <div class="hd"><h3>${id?'עריכת אירוע הדרכה':'אירוע הדרכה חדש'}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div><label>סוג</label><select onchange="trDraft.type=this.value">${TRAINING_TYPES.map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>תאריך</label><input type="date" value="${e.date}" onchange="trDraft.date=this.value"></div>
      <div class="full"><label>הערות (מיקום, נושאים)</label><input value="${esc(e.notes)}" oninput="trDraft.notes=this.value"></div>
      <div class="full"><label>משתתפים</label>
        <div class="checkgrid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
          ${S.drivers.map(d=>{const l=safetyDaysLeft(d),od=l===null||l<0;
            return `<label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)">
            <input type="checkbox" style="width:auto" ${e.attendees.includes(d.id)?'checked':''}
              onchange="if(this.checked)trDraft.attendees.push('${d.id}');else trDraft.attendees=trDraft.attendees.filter(x=>x!=='${d.id}')">
            ${esc(d.name)}${od?' <span class="pill p-crit" style="font-size:10.5px">חורג</span>':''}</label>`;}).join('')}
        </div></div>
    </div>
    <div class="ft">
      <button class="btn" onclick="saveTraining()">שמירה</button>
      <button class="btn sec" onclick="closeModal()">ביטול</button>
      ${id?`<span style="flex:1"></span><button class="btn danger" onclick="delTraining('${id}')">מחיקה</button>`:''}
    </div>`);
}
function saveTraining(){
  const e=trDraft;const id=e._editId;delete e._editId;
  if(id){const i=S.trainings.findIndex(x=>x.id===id);S.trainings[i]=Object.assign({id},e);}
  else S.trainings.push(Object.assign({},e,{id:uid('tr')}));
  trDraft=null;save();closeModal();render();
}
function delTraining(id){
  if(!confirm('למחוק את האירוע?'))return;
  S.trainings=S.trainings.filter(x=>x.id!==id);
  trDraft=null;save();closeModal();render();
}
function doneTraining(id){
  const e=S.trainings.find(x=>x.id===id);
  e.done=true;
  if(e.type==='יום בטיחות שנתי'||e.type==='רענון נהגים'){
    e.attendees.forEach(did=>{const d=dById(did);if(d)d.safetyDay=e.date;});
  }
  save();render();
}
function markSafety(did){
  const d=dById(did);
  if(!confirm('לעדכן ש'+d.name+' עבר יום בטיחות היום?'))return;
  d.safetyDay=todayStr();save();render();
}
function scheduleOverdue(){
  const overdue=S.drivers.filter(d=>{const l=safetyDaysLeft(d);return l===null||l<0;}).map(d=>d.id);
  let ev=S.trainings.find(e=>!e.done&&e.type==='יום בטיחות שנתי');
  if(!ev){ev={id:uid('tr'),type:'יום בטיחות שנתי',date:addDays(todayStr(),14),notes:'שיבוץ אוטומטי — נהגים חורגים',attendees:[],done:false};S.trainings.push(ev);}
  ev.attendees=[...new Set([...ev.attendees,...overdue])];
  save();render();
  alert('שובצו '+overdue.length+' נהגים לאירוע "'+ev.type+'" בתאריך '+fmtDate(ev.date));
}

/* ============================ doch 1 — presence ============================ */
let presDate=todayStr();
function rPresence(){
  const day=S.presence[presDate]||{};
  const ps=presenceSummary(presDate);
  const groups=COMPANIES.map(c=>{
    const ds=S.drivers.filter(d=>d.company===c);
    if(!ds.length)return '';
    const rows=ds.map(d=>{
      const st=day[d.id]||null;
      return `<tr>
        <td><b>${esc(d.name)}</b><div class="small">${esc(d.personal)}</div></td>
        <td class="wrap">${PRESENCE_STATUSES.map(s=>`<button class="btn sm ${st===s?'':'sec'}" style="margin:1px ${st===s&&s==='נפקד'?';background:var(--crit)':''}" onclick="setPresence('${d.id}','${s}')">${s}</button>`).join('')}</td>
        <td>${st?`<span class="pill ${PRESENT_SET.has(st)?'p-good':(st==='נפקד'?'p-crit':'p-mut')}">${st}</span>`:'<span class="pill p-warn">טרם דווח</span>'}</td>
      </tr>`;}).join('');
    return `<div class="sec-title">${c} (${ds.filter(d=>day[d.id]).length}/${ds.length} דווחו)</div>
      <div class="tblwrap"><table><thead><tr><th>נהג</th><th class="noprint">סימון מצבה</th><th>מצב</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  return `<div class="panel"><div class="hd">
    <h2>דוח 1 — מצבת נוכחות נהגים</h2>
    <span class="small">${fmtDate(presDate)}${presDate===todayStr()?' (היום)':''}</span>
    <span class="spacer"></span>
    <div class="filters noprint">
      <button class="btn sec sm" onclick="presDate=addDays(presDate,-1);render()">◀ יום קודם</button>
      <button class="btn sec sm" onclick="presDate=todayStr();render()">היום</button>
      <button class="btn sec sm" onclick="presDate=addDays(presDate,1);render()">יום הבא ▶</button>
      <button class="btn sm" onclick="markRestPresent()">סמן את כל הנותרים "ביחידה"</button>
      <button class="btn sec sm" onclick="window.print()">הדפסה</button>
    </div>
  </div><div class="bd">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">
      <span class="pill p-info">דווחו: ${ps.marked}/${ps.total}</span>
      ${PRESENCE_STATUSES.filter(s=>ps.counts[s]).map(s=>`<span class="pill ${PRESENT_SET.has(s)?'p-good':(s==='נפקד'?'p-crit':'p-mut')}">${s}: ${ps.counts[s]}</span>`).join('')}
    </div>
    ${groups}
    <div class="small" style="margin-top:8px">דוח 1 מוגש מדי בוקר ומדווח את מצבת כוח האדם: מי ביחידה, במשימה מחוץ ליחידה, בחופשה, בגימלים או בקורס. נהג שאינו "ביחידה"/"במשימה" יסומן באזהרה אם שובץ למשימה באותו יום.</div>
  </div></div>`;
}
function setPresence(did,st){
  if(!S.presence[presDate])S.presence[presDate]={};
  S.presence[presDate][did]=S.presence[presDate][did]===st?null:st;
  if(!S.presence[presDate][did])delete S.presence[presDate][did];
  save();render();
}
function markRestPresent(){
  if(!S.presence[presDate])S.presence[presDate]={};
  S.drivers.forEach(d=>{if(!S.presence[presDate][d.id])S.presence[presDate][d.id]='ביחידה';});
  save();render();
}

/* ============================ vehicle pre-trip check ============================ */
function rVcheck(){
  if(r1draft)return rVcheckForm();
  const rows=[...S.reports].sort((a,b)=>a.date<b.date?1:-1).slice(0,60).map(r=>{
    const v=vById(r.vehicleId),d=dById(r.driverId);
    return `<tr>
      <td>${fmtDate(r.date)}</td>
      <td>${v?v.type+' צ׳ '+v.tz:'—'}</td>
      <td>${d?esc(d.name):'—'}</td>
      <td>${r.km?r.km.toLocaleString():'—'}</td>
      <td>${r.ok?'<span class="pill p-good">תקין</span>':'<span class="pill p-crit">נמצאו ליקויים</span>'}</td>
      <td class="wrap" style="max-width:260px">${esc(r.faultsText||'')}</td>
    </tr>`;}).join('');

  </div><div class="bd tblwrap">
    <table><thead><tr><th>תאריך</th><th>רכב</th><th>נהג</th><th>ק"מ</th><th>תוצאה</th><th>ליקויים</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6" class="empty">טרם מולאו בדיקות. הנהג ממלא בדיקת רכב לפני כל יציאה לנסיעה.</td></tr>'}</tbody></table>
  </div></div>`;
}
function startVcheck(){
  r1draft={driverId:'',vehicleId:'',km:'',items:{},faultsText:''};
  CHECK_ITEMS.forEach(c=>r1draft.items[c]=null);
  render();
}
function rVcheckForm(){
  const r=r1draft;
  const v=r.vehicleId?vById(r.vehicleId):null;
  const allAnswered=CHECK_ITEMS.every(c=>r.items[c]!==null);
  const hasBad=CHECK_ITEMS.some(c=>r.items[c]===false);
  return `<div class="panel"><div class="hd"><h2>בדיקת רכב לפני נסיעה — ${fmtDate(todayStr())}</h2><span class="spacer"></span>
    <button class="btn sec sm noprint" onclick="r1draft=null;render()">חזרה ליומן</button></div>
  <div class="bd">
    <div class="grid2" style="margin-bottom:12px">
      <div><label>נהג</label><select onchange="r1draft.driverId=this.value;render()">
        <option value="">בחר נהג…</option>
        ${S.drivers.map(d=>`<option value="${d.id}" ${r.driverId===d.id?'selected':''}>${d.name} (${d.company})</option>`).join('')}
      </select></div>
      <div><label>רכב</label><select onchange="r1draft.vehicleId=this.value;render()">
        <option value="">בחר רכב…</option>
        ${S.vehicles.filter(x=>x.category==='vehicle').map(x=>`<option value="${x.id}" ${r.vehicleId===x.id?'selected':''}>${x.type} צ׳ ${x.tz} (${x.company})</option>`).join('')}
      </select></div>
      <div><label>ק"מ בשעון</label><input type="number" value="${r.km}" onchange="r1draft.km=this.value"></div>
      ${v&&r.driverId&&!dById(r.driverId).permits.includes(v.permit)?`<div style="align-self:end"><span class="pill p-crit">⚠ לנהג אין היתר ל${v.permit}</span></div>`:''}
    </div>
    <div class="sec-title">פרטי בדיקה — סמן תקין / לא תקין לכל סעיף</div>
    <div class="checkgrid">
      ${CHECK_ITEMS.map((c,i)=>`<div class="chk"><span>${c}</span>
        <span class="opts">
          <button class="${r.items[c]===true?'ok':''}" onclick="r1draft.items['${c.replace(/'/g,"\\'")}']=true;render()">תקין</button>
          <button class="${r.items[c]===false?'bad':''}" onclick="r1draft.items['${c.replace(/'/g,"\\'")}']=false;render()">לא תקין</button>
        </span></div>`).join('')}
    </div>
    ${hasBad?`<div style="margin-top:12px"><label>פירוט הליקויים שנמצאו</label>
      <textarea rows="2" oninput="r1draft.faultsText=this.value">${esc(r.faultsText)}</textarea></div>`:''}
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center" class="noprint">
      <button class="btn" ${(!r.driverId||!r.vehicleId||!allAnswered)?'disabled style="opacity:.5"':''} onclick="submitVcheck()">חתימה והגשה</button>
      <span class="small">${!allAnswered?'יש לענות על כל הסעיפים':(hasBad?'ליקויים ייפתחו אוטומטית כתקלות ברכב':'')}</span>
    </div>
  </div></div>`;
}
function submitVcheck(){
  const r=r1draft;
  const bad=CHECK_ITEMS.filter(c=>r.items[c]===false);
  const rec={id:uid('r1'),date:todayStr(),driverId:r.driverId,vehicleId:r.vehicleId,km:+r.km||0,
    items:r.items,ok:bad.length===0,faultsText:bad.length?(r.faultsText||bad.join(', ')):''};
  S.reports.push(rec);
  const v=vById(r.vehicleId);
  if(v&&rec.km>v.km)v.km=rec.km;
  if(bad.length){
    S.faults.push({id:uid('f'),vehicleId:r.vehicleId,date:todayStr(),
      desc:'בדיקת רכב: '+bad.join(', ')+(r.faultsText?' — '+r.faultsText:''),
      severity:'לא משביתה',status:'פתוחה',reporter:dById(r.driverId)?.name||'נהג'});
  }
  r1draft=null; save(); render();
  alert(bad.length?'הבדיקה נקלטה. נפתחו תקלות לטיפול קצין הרכב.':'הבדיקה נקלטה — הרכב תקין ומאושר לנסיעה.');
}

/* ============================ trip & fuel log ============================ */

  </div><div class="bd tblwrap">
    <table><thead><tr><th>תאריך</th><th>רכב</th><th>נהג</th><th>מטרה</th><th>שעות</th><th>מרחק</th><th class="noprint"></th></tr></thead>
    <tbody>${open.map(tripRow).join('')}${closed.map(tripRow).join('')||(open.length?'':'<tr><td colspan="7" class="empty">אין נסיעות ביומן</td></tr>')}</tbody></table>
    <div class="small" style="margin-top:6px">סגירת נסיעה מעדכנת אוטומטית את מד הק"מ של הרכב במצבה.</div>
  </div></div>
  <div class="panel"><div class="hd">
    <h2>יומן תדלוק</h2><span class="pill p-info">החודש: ${monthLiters.toLocaleString()} ליטר</span><span class="spacer"></span>

  </div><div class="bd tblwrap">
    <table><thead><tr><th>תאריך</th><th>רכב</th><th>כמות</th><th>ק"מ בתדלוק</th><th>מקור</th></tr></thead>
    <tbody>${fuelRows||'<tr><td colspan="5" class="empty">אין תדלוקים ביומן</td></tr>'}</tbody></table>

function newTrip(){
  const vehOpts=S.vehicles.filter(v=>v.category==='vehicle'&&!openTrips().some(t=>t.vehicleId===v.id));
  openModal(`
    <div class="hd"><h3>יציאה לנסיעה</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div><label>רכב</label><select id="tp_v" onchange="const v=vById(this.value);if(v)document.getElementById('tp_ks').value=v.km">
        ${vehOpts.map(v=>`<option value="${v.id}">${v.type} צ׳ ${v.tz} (${v.company})${v.status!=='כשיר'?' — '+v.status:''}</option>`).join('')}</select></div>
      <div><label>נהג</label><select id="tp_d">${S.drivers.map(d=>`<option value="${d.id}">${d.name} (${d.company})</option>`).join('')}</select></div>
      <div class="full"><label>מטרת הנסיעה</label><input id="tp_p"></div>
      <div><label>שעת יציאה</label><input id="tp_t" type="time" value="${new Date().toTimeString().slice(0,5)}"></div>
      <div><label>ק"מ ביציאה</label><input id="tp_ks" type="number" value="${vehOpts.length?vehOpts[0].km:0}"></div>
    </div>
    <div class="ft"><button class="btn" onclick="saveTrip()">רישום יציאה</button><button class="btn sec" onclick="closeModal()">ביטול</button></div>`);
}
function saveTrip(){
  const g=i=>document.getElementById(i).value;
  if(!g('tp_v')){alert('אין רכב פנוי');return;}
  if(!g('tp_p').trim()){alert('חובה למלא מטרת נסיעה');return;}
  const v=vById(g('tp_v')),d=dById(g('tp_d'));

function closeTrip(id){
  const tp=S.trips.find(x=>x.id===id);
  const v=vById(tp.vehicleId);
  const kmEnd=prompt('ק"מ בחזרה עבור '+(v?v.type+' צ׳ '+v.tz:'')+':',v?v.km:tp.kmStart);

  if(+kmEnd<tp.kmStart){alert('ק"מ בחזרה קטן מהק"מ ביציאה');return;}
  tp.kmEnd=+kmEnd;tp.timeIn=new Date().toTimeString().slice(0,5);tp.open=false;
  if(v&&tp.kmEnd>v.km)v.km=tp.kmEnd;
  save();render();
}

  syncVehicleFromFaults(f.vehicleId);
  save();render();
}

  const f=S.faults.find(x=>x.id===id);
  f.status='טופלה';f.closedDate=todayStr();
  syncVehicleFromFaults(f.vehicleId);
  save();render();
}
function syncVehicleFromFaults(vid){
  const v=vById(vid);if(!v)return;
  const disabling=openFaults(vid).some(f=>f.severity==='משביתה');
  if(disabling)v.status='מושבת';
  else if(v.status==='מושבת')v.status='כשיר';
}

  return `<div class="panel"><div class="hd"><h2>ייצוא דוחות (CSV)</h2></div><div class="bd">

    </div>
    <textarea id="bk" rows="8" style="margin-top:12px" placeholder="כאן יופיע הגיבוי לייצוא, או הדבק כאן גיבוי לייבוא"></textarea>
  </div></div>`;
}
function exportCsv(kind){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  let rows=[];
  if(kind==='vehicles'){
    rows=[['צ׳','סוג','דגם','פלוגה','מצב','ק"מ','ק"מ לטיפול','טסט','ביטוח','מפתח','צל"ם חסר','הערות']];
    S.vehicles.forEach(v=>rows.push([v.tz,v.type,v.model,v.company,v.status,v.km,v.category==='trailer'?'':kmToService(v),v.testDate,v.insuranceDate,v.keyLocation,(v.missingEquip||[]).join(' | '),v.notes]));
  }else if(kind==='drivers'){
    rows=[['שם','מספר אישי','פלוגה','טלפון','רישיון אזרחי','תוקף אזרחי','תוקף צבאי','יום בטיחות','ציון בטיחות','היתרים']];
    S.drivers.forEach(d=>rows.push([d.name,d.personal,d.company,d.phone,d.civilClass,d.civilExpiry,d.militaryExpiry,d.safetyDay,driverScore(d),d.permits.join(' | ')]));
  }else if(kind==='presence'){
    const day=S.presence[todayStr()]||{};
    rows=[['תאריך','שם','מספר אישי','פלוגה','מצבה']];
    S.drivers.forEach(d=>rows.push([todayStr(),d.name,d.personal,d.company,day[d.id]||'טרם דווח']));
  }else if(kind==='trips'){
    rows=[['תאריך','צ׳','נהג','מטרה','יציאה','חזרה','ק"מ יציאה','ק"מ חזרה']];
    S.trips.forEach(t=>{const v=vById(t.vehicleId),d=dById(t.driverId);
      rows.push([t.date,v?v.tz:'',d?d.name:'',t.purpose,t.timeOut,t.timeIn,t.kmStart,t.kmEnd??'']);});
  }else if(kind==='fuels'){
    rows=[['תאריך','צ׳','ליטרים','ק"מ','מקור']];
    S.fuels.forEach(f=>{const v=vById(f.vehicleId);rows.push([f.date,v?v.tz:'',f.liters,f.km,f.source]);});
  }
  const ta=document.getElementById('bk');
  ta.value=rows.map(r=>r.map(q).join(',')).join('\n');
  ta.select();
  try{document.execCommand('copy');alert('ה-CSV הועתק ללוח — הדבק באקסל.');}catch(e){}
}
function exportData(){
  const ta=document.getElementById('bk');
  ta.value=JSON.stringify(S);
  ta.select();
  try{document.execCommand('copy');alert('הגיבוי הועתק ללוח. שמור אותו בקובץ.');}catch(e){alert('סמן והעתק את הטקסט ידנית.');}
}
function importData(){
  const ta=document.getElementById('bk');
  try{
    const d=JSON.parse(ta.value);
    if(!d.vehicles||!d.drivers)throw 0;
    if(!confirm('לייבא את הגיבוי? הנתונים הנוכחיים יוחלפו.'))return;
    migrate(d);
    S=d;save();render();alert('הגיבוי נטען בהצלחה.');
  }catch(e){alert('הטקסט שהודבק אינו גיבוי תקין.');}
}
function resetData(){
  if(!confirm('לאפס את כל הנתונים ולחזור לנתוני הדוגמה?'))return;
  S=seed();save();render();
}

/* ============================ documents ============================ */
function docsOf(type,id){return S.docs.filter(x=>x.ownerType===type&&x.ownerId===id);}
function handleDocUpload(type,id,input,reopen){
  const file=input.files&&input.files[0];
  if(!file)return;
  const isImg=file.type.startsWith('image/');
  const isPdf=file.type==='application/pdf';
  if(!isImg&&!isPdf){alert('ניתן להעלות תמונה או PDF בלבד');return;}
  const finish=dataUrl=>{
    if(dataUrl.length>1600000){alert('הקובץ גדול מדי גם אחרי דחיסה. צלם בתאורה טובה ונסה שוב.');return;}
    S.docs.push({id:uid('doc'),ownerType:type,ownerId:id,name:file.name,date:todayStr(),kind:isPdf?'pdf':'img',dataUrl});
    try{localStorage.setItem(LS_KEY,JSON.stringify(S));}
    catch(e){S.docs.pop();alert('אין מקום באחסון הדפדפן — מחק מסמכים ישנים או ייצא גיבוי ואפס.');return;}
    if(reopen)window[reopen](id);
  };
  if(isPdf){
    if(file.size>1200000){alert('PDF עד 1.2MB. סרוק באיכות נמוכה יותר או צלם תמונה.');input.value='';return;}
    const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file);
  }else{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1000;
        let w=img.width,h=img.height;
        if(Math.max(w,h)>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        finish(cv.toDataURL('image/jpeg',0.7));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }
  input.value='';
}
function delDoc(docId,type,id,reopen){
  if(!confirm('למחוק את המסמך?'))return;
  S.docs=S.docs.filter(x=>x.id!==docId);
  save();
  if(reopen)window[reopen](id);
}
function viewDoc(docId){
  const d=S.docs.find(x=>x.id===docId);
  if(!d)return;
  openModal(`
    <div class="hd"><h3>${esc(d.name)}</h3><span class="small" style="margin-inline-start:10px">הועלה ${fmtDate(d.date)}</span><span style="flex:1"></span><button class="x" onclick="closeModal()">✕</button></div>
    <div style="padding:10px;text-align:center;max-height:70vh;overflow:auto">
      ${d.kind==='pdf'?`<iframe src="${d.dataUrl}" style="width:100%;height:62vh;border:none"></iframe>`:`<img src="${d.dataUrl}" style="max-width:100%;border-radius:8px" alt="${esc(d.name)}">`}
    </div>`);
}
function docSection(type,id,reopen){
  const docs=docsOf(type,id);
  return `<div class="full"><div class="sec-title">מסמכים סרוקים (${docs.length}) — רישיונות, ביטוח, טפסים</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${docs.map(d=>`<span style="display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:3px 6px">
        ${d.kind==='img'?`<img src="${d.dataUrl}" style="height:40px;border-radius:4px;cursor:pointer" onclick="viewDoc('${d.id}')" alt="">`:`<button class="btn sm sec" onclick="viewDoc('${d.id}')">📄 PDF</button>`}
        <span class="small" style="max-width:110px;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}</span>
        <button class="x" style="font-size:14px" onclick="delDoc('${d.id}','${type}','${id}','${reopen}')">✕</button>
      </span>`).join('')}
      <label class="btn sec sm" style="display:inline-block">+ העלאת מסמך
        <input type="file" accept="image/*,application/pdf" style="display:none" onchange="handleDocUpload('${type}','${id}',this,'${reopen}')">
      </label>
    </div>
    <div class="small" style="margin-top:4px">תמונות נדחסות אוטומטית. האחסון מקומי לדפדפן — מומלץ לגבות.</div>
  </div>`;
}

/* ============================ modal helpers ============================ */
function openModal(html){
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');missionDraft=null;}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

load();render();
</script>
