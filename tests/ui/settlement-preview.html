<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POKERTEN — בדיקת התחשבנות מבודדת</title><link rel="stylesheet" href="assets/css/settlement.css"><style>body{margin:0;background:#07111f;color:#edf5fc;font-family:Arial,sans-serif;padding:24px}main{max-width:1150px;margin:auto}header.preview{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0}header.preview span{font-size:13px;color:#95a7be}a{color:#9be6d1}@media(max-width:500px){body{padding:14px}}</style><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script></head><body><main><header class="preview"><h1>מידע והתחשבנות</h1><span>נתוני בדיקה בלבד</span></header><div id="root"></div></main><script src="assets/js/poker-settlement-ui.js"></script><script>
const role=new URLSearchParams(location.search).get('role')||'owner',uid=role==='owner'?'owner':role==='agent'?'agentA':'A',at=Date.now(),cycle={id:'cycle_1',number:1,status:'open',startAt:at-86400000*2,endAt:at+86400000*5,autoClose:false};
const source=[['A','יונתן כהן',-200000,60000,685,18000,'agentA',15983],['B','דניאל לוי',120000,40000,520,0,'agentA',100000],['C','איתי מרום',-50000,25000,300,0,'agentA',42000],['D','אור שפירא',300000,200000,800,0,'agentB',350000]];
const details=source.map(([playerId,playerName,result,rake,hands,rakeback,agentId])=>({playerId,playerName,agentId,totals:{result,rake,hands,rakeback,games:1},rows:[{tableId:'NLH',tableName:'NLH 1/2 — שולחן 4',gameType:'NLH',kind:'cash',result,rake,hands,games:1}],opening:0,activity:result+rakeback,paid:0,closing:result+rakeback}));
const agents=[{agentId:'agentA',agentName:'איתי מרום',playersResult:-130000,rake:125000,hands:1505,commission:62500,earnings:44500,leadsIncome:0,opening:0,paid:0,toClub:67500,closing:67500,leads:[],players:[]},{agentId:'agentB',agentName:'מיכאל גולן',playersResult:300000,rake:200000,hands:800,commission:80000,earnings:80000,leadsIncome:0,opening:0,paid:0,toClub:-380000,closing:-380000,leads:[],players:[]}];
const player={playerId:'A',playerName:'יונתן כהן',totals:{result:-200000,hands:685,games:3},opening:0,paid:0,closing:-182000,hasRakeback:true,rakebackTotal:18000,rows:[{tableId:'nlh',tableName:'NLH 1/2 — שולחן 4',kind:'cash',result:-120000,hands:410,games:1},{tableId:'plo',tableName:'PLO 2/5 — שולחן 7',kind:'cash',result:-100000,hands:180,games:1},{tableId:'mtt',tableName:'טורניר יום חמישי',kind:'tournament',result:20000,hands:95,games:1}],counterparties:[{id:'agentA',name:'איתי מרום',closing:-182000}]};
if(new URLSearchParams(location.search).has('no-rb')){delete player.hasRakeback;delete player.rakebackTotal;player.closing=-200000;player.counterparties[0].closing=-200000;}
const report={active:true,role,clubPartyId:'owner',cycle,cycles:[cycle],currentCycleId:cycle.id,activatedAt:at-86400000*2,payments:[],approvals:[],...(role==='player'?{player,balance:15983}:role==='agent'?{player,agent:agents[0],details:details.filter(p=>p.agentId===uid),funds:source.filter(p=>p[6]===uid).map(p=>({uid:p[0],balance:p[7]}))}:{club:{totals:{playersResult:170000,rake:325000,commission:142500,leadsIncome:0,hands:2305,toClub:-312500,closing:-312500}},agents,details,funds:source.map(p=>({uid:p[0],balance:p[7]}))})};
const call=async(name,args)=>{if(name==='pkSettlementReport')return {...report,cycle:args.cycleId==='all'?{...cycle,id:'all',status:'all'}:cycle};if(name==='pkSettlementArchive')return{at:report.activatedAt,rows:source.filter(p=>role==='owner'||role==='agent'&&p[6]===uid||p[0]===uid).map(p=>({uid:p[0],name:p[1],balance:p[7]/100,result:p[2]/100,chips:p[7]/100}))};if(name==='pkSettlementTerms')return{role,members:source.map(p=>({uid:p[0],name:p[1],role:'player',status:'approved',primaryAgentId:p[6],rakebackPct:p[0]==='A'?30:0})).concat(agents.map(a=>({uid:a.agentId,name:a.agentName,role:'agent',status:'approved',agentPct:a.agentId==='agentA'?50:40})))};if(name==='pkSettlement'){if(args.action==='payment')report.payments.push({id:'preview-payment',amount:Math.round(args.amount*100),fromId:args.fromId,toId:args.toId,status:'pending',createdBy:uid,at:Date.now(),canConfirm:false,note:args.note});return{ok:true};}throw Error('Unknown preview operation');};
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(new URLSearchParams(location.search).has('terms')?PokerSettlement.SettlementMembers:PokerSettlement.Settlement,{user:{uid,role},clubId:'isolated-preview',call}));
</script></body></html>
